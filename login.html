<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#f9fafb;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:100%;
      max-width:360px;
      text-align:center;
      padding:20px;
    }

    .logo img{
      width:180px;
      height:180px;
      object-fit:contain;
      margin-bottom:30px;
    }

    .input-group{
      position:relative;
      margin-bottom:15px;
    }

    .input-group i{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:#999;
    }

    .input-group input{
      width:100%;
      padding:13px 15px 13px 42px;
      border:1px solid #ddd;
      border-radius:8px;
      outline:none;
      font-size:15px;
      transition:.3s;
    }

    .input-group input:focus{
      border-color:#db7419;
      box-shadow:0 0 5px rgba(219,116,25,.3);
    }

    button{
      width:100%;
      padding:13px;
      border:none;
      border-radius:8px;
      background:#000;
      color:#fff;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      background:#db7419;
    }

    .links{
      margin-top:18px;
    }

    .links a{
      text-decoration:none;
      color:#007bff;
      font-size:14px;
    }

    .links a:hover{
      text-decoration:underline;
    }
  </style>

</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="usuario" placeholder="Usuario">
    </div>

    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="clave" placeholder="Contraseña">
    </div>

    <button onclick="login()">ENTRAR</button>

    <div class="links">
        <a href="#">Olvidé mi contraseña</a>
    </div>

</div>

<script>

const users={
    "Admin":{
        password:"1234",
        nombre:"Administrador"
    },
    "Juan":{
        password:"1234",
        nombre:"Juan Pérez"
    }
};

document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        login();
    }
});

function login(){

    const usuario=document.getElementById("usuario").value.trim();
    const clave=document.getElementById("clave").value;

    if(usuario===""||clave===""){

        Swal.fire({
            toast:true,
            position:"top",
            icon:"warning",
            title:"Complete usuario y contraseña",
            timer:1600,
            showConfirmButton:false
        });

        return;
    }

    const user=users[usuario];

    if(user && user.password===clave){

        localStorage.setItem("rol",usuario);
        localStorage.setItem("nombreUsuario",user.nombre);

        localStorage.setItem("usuarioSesion",JSON.stringify({
            nombre:user.nombre,
            usuario:usuario
        }));

        localStorage.setItem("currentUser",JSON.stringify({
            name:user.nombre,
            username:usuario,
            role:usuario
        }));

        Swal.fire({
            toast:true,
            position:"top",
            icon:"success",
            title:"¡Bienvenido!",
            timer:1700,
            showConfirmButton:false

        }).then(()=>{

            window.location.href="menu.html";

        });

    }else{

        Swal.fire({
            toast:true,
            position:"top",
            icon:"error",
            title:"Usuario o contraseña incorrectos",
            timer:1800,
            showConfirmButton:false
        });

    }

}

</script>

</body>
</html>
