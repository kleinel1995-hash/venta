<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Principal</title>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background: #f4f4f4; color: #333; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* Header */
    .header-top {
      background: #000000; position: fixed; top: 0; width: 100%;
      padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); z-index: 1000;
    }
    .profile .user-name { font-weight: 600; font-size: 18px; color: #ffffff; }
    .profile .user-role { font-size: 14px; color: #ffffff; }
    .help-btn {
      background: #e53935; color: white; border: none; border-radius: 50%;
      width: 36px; height: 36px; font-size: 20px; cursor: pointer;
    }

    /* Main */
    .container { padding: 20px; margin-top: 80px; margin-bottom: 120px; text-align: center; }
    h2 { font-size: 22px; color: #007aff; margin-bottom: 20px; }
    .info { display: grid; gap: 12px; max-width: 560px; margin: 0 auto 10px; }
    .info div {
      background: #fff; padding: 14px 18px; border-radius: 12px;
      font-size: 17px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex; justify-content: space-between; align-items: center;
    }

    /* Botonera */
    .botones { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
    .botones button {
      width: 100%; padding: 14px; font-size: 16px; color: #fff; background-color: #000000;
      border: none; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,122,255,0.3);
      transition: 0.2s ease;
    }
    .botones button:hover { transform: translateY(-1px); opacity: .95; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #ddd;
      display: flex; justify-content: space-around; padding: 10px 0;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.05); z-index: 999;
    }
    .nav-item {
      text-decoration: none; color: #666; font-size: 13px;
      display: flex; flex-direction: column; align-items: center; min-width: 60px; position: relative;
      transition: color .15s ease;
    }
    .nav-item svg { width: 28px; height: 28px; margin-bottom: 3px; fill: #666; transition: fill .15s ease, transform .15s ease; }
    .label { margin-top: 2px; font-size: 12px; }

    .nav-item:hover { color: #000; }
    .nav-item:hover svg { fill: #000; transform: translateY(-1px); }
    .nav-item.active { color: #db7419; font-weight: 700; }
    .nav-item.active svg { fill: #db7419; }

    .badge {
      width: 20px; height: 20px; position: absolute; top: -10px; right: 1px;
      background: #25D366; color: white; font-size: 13px; font-weight: bold; padding: 2px; border-radius: 50%;
      display: none;
    }

    /* Burbuja Usuario (se mantiene) */
    .badge-user{
      position: absolute;
      top: -8px;
      right: 6px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      background: #FF9800;
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    @media (max-width: 420px){
      .info div, .botones button { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header-top">
    <div class="profile">
      <span class="user-name" id="nombreUsuario">Cargando...</span><br>
      <span class="user-role" id="rolUsuario">Administrador</span>
    </div>
    <button class="help-btn" onclick="borrarDatos()">?</button>
  </header>

  <!-- CONTENIDO -->
  <main class="container">
    <h2>Panel de Control</h2>
    <div class="info">
      <div><strong>Ventas (hoy):</strong> <span id="ventas">$0.00</span></div>
      <div><strong>Cuentas por Cobrar:</strong> <span id="cobros">$0.00</span></div>
      <div><strong>Pedidos:</strong> <span id="pedidos">0</span></div>
      <div><strong>Clientes:</strong> <span id="clientes">0</span></div>
    </div>

    <div class="botones">
      <button onclick="location.href='Clientes.html'">+ Nuevo Pedido</button>
      <button onclick="location.href='mapa.html'">📍 Ver Mapa</button>
      <button onclick="verAdminProductos()">⚙️ Administrar Productos</button>
    </div>
  </main>

  <!-- MENÚ INFERIOR -->
  <nav class="bottom-nav">
    <a href="menu.html" class="nav-item active" aria-current="page">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
      <div class="label">Inicio</div>
    </a>

    <a href="inventario.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M320-280q17 0 28.5-11.5T360-320q0-17-11.5-28.5T320-360q-17 0-28.5 11.5T280-320q0 17 11.5 28.5T320-280Zm0-160q17 0 28.5-11.5T360-480q0-17-11.5-28.5T320-520q-17 0-28.5 11.5T280-480q0 17 11.5 28.5T320-440Zm0-160q17 0 28.5-11.5T360-640q0-17-11.5-28.5T320-680q-17 0-28.5 11.5T280-640q0 17 11.5 28.5T320-600Zm120 320h240v-80H440v80Zm0-160h240v-80H440v80Zm0-160h240v-80H440v80ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg>
      <div class="label">Inventario</div>
    </a>

    <a href="Carrito.html" class="nav-item" id="nav-carrito" style="position:relative;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="M280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM246-720l96 200h280l110-200H246Zm-38-80h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Zm134 280h280-280Z"/>
      </svg>
      <span class="badge" id="cart-count">0</span>
      <div class="label">Carrito</div>
    </a>

    <a href="Usuario.html" class="nav-item" id="nav-usuario" style="position:relative;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/>
      </svg>
      <!-- Burbuja Usuario -->
      <span class="badge-user" id="user-count">0</span>
      <div class="label">Usuario</div>
    </a>
  </nav>

  <!-- SCRIPTS -->

<script>
  // ---------- Helpers de identidad ----------
  function normaliza(x){ return String(x||'').trim().toLowerCase(); }

  function getIdentidadesUsuario() {
    const posibles = new Set();

    const nombreUsuario = localStorage.getItem('nombreUsuario');
    if (nombreUsuario) posibles.add(normaliza(nombreUsuario));

    try {
      const us = JSON.parse(localStorage.getItem('usuarioSesion')||'null');
      if (us?.nombre)  posibles.add(normaliza(us.nombre));
      if (us?.usuario) posibles.add(normaliza(us.usuario));
    } catch(e){}

    try {
      const cu = JSON.parse(localStorage.getItem('currentUser')||'null');
      if (cu?.name)     posibles.add(normaliza(cu.name));
      if (cu?.username) posibles.add(normaliza(cu.username));
      if (cu?.role)     posibles.add(normaliza(cu.role));
    } catch(e){}

    const rol = localStorage.getItem('rol');
    if (rol) posibles.add(normaliza(rol));

    return posibles;
  }

  function esDelUsuario(registro, identidades){
    const candidato =
      registro?.vendedor ??
      registro?.usuario ??
      registro?.creadoPor ??
      registro?.owner ??
      null;

    if (!candidato) return false;
    return identidades.has(normaliza(candidato));
  }

  // ✅ Admin si rol es "admin" o "administrador"
  function esAdminActual(){
    const rolActual = normaliza(localStorage.getItem('rol'));
    return rolActual === 'admin' || rolActual === 'administrador';
  }

  // Proteger acceso por nombre guardado
  (function initNombre(){
    const nombre = localStorage.getItem('nombreUsuario');
    if (!nombre) { window.location.href = "login.html"; return; }
    document.getElementById('nombreUsuario').textContent = nombre;

    const rol = localStorage.getItem('rol');
    if (rol) document.getElementById('rolUsuario').textContent = rol;
  })();

  document.addEventListener("DOMContentLoaded", () => {
    const identidades = getIdentidadesUsuario();
    const admin = esAdminActual();

    const ventas = JSON.parse(localStorage.getItem("ventasRealizadas")) || [];
    const historial = JSON.parse(localStorage.getItem("historialPedidos")) || [];
    const clientes = JSON.parse(localStorage.getItem("clientes")) || [];
    const cuentasPorCobrar = JSON.parse(localStorage.getItem("cuentasPorCobrar")) || [];

    // ---------- Fecha (hoy) ----------
    function parseEsDo(fechaStr){
      if(!fechaStr) return null;
      const parts = String(fechaStr).split(',');
      const dmy = (parts[0]||'').trim();
      const hms = (parts[1]||'0:0:0').trim();
      const [d,m,y] = dmy.split('/').map(n => parseInt(n,10));
      if(!y || !m || !d){
        const alt = new Date(fechaStr);
        return isNaN(alt) ? null : alt;
      }
      const [hh=0,mm=0,ss=0] = hms.split(':').map(n => parseInt(n,10));
      return new Date(y, m-1, d, hh, mm, ss);
    }
    function esMismoDia(a, b) {
      return a.getFullYear()===b.getFullYear() &&
             a.getMonth()===b.getMonth() &&
             a.getDate()===b.getDate();
    }
    const hoy = new Date();

    // ✅ 1) VENTAS de HOY (admin: todas, usuario: solo las suyas)
    const totalVentasHoy = ventas.reduce((acc, v) => {
      const dt = parseEsDo(v.fecha);
      if (!dt || !esMismoDia(dt, hoy)) return acc;

      if (admin) return acc + Number(v.total || 0);
      return esDelUsuario(v, identidades) ? acc + Number(v.total || 0) : acc;
    }, 0);

    // ✅ 2) CUENTAS POR COBRAR (admin: todas, usuario: solo las suyas) + opcional: solo HOY
    // Si quieres que cuente SOLO las de hoy, deja el filtro de fecha.
    const cobrosFiltrados = (cuentasPorCobrar || []).filter(c => {
      // --- SOLO HOY (igual que ventas) ---
      const dt = parseEsDo(c.fecha);
      const esHoy = dt ? esMismoDia(dt, hoy) : true; // si no trae fecha, no la bloquea
      if (!esHoy) return false;

      // --- por rol ---
      if (admin) return true;
      return esDelUsuario(c, identidades);
    });

    const totalCobros = cobrosFiltrados.reduce((acc, c) => acc + Number(c.total || c.monto || 0), 0);

    // ✅ 3) PEDIDOS de HOY (admin: todos, usuario: solo los suyos)
    const pedidosFiltrados = (historial || []).filter(p => {
      const dt = parseEsDo(p.fecha);
      if (!dt || !esMismoDia(dt, hoy)) return false;

      if (admin) return true;
      return esDelUsuario(p, identidades);
    });

    // ---------- Pintar en pantalla ----------
    document.getElementById("ventas").textContent =
      "$" + totalVentasHoy.toLocaleString(undefined, { minimumFractionDigits: 2 });

    document.getElementById("cobros").textContent =
      "$" + totalCobros.toLocaleString(undefined, { minimumFractionDigits: 2 });

    document.getElementById("pedidos").textContent = pedidosFiltrados.length;
    document.getElementById("clientes").textContent = clientes.length;

    actualizarContadorCarrito();
    actualizarBurbujaUsuario(pedidosFiltrados);
  });

  function verAdminProductos() {
    const pass = prompt("Ingrese la contraseña para acceder a administración de productos:");
    if (pass === "1234") window.location.href = "productos.html";
    else alert("Contraseña incorrecta.");
  }

  function borrarDatos() {
    Swal.fire({
      title: '¿Borrar todos los datos?',
      text: 'Esta acción eliminará todos los registros de la app (clientes, ventas, productos, historial).',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Sí, borrar todo',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        localStorage.clear();
        Swal.fire({
          title: '¡Listo!',
          text: 'Todos los datos han sido eliminados.',
          icon: 'success',
          confirmButtonText: 'Aceptar'
        }).then(() => window.location.href = "login.html");
      }
    });
  }

  // --------- Contadores ---------

  function actualizarContadorCarrito() {
    const badge = document.getElementById("cart-count");
    const carrito = JSON.parse(localStorage.getItem('cart')) || [];
    const total = carrito.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
    badge.textContent = total;
    badge.style.display = total > 0 ? 'inline-block' : 'none';
  }

  // ✅ burbuja usuario basada en pedidos filtrados del día
  function actualizarBurbujaUsuario(pedidosFiltradosDelDia){
    const el = document.getElementById('user-count');
    if (!el) return;

    const pedidos = Array.isArray(pedidosFiltradosDelDia)
      ? pedidosFiltradosDelDia
      : (JSON.parse(localStorage.getItem('historialPedidos')) || []);

    const estadosPend = ['pendiente','en proceso','por entregar','no entregado'];
    const pendientes = pedidos.filter(p => estadosPend.includes(String(p.estado||'').toLowerCase())).length;
    const count = pendientes > 0 ? pendientes : pedidos.length;

    el.textContent = count;
    el.style.display = count > 0 ? 'inline-block' : 'none';
  }

  // Reactividad (cuando cambian datos en otras pestañas)
  window.addEventListener('storage', (e) => {
    if (e.key === 'cart') actualizarContadorCarrito();
    if (e.key === 'historialPedidos') {
      // Recalcula todo al cambiar pedidos
      location.reload();
    }
    if (e.key === 'ventasRealizadas' || e.key === 'cuentasPorCobrar') {
      location.reload();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      actualizarContadorCarrito();
    }
  });
</script>
</body>
</html>
