<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Producto</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #f4f4f4;
    }
    .app-header {
      background-color: #000000;
      display: flex;
      align-items: center;
      padding: 15px;
      gap: 10px;
      color: white;
    }
    .app-header h1 {
      font-size: 18px;
      margin: 0;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: white;
      cursor: pointer;
    }
    .form-container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .upload-box {
      background: #e6f0ff;
      border: 2px dashed #3399ff;
      color: #3399ff;
      text-align: center;
      padding: 30px;
      cursor: pointer;
      border-radius: 10px;
    }
    .upload-box #preview {
      font-size: 16px;
    }
    input[type="text"],
    input[type="number"] {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .create-btn {
      width:50%;
      align-item:center;
      padding: 15px;
      background-color: #000000;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    }
    .info {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>Crear producto</h1>
  </header>
  <main class="form-container">
    <label class="upload-box">
      <input type="file" accept="image/*" hidden onchange="previewImage(event)" />
      <div id="preview">Cargar imagen</div>
    </label>
    <label>Nombre del producto *</label>
    <input type="text" id="nameInput" placeholder="Nombre" />
    <label>Cantidad disponible</label>
    <input type="number" id="quantityInput" placeholder="Cantidad" />
    <label>Precio *</label>
    <input type="number" id="priceInput" placeholder="Precio" />
    <label>Costo <span class="info">(opcional)</span></label>
    <input type="number" id="costInput" placeholder="costo" />
    <label>Categoría</label>
    <input type="text" id="categoryInput" placeholder="Ej: Alimentos" />
    <button class="create-btn">Crear producto</button>
  </main>
  <script>
    function previewImage(event) {
      const preview = document.getElementById('preview');
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          preview.innerHTML = `<img src="${reader.result}" style="width:100%; border-radius:10px;" />`;
          preview.dataset.image = reader.result;
        };
        reader.readAsDataURL(file);
      }
    }
    document.querySelector('.create-btn').addEventListener('click', () => {
      const nameInput = document.getElementById('nameInput');
      const quantityInput = document.getElementById('quantityInput');
      const priceInput = document.getElementById('priceInput');
      const costInput = document.getElementById('costInput');
      const categoryInput = document.getElementById('categoryInput');
      const preview = document.getElementById('preview');
      const product = {
        image: preview.dataset.image || '',
        name: nameInput.value.trim(),
        quantity: parseInt(quantityInput.value) || 0,
        price: parseFloat(priceInput.value) || 0,
        cost: parseFloat(costInput.value) || 0,
        category: categoryInput.value.trim()
      };
      if (!product.name || !product.price) {
        alert('El nombre y el precio son obligatorios');
        return;
      }
      let products = JSON.parse(localStorage.getItem('products')) || [];
      products.push(product);
      localStorage.setItem('products', JSON.stringify(products));
      alert('✅ Producto guardado con éxito');
      nameInput.value = '';
      quantityInput.value = '';
      priceInput.value = '';
      costInput.value = '';
      categoryInput.value = '';
      preview.innerHTML = 'Cargar imagen';
      delete preview.dataset.image;
    });
  </script>
</body>
</html>
