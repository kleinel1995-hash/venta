<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cuentas por Cobrar</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --yellow: #b77900;
      --yellow-light: #fff4cc;
      --red: #e52424;
      --red-light: #ffeaea;
      --gray-light: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
      padding-bottom: 45px;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-title span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      text-decoration: none;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.refresh {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    /* CONTENIDO */

    .container {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 22px 16px;
    }

    .page-heading {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .page-heading h1 {
      color: #111;
      font-size: 23px;
    }

    .accounts-count {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* LISTA DE CUENTAS */

    #cuentasContainer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .cuenta {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid #ededed;
      border-radius: 21px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cuenta:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 30px rgba(0, 0, 0, 0.11);
    }

    .cuenta-header {
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .cuenta-heading {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cuenta-icon {
      width: 49px;
      height: 49px;
      border-radius: 16px;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .cuenta-title {
      min-width: 0;
    }

    .cuenta-title strong {
      display: block;
      color: #111;
      font-size: 16px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .cuenta-title span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-badge {
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--yellow-light);
      color: var(--yellow);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* CLIENTE */

    .cliente-info {
      margin-bottom: 15px;
      padding: 14px;
      border: 1px solid #e8ecef;
      border-radius: 16px;
      background: #f8fafb;
      display: grid;
      gap: 9px;
    }

    .cliente-info p {
      margin: 0;
      color: #4b5563;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .cliente-info p i {
      width: 17px;
      margin-top: 2px;
      color: var(--orange);
      text-align: center;
      flex-shrink: 0;
    }

    .cliente-info strong {
      color: #111;
    }

    /* PRODUCTOS */

    .products-title {
      margin-bottom: 9px;
      color: #111;
      font-size: 13px;
      font-weight: 800;
    }

    .producto {
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .producto:last-child {
      border-bottom: none;
    }

    .producto-icon {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .producto-info {
      min-width: 0;
      flex: 1;
    }

    .producto-info strong {
      display: block;
      margin-bottom: 5px;
      color: #111;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .producto-info span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    /* TOTAL */

    .total-card {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #101010, #242424);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .total-card span {
      color: #c7c7c7;
      font-size: 12px;
      font-weight: 700;
    }

    .total-card strong {
      color: var(--orange);
      font-size: 20px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    /* BOTONES */

    .button-row {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .saldar-btn,
    .abonar-btn {
      min-height: 48px;
      padding: 10px 14px;
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .saldar-btn {
      background: var(--green-light);
      color: var(--green);
    }

    .abonar-btn {
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      box-shadow: 0 5px 15px rgba(242, 106, 33, 0.24);
    }

    .saldar-btn:active,
    .abonar-btn:active {
      transform: scale(0.97);
    }

    /* HISTORIAL DE ABONOS */

    .abonos {
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #f0d8b5;
      border-radius: 16px;
      background: #fff8ec;
    }

    .abonos-title {
      margin-bottom: 9px;
      color: var(--yellow);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 900;
    }

    .abono-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(183, 121, 0, 0.16);
      color: #675122;
      font-size: 12px;
      line-height: 1.5;
    }

    .abono-item:last-child {
      border-bottom: none;
    }

    /* SIN CUENTAS */

    .empty-state {
      grid-column: 1 / -1;
      min-height: 360px;
      padding: 40px 20px;
      border: 1px solid #ededed;
      border-radius: 22px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .empty-icon {
      width: 125px;
      height: 125px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .empty-state h3 {
      margin-bottom: 7px;
      color: #111;
      font-size: 20px;
    }

    .empty-state p {
      max-width: 330px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* RESPONSIVE */

    @media (max-width: 820px) {
      #cuentasContainer {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        padding-top: 70px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
        grid-template-columns: 45px minmax(0, 1fr) 45px;
        gap: 8px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        border-radius: 14px;
        font-size: 19px;
      }

      .header-title {
        gap: 8px;
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      .container {
        padding: 17px 10px;
      }

      .page-heading h1 {
        font-size: 20px;
      }

      .cuenta {
        padding: 15px;
      }

      .cuenta-icon {
        width: 45px;
        height: 45px;
        font-size: 19px;
      }
    }

    @media (max-width: 390px) {
      .header-title span {
        font-size: 16px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }

      .status-badge {
        padding-inline: 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <a
      href="Usuario.html"
      class="header-button"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="header-title">
      <i class="fa-solid fa-hand-holding-dollar"></i>
      <span>Cuentas por Cobrar</span>
    </div>

    <button
      type="button"
      class="header-button refresh"
      onclick="recargarCuentas()"
      aria-label="Actualizar cuentas"
    >
      <i class="fa-solid fa-rotate"></i>
    </button>

  </header>

  <main class="container">

    <div class="page-heading">

      <h1>Cuentas pendientes</h1>

      <span
        class="accounts-count"
        id="accountsCount"
      >
        0 cuentas
      </span>

    </div>

    <div id="cuentasContainer"></div>

  </main>

  <script>
    let cuentas =
      JSON.parse(
        localStorage.getItem(
          "cuentasPorCobrar"
        )
      ) || [];

    let ventas =
      JSON.parse(
        localStorage.getItem(
          "ventasRealizadas"
        )
      ) || [];

    const container =
      document.getElementById(
        "cuentasContainer"
      );

    const accountsCount =
      document.getElementById(
        "accountsCount"
      );

    function formatearMoneda(valor) {
      return Number(
        valor || 0
      ).toLocaleString(
        "es-DO",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
    }

    function escaparHTML(valor) {
      return String(valor || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCuentas() {
      container.innerHTML = "";

      accountsCount.textContent =
        cuentas.length === 1
          ? "1 cuenta"
          : `${cuentas.length} cuentas`;

      if (cuentas.length === 0) {
        container.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              <i class="fa-solid fa-wallet"></i>
            </div>

            <h3>No hay cuentas por cobrar</h3>

            <p>
              Las ventas registradas a crédito aparecerán en esta sección.
            </p>

          </div>
        `;

        return;
      }

      cuentas.forEach(
        (cuenta, index) => {
          const cliente =
            cuenta.clienteInfo || {
              negocio:
                "No disponible",

              telefono:
                "-",

              direccion:
                "-",

              correo:
                "-"
            };

          const abonos =
            cuenta.abonos || [];

          const productos =
            Array.isArray(
              cuenta.productos
            )
              ? cuenta.productos
              : [];

          const productosHtml =
            productos.map(
              producto => {
                const cantidad =
                  Number(
                    producto.cantidad || 0
                  );

                const precio =
                  Number(
                    producto.precio || 0
                  );

                const subtotal =
                  producto.subtotal != null
                    ? Number(
                        producto.subtotal
                      )
                    : precio *
                      cantidad;

                return `
                  <div class="producto">

                    <div class="producto-icon">
                      <i class="fa-solid fa-box"></i>
                    </div>

                    <div class="producto-info">

                      <strong>
                        ${escaparHTML(
                          producto.nombre ||
                          "Producto"
                        )}
                      </strong>

                      <span>
                        Cantidad:
                        ${cantidad.toLocaleString(
                          "es-DO"
                        )}
                      </span>

                      <span>
                        Precio:
                        $${formatearMoneda(
                          precio
                        )}
                      </span>

                      <span>
                        Subtotal:
                        $${formatearMoneda(
                          subtotal
                        )}
                      </span>

                    </div>

                  </div>
                `;
              }
            ).join("");

          const abonosHtml =
            abonos.map(
              (abono, i) => `
                <div class="abono-item">
                  <strong>
                    Abono ${i + 1}:
                  </strong>

                  $${formatearMoneda(
                    abono.monto
                  )}

                  <br>

                  ${escaparHTML(
                    abono.fecha || "-"
                  )}
                </div>
              `
            ).join("");

          const div =
            document.createElement(
              "article"
            );

          div.className =
            "cuenta";

          div.innerHTML = `
            <div class="cuenta-header">

              <div class="cuenta-heading">

                <div class="cuenta-icon">
                  <i class="fa-solid fa-file-invoice-dollar"></i>
                </div>

                <div class="cuenta-title">

                  <strong>
                    ${escaparHTML(
                      cliente.negocio ||
                      cliente.nombre ||
                      "Cliente"
                    )}
                  </strong>

                  <span>
                    ${escaparHTML(
                      cuenta.fecha ||
                      "Fecha no disponible"
                    )}
                  </span>

                </div>

              </div>

              <span class="status-badge">
                Pendiente
              </span>

            </div>

            <div class="cliente-info">

              <p>
                <i class="fa-solid fa-store"></i>

                <span>
                  <strong>Cliente:</strong>

                  ${escaparHTML(
                    cliente.negocio ||
                    cliente.nombre ||
                    "No disponible"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-phone"></i>

                <span>
                  <strong>Teléfono:</strong>

                  ${escaparHTML(
                    cliente.telefono ||
                    "-"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-location-dot"></i>

                <span>
                  <strong>Dirección:</strong>

                  ${escaparHTML(
                    cliente.direccion ||
                    "-"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-envelope"></i>

                <span>
                  <strong>Correo:</strong>

                  ${escaparHTML(
                    cliente.correo ||
                    "-"
                  )}
                </span>
              </p>

            </div>

            <div class="products-title">
              Productos de la cuenta
            </div>

            ${
              productosHtml ||
              `
                <p style="
                  color:#737985;
                  font-size:13px;
                ">
                  No hay productos registrados.
                </p>
              `
            }

            <div class="total-card">

              <span>
                Total adeudado
              </span>

              <strong>
                $${formatearMoneda(
                  cuenta.total
                )}
              </strong>

            </div>

            <div class="button-row">

              <button
                type="button"
                class="saldar-btn"
                onclick="saldarCuenta(${index})"
              >
                <i class="fa-solid fa-circle-check"></i>
                Saldar
              </button>

              <button
                type="button"
                class="abonar-btn"
                onclick="abonarCuenta(${index})"
              >
                <i class="fa-solid fa-money-bill-transfer"></i>
                Abonar
              </button>

            </div>

            ${
              abonosHtml
                ? `
                  <div class="abonos">

                    <div class="abonos-title">
                      <i class="fa-solid fa-clock-rotate-left"></i>
                      Historial de abonos
                    </div>

                    ${abonosHtml}

                  </div>
                `
                : ""
            }
          `;

          container.appendChild(
            div
          );
        }
      );
    }

    function saldarCuenta(index) {
      const cuenta =
        cuentas[index];

      ventas.push(cuenta);

      cuentas.splice(
        index,
        1
      );

      localStorage.setItem(
        "cuentasPorCobrar",
        JSON.stringify(cuentas)
      );

      localStorage.setItem(
        "ventasRealizadas",
        JSON.stringify(ventas)
      );

      Swal.fire({
        position:
          "center",

        icon:
          "success",

        title:
          "Cuenta saldada",

        text:
          "El pedido ha sido saldado y movido a ventas.",

        timer:
          2500,

        showConfirmButton:
          false
      });

      renderCuentas();
    }

    function abonarCuenta(index) {
      const cuenta =
        cuentas[index];

      Swal.fire({
        position:
          "center",

        title:
          "Abonar a la cuenta",

        input:
          "number",

        inputLabel:
          "Ingrese el monto a abonar:",

        inputPlaceholder:
          "Monto en $",

        inputAttributes: {
          min:
            1,

          step:
            0.01
        },

        showCancelButton:
          true,

        confirmButtonText:
          "Abonar",

        cancelButtonText:
          "Cancelar",

        confirmButtonColor:
          "#f26a21",

        cancelButtonColor:
          "#737985",

        inputValidator:
          value => {
            if (
              !value ||
              isNaN(value) ||
              parseFloat(value) <= 0
            ) {
              return "Ingrese un monto válido";
            }
          }
      }).then(result => {
        if (!result.isConfirmed) {
          return;
        }

        const monto =
          parseFloat(
            result.value
          );

        if (
          monto >= cuenta.total
        ) {
          cuenta.abonos =
            cuenta.abonos || [];

          cuenta.abonos.push({
            monto:
              cuenta.total,

            fecha:
              new Date().toLocaleString()
          });

          const totalAbonado =
            cuenta.abonos.reduce(
              (sum, abono) =>
                sum +
                Number(
                  abono.monto || 0
                ),
              0
            );

          const detalles =
            cuenta.abonos.map(
              (abono, i) => `
                <div style="
                  padding:9px 0;
                  border-bottom:1px solid #ececec;
                  text-align:left;
                ">
                  <strong>
                    Abono ${i + 1}:
                  </strong>

                  $${formatearMoneda(
                    abono.monto
                  )}

                  <br>

                  <span style="
                    color:#737985;
                    font-size:12px;
                  ">
                    ${escaparHTML(
                      abono.fecha
                    )}
                  </span>
                </div>
              `
            ).join("");

          ventas.push(cuenta);

          cuentas.splice(
            index,
            1
          );

          Swal.fire({
            position:
              "center",

            icon:
              "success",

            title:
              "Cuenta saldada",

            html: `
              <div style="
                color:#4b5563;
                line-height:1.7;
              ">

                <p>
                  <strong>
                    Total abonado:
                  </strong>

                  $${formatearMoneda(
                    totalAbonado
                  )}
                </p>

                <div style="
                  margin-top:12px;
                  padding:12px;
                  border-radius:14px;
                  background:#f8f9fa;
                ">
                  ${detalles}
                </div>

              </div>
            `,

            width:
              420,

            confirmButtonText:
              "Aceptar",

            confirmButtonColor:
              "#f26a21"
          });
        } else {
          cuenta.total -=
            monto;

          cuenta.abonos =
            cuenta.abonos || [];

          cuenta.abonos.push({
            monto,

            fecha:
              new Date().toLocaleString()
          });

          Swal.fire({
            position:
              "center",

            icon:
              "success",

            title:
              "Abono registrado",

            html: `
              <div style="
                color:#4b5563;
                line-height:1.7;
              ">
                Se abonó

                <strong style="
                  color:#159638;
                ">
                  $${formatearMoneda(
                    monto
                  )}
                </strong>.

                <br>

                Restan

                <strong style="
                  color:#e52424;
                ">
                  $${formatearMoneda(
                    cuenta.total
                  )}
                </strong>.
              </div>
            `,

            timer:
              2200,

            showConfirmButton:
              false
          });
        }

        localStorage.setItem(
          "cuentasPorCobrar",
          JSON.stringify(cuentas)
        );

        localStorage.setItem(
          "ventasRealizadas",
          JSON.stringify(ventas)
        );

        renderCuentas();
      });
    }

    function recargarCuentas() {
      cuentas =
        JSON.parse(
          localStorage.getItem(
            "cuentasPorCobrar"
          )
        ) || [];

      ventas =
        JSON.parse(
          localStorage.getItem(
            "ventasRealizadas"
          )
        ) || [];

      renderCuentas();

      Swal.fire({
        position:
          "center",

        icon:
          "success",

        title:
          "Cuentas actualizadas",

        showConfirmButton:
          false,

        timer:
          1200
      });
    }

    window.addEventListener(
      "storage",
      event => {
        if (
          event.key ===
          "cuentasPorCobrar"
        ) {
          cuentas =
            JSON.parse(
              localStorage.getItem(
                "cuentasPorCobrar"
              )
            ) || [];

          renderCuentas();
        }

        if (
          event.key ===
          "ventasRealizadas"
        ) {
          ventas =
            JSON.parse(
              localStorage.getItem(
                "ventasRealizadas"
              )
            ) || [];
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          recargarCuentasSinAlerta();
        }
      }
    );

    function recargarCuentasSinAlerta() {
      cuentas =
        JSON.parse(
          localStorage.getItem(
            "cuentasPorCobrar"
          )
        ) || [];

      ventas =
        JSON.parse(
          localStorage.getItem(
            "ventasRealizadas"
          )
        ) || [];

      renderCuentas();
    }

    renderCuentas();
  </script>

</body>
</html>
