<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mapa de Clientes</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --red: #e52424;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--background);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.location {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    /* MAPA */

    #map {
      position: fixed;
      top: 78px;
      left: 0;
      width: 100%;
      height: calc(100% - 162px);
      background: #e8eaed;
    }

    /* TARJETA DE INFORMACIÓN */

    .map-status {
      position: fixed;
      z-index: 1000;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 28px), 500px);
      padding: 14px 16px;
      border: 1px solid #ececec;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.96);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(8px);
    }

    .map-status-icon {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .map-status-content {
      min-width: 0;
      flex: 1;
    }

    .map-status-content strong {
      display: block;
      margin-bottom: 3px;
      color: #111;
      font-size: 14px;
    }

    .map-status-content span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .clients-count {
      min-width: 36px;
      height: 36px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--green-light);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    /* BOTONES FLOTANTES */

    .map-controls {
      position: fixed;
      z-index: 1000;
      right: 12px;
      bottom: 103px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-control-button {
      width: 50px;
      height: 50px;
      border: 1px solid #e7e7e7;
      border-radius: 16px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.17);
    }

    .map-control-button.primary {
      border-color: transparent;
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
    }

    .map-control-button:active {
      transform: scale(0.95);
    }

    /* MENÚ INFERIOR */

    .bottom-nav {
      position: fixed;
      z-index: 1300;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 760px);
      height: 84px;
      padding: 7px 12px 5px;
      background: #090909;
      border-radius: 24px 24px 0 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      box-shadow: 0 -7px 24px rgba(0, 0, 0, 0.24);
    }

    .nav-item {
      position: relative;
      height: 67px;
      border: none;
      border-radius: 15px;
      background: transparent;
      color: #b8b8b8;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-item:hover {
      background: #1a1a1a;
      color: #fff;
    }

    .nav-item i {
      font-size: 22px;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      font-weight: 700;
    }

    .nav-badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 25px);
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border: 2px solid #090909;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 15px;
      text-align: center;
      display: none;
    }

    /* VENTANA DE GOOGLE MAPS */

    .cliente-popup {
      width: 230px;
      padding: 4px 2px 2px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .cliente-popup-header {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cliente-popup-icon {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      background: var(--green-light);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .cliente-popup-title {
      min-width: 0;
    }

    .cliente-popup-title strong {
      display: block;
      color: #111;
      font-size: 15px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .cliente-popup-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .cliente-popup-line {
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #5f6570;
      font-size: 13px;
      line-height: 1.4;
    }

    .cliente-popup-line i {
      width: 16px;
      margin-top: 2px;
      color: var(--orange);
      text-align: center;
    }

    .route-button {
      width: 100%;
      min-height: 42px;
      margin-top: 7px;
      padding: 10px 13px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    /* MENSAJE DE CARGA */

    .loading-location {
      position: fixed;
      z-index: 1500;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      padding: 11px 16px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      display: none;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.25);
    }

    .loading-location.show {
      display: flex;
    }

    .loading-location i {
      color: var(--orange);
    }

    /* RESPONSIVE */

    @media (max-width: 620px) {
      .header {
        height: 70px;
        padding: 0 12px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        font-size: 20px;
      }

      .header-title {
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      #map {
        top: 70px;
        height: calc(100% - 154px);
      }

      .map-status {
        top: 83px;
        width: calc(100% - 20px);
        padding: 11px 12px;
      }

      .map-status-icon {
        width: 39px;
        height: 39px;
        font-size: 17px;
      }

      .map-status-content strong {
        font-size: 13px;
      }

      .map-status-content span {
        font-size: 11px;
      }

      .map-controls {
        right: 10px;
        bottom: 96px;
      }

      .map-control-button {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        font-size: 18px;
      }
    }

    @media (max-width: 380px) {
      .header-title span {
        font-size: 16px;
      }

      .map-status-content span {
        max-width: 190px;
      }

      .nav-item {
        font-size: 10px;
      }

      .nav-item i {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="window.location.href='menu.html'"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-map-location-dot"></i>
      <span>Mapa de Clientes</span>
    </div>

    <button
      type="button"
      class="header-button location"
      onclick="centrarUbicacionUsuario()"
      aria-label="Mi ubicación"
    >
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>

  </header>

  <div class="map-status">

    <div class="map-status-icon">
      <i class="fa-solid fa-route"></i>
    </div>

    <div class="map-status-content">
      <strong>Ubicación de clientes</strong>
      <span>
        Toca un marcador para ver los datos y calcular la ruta.
      </span>
    </div>

    <div
      class="clients-count"
      id="clients-count"
    >
      0
    </div>

  </div>

  <div id="map"></div>

  <div class="map-controls">

    <button
      type="button"
      class="map-control-button"
      onclick="mostrarTodosLosMarcadores()"
      aria-label="Mostrar todos"
      title="Mostrar todos"
    >
      <i class="fa-solid fa-expand"></i>
    </button>

    <button
      type="button"
      class="map-control-button primary"
      onclick="centrarUbicacionUsuario()"
      aria-label="Centrar mi ubicación"
      title="Mi ubicación"
    >
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>

  </div>

  <div
    class="loading-location"
    id="loading-location"
  >
    <i class="fa-solid fa-spinner fa-spin"></i>
    <span>Buscando tu ubicación...</span>
  </div>

  <nav class="bottom-nav">

    <a
      href="menu.html"
      class="nav-item"
    >
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </a>

    <a
      href="mapa.html"
      class="nav-item active"
      aria-current="page"
    >
      <i class="fa-solid fa-map-location-dot"></i>
      <span>Mapa</span>
    </a>

    <a
      href="Carrito.html"
      class="nav-item"
    >
      <i class="fa-solid fa-cart-shopping"></i>

      <span
        class="nav-badge"
        id="cart-count"
      >
        0
      </span>

      <span>Carrito</span>
    </a>

    <a
      href="Usuario.html"
      class="nav-item"
    >
      <i class="fa-solid fa-gear"></i>
      <span>Configuración</span>
    </a>

  </nav>

  <script>
    let map;
    let marcadorUsuario;
    let directionsService;
    let directionsRenderer;
    let ubicacionActual = null;
    let bounds = null;
    let marcadoresClientes = [];
    let watchId = null;

    function initMap() {
      map = new google.maps.Map(
        document.getElementById("map"),
        {
          center: {
            lat: 18.4861,
            lng: -69.9312
          },

          zoom: 14,
          mapTypeId: "roadmap",

          disableDefaultUI: true,
          zoomControl: true,
          gestureHandling: "greedy",

          styles: [
            {
              featureType: "poi",
              elementType: "all",
              stylers: [
                {
                  visibility: "off"
                }
              ]
            },

            {
              featureType: "transit",
              elementType: "all",
              stylers: [
                {
                  visibility: "off"
                }
              ]
            },

            {
              featureType: "road",
              elementType: "labels.icon",
              stylers: [
                {
                  visibility: "off"
                }
              ]
            },

            {
              featureType: "administrative",
              elementType: "labels",
              stylers: [
                {
                  visibility: "off"
                }
              ]
            },

            {
              featureType: "landscape",
              elementType: "all",
              stylers: [
                {
                  color: "#f2f2f2"
                }
              ]
            },

            {
              featureType: "water",
              elementType: "all",
              stylers: [
                {
                  color: "#c9e1f9"
                }
              ]
            }
          ]
        }
      );

      directionsService =
        new google.maps.DirectionsService();

      directionsRenderer =
        new google.maps.DirectionsRenderer({
          map: map,
          suppressMarkers: false,
          preserveViewport: false,
          polylineOptions: {
            strokeColor: "#f26a21",
            strokeOpacity: 0.9,
            strokeWeight: 6
          }
        });

      bounds =
        new google.maps.LatLngBounds();

      verificarReinicioVisitas();
      mostrarClientes();
      iniciarGeolocalizacion();
      actualizarContadorCarrito();
    }

    function iniciarGeolocalizacion() {
      const cargando =
        document.getElementById(
          "loading-location"
        );

      if (!navigator.geolocation) {
        alert(
          "Tu dispositivo no permite obtener la ubicación."
        );

        return;
      }

      cargando?.classList.add("show");

      watchId =
        navigator.geolocation.watchPosition(
          position => {
            ubicacionActual = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };

            if (marcadorUsuario) {
              marcadorUsuario.setPosition(
                ubicacionActual
              );
            } else {
              marcadorUsuario =
                new google.maps.Marker({
                  position: ubicacionActual,
                  map: map,
                  title: "Tu ubicación",

                  icon: {
                    url: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                    scaledSize:
                      new google.maps.Size(
                        42,
                        42
                      )
                  },

                  zIndex: 999
                });
            }

            bounds.extend(ubicacionActual);

            if (
              marcadoresClientes.length === 0
            ) {
              map.setCenter(
                ubicacionActual
              );

              map.setZoom(16);
            } else {
              map.fitBounds(bounds);
            }

            cargando?.classList.remove(
              "show"
            );
          },

          error => {
            cargando?.classList.remove(
              "show"
            );

            console.warn(
              "Error de ubicación:",
              error
            );

            alert(
              "Ubicación actual no disponible. Verifica que el GPS y los permisos estén activados."
            );
          },

          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 5000
          }
        );
    }

    function verificarReinicioVisitas() {
      const ahora = new Date();
      const hoy =
        ahora.toLocaleDateString();

      const ultimaFecha =
        localStorage.getItem(
          "ultimaFechaVisita"
        ) || "";

      if (hoy !== ultimaFecha) {
        const clientes =
          obtenerClientes();

        for (
          let i = 0;
          i < clientes.length;
          i++
        ) {
          clientes[i].estado =
            "visitar";
        }

        localStorage.setItem(
          "clientes",
          JSON.stringify(clientes)
        );

        localStorage.setItem(
          "ultimaFechaVisita",
          hoy
        );
      }
    }

    function obtenerClientes() {
      try {
        const clientes =
          JSON.parse(
            localStorage.getItem(
              "clientes"
            ) || "[]"
          );

        return Array.isArray(clientes)
          ? clientes
          : [];
      } catch (error) {
        console.warn(
          "No se pudieron leer los clientes:",
          error
        );

        return [];
      }
    }

    function mostrarClientes() {
      const clientes =
        obtenerClientes();

      marcadoresClientes.forEach(
        marcador => {
          marcador.setMap(null);
        }
      );

      marcadoresClientes = [];

      let clientesConUbicacion = 0;

      clientes.forEach(cliente => {
        const lat =
          parseFloat(cliente.latitud);

        const lng =
          parseFloat(cliente.longitud);

        const estado =
          cliente.estado || "visitar";

        if (
          isNaN(lat) ||
          isNaN(lng)
        ) {
          return;
        }

        clientesConUbicacion++;

        const icono =
          estado === "visitado"
            ? "visitado.png"
            : "novisitado.png";

        const marker =
          new google.maps.Marker({
            position: {
              lat,
              lng
            },

            map: map,

            title:
              cliente.negocio ||
              cliente.nombre ||
              "Cliente",

            icon: {
              url: icono,

              scaledSize:
                new google.maps.Size(
                  48,
                  48
                )
            }
          });

        marcadoresClientes.push(marker);

        bounds.extend(
          marker.getPosition()
        );

        const nombreCliente =
          escaparHTML(
            cliente.negocio ||
            cliente.nombre ||
            "Cliente"
          );

        const direccion =
          escaparHTML(
            cliente.direccion ||
            "Dirección no disponible"
          );

        const telefono =
          escaparHTML(
            cliente.telefono ||
            "No disponible"
          );

        const estadoTexto =
          estado === "visitado"
            ? "Visitado"
            : "Por visitar";

        const content = `
          <div class="cliente-popup">

            <div class="cliente-popup-header">

              <div class="cliente-popup-icon">
                <i class="fa-solid fa-store"></i>
              </div>

              <div class="cliente-popup-title">
                <strong>
                  ${nombreCliente}
                </strong>

                <span>
                  ${estadoTexto}
                </span>
              </div>

            </div>

            <div class="cliente-popup-line">
              <i class="fa-solid fa-location-dot"></i>

              <span>
                ${direccion}
              </span>
            </div>

            <div class="cliente-popup-line">
              <i class="fa-solid fa-phone"></i>

              <span>
                ${telefono}
              </span>
            </div>

            <button
              type="button"
              class="route-button"
              onclick="trazarRuta(${lat}, ${lng})"
            >
              <i class="fa-solid fa-route"></i>
              Cómo llegar
            </button>

          </div>
        `;

        const infoWindow =
          new google.maps.InfoWindow({
            content
          });

        marker.addListener(
          "click",
          () => {
            cerrarVentanasAbiertas();

            infoWindow.open({
              anchor: marker,
              map: map
            });

            window.ventanaMapaActual =
              infoWindow;
          }
        );
      });

      const contador =
        document.getElementById(
          "clients-count"
        );

      if (contador) {
        contador.textContent =
          clientesConUbicacion;
      }

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);

        google.maps.event.addListenerOnce(
          map,
          "bounds_changed",
          () => {
            if (map.getZoom() > 17) {
              map.setZoom(17);
            }
          }
        );
      }
    }

    function cerrarVentanasAbiertas() {
      if (
        window.ventanaMapaActual
      ) {
        window.ventanaMapaActual.close();
      }
    }

    function trazarRuta(lat, lng) {
      if (!ubicacionActual) {
        alert(
          "Ubicación actual no disponible. Activa el GPS e inténtalo nuevamente."
        );

        return;
      }

      const request = {
        origin: ubicacionActual,

        destination: {
          lat,
          lng
        },

        travelMode:
          google.maps.TravelMode.DRIVING
      };

      directionsService.route(
        request,
        (result, status) => {
          if (
            status ===
            google.maps.DirectionsStatus.OK
          ) {
            directionsRenderer.setDirections(
              result
            );
          } else {
            console.warn(
              "Error de ruta:",
              status
            );

            alert(
              "No se pudo calcular la ruta."
            );
          }
        }
      );
    }

    function centrarUbicacionUsuario() {
      if (!ubicacionActual) {
        alert(
          "Todavía no se ha encontrado tu ubicación."
        );

        return;
      }

      map.panTo(
        ubicacionActual
      );

      map.setZoom(17);
    }

    function mostrarTodosLosMarcadores() {
      if (!bounds || bounds.isEmpty()) {
        alert(
          "No hay ubicaciones disponibles para mostrar."
        );

        return;
      }

      map.fitBounds(bounds);

      google.maps.event.addListenerOnce(
        map,
        "bounds_changed",
        () => {
          if (map.getZoom() > 17) {
            map.setZoom(17);
          }
        }
      );
    }

    function actualizarContadorCarrito() {
      const badge =
        document.getElementById(
          "cart-count"
        );

      if (!badge) return;

      let carrito = [];

      try {
        const datos =
          JSON.parse(
            localStorage.getItem(
              "cart"
            ) || "[]"
          );

        carrito =
          Array.isArray(datos)
            ? datos
            : [];
      } catch (error) {
        carrito = [];
      }

      const total =
        carrito.reduce(
          (suma, producto) => {
            return suma + Number(
              producto.quantity ||
              producto.cantidad ||
              0
            );
          },
          0
        );

      badge.textContent =
        total > 99
          ? "99+"
          : total;

      badge.style.display =
        total > 0
          ? "inline-block"
          : "none";
    }

    function escaparHTML(valor) {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener(
      "storage",
      evento => {
        if (evento.key === "cart") {
          actualizarContadorCarrito();
        }

        if (
          evento.key === "clientes"
        ) {
          location.reload();
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          actualizarContadorCarrito();
        }
      }
    );

    window.addEventListener(
      "beforeunload",
      () => {
        if (
          watchId !== null &&
          navigator.geolocation
        ) {
          navigator.geolocation.clearWatch(
            watchId
          );
        }
      }
    );

    window.initMap = initMap;
    window.trazarRuta = trazarRuta;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCIaHCkpuglZoc8jgWfJRBZaedJvq6caBw&callback=initMap"
    async
    defer
  ></script>

</body>
