<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ubicación del Cliente</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
    }

    button, a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1500;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: grid;
      grid-template-columns: 52px minmax(0,1fr) 52px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg,#191919,#080808);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .header-button.location {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(.96);
    }

    .header-title {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }

    .header-title i {
      color: var(--orange);
      font-size: 23px;
    }

    .header-title span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page {
      width: min(100%,1000px);
      margin: 0 auto;
      padding: 18px 14px 30px;
    }

    .client-card {
      margin-bottom: 15px;
      padding: 16px;
      border: 1px solid #ededed;
      border-radius: 18px;
      background: #fff;
      display: grid;
      grid-template-columns: 55px minmax(0,1fr);
      gap: 13px;
      align-items: center;
      box-shadow: 0 7px 22px rgba(0,0,0,.07);
    }

    .client-icon {
      width: 55px;
      height: 55px;
      border-radius: 17px;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .client-data {
      min-width: 0;
    }

    .client-data h2 {
      margin-bottom: 6px;
      color: #111;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .client-data p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .client-data p i {
      width: 18px;
      margin-right: 5px;
      color: var(--orange);
      text-align: center;
    }

    .map-card {
      position: relative;
      overflow: hidden;
      border: 1px solid #ededed;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(0,0,0,.09);
    }

    #map {
      width: 100%;
      height: 570px;
      background: #e6e8eb;
    }

    .map-actions {
      padding: 13px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-button {
      min-height: 49px;
      padding: 10px 13px;
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .center-button {
      background: var(--orange-light);
      color: var(--orange);
    }

    .route-button {
      background: var(--green-light);
      color: var(--green);
    }

    .empty-state {
      min-height: calc(100vh - 120px);
      padding: 35px 20px;
      border: 1px solid #ededed;
      border-radius: 20px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 22px rgba(0,0,0,.07);
    }

    .empty-state i {
      width: 100px;
      height: 100px;
      margin-bottom: 17px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    .empty-state h2 {
      margin-bottom: 8px;
      color: #111;
      font-size: 21px;
    }

    .empty-state p {
      max-width: 330px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .empty-state button {
      min-height: 48px;
      padding: 10px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(
        135deg,
        var(--orange),
        var(--orange-dark)
      );
      color: #fff;
      font-weight: 800;
    }

    .leaflet-popup-content {
      min-width: 200px;
      margin: 14px;
    }

    .popup-client strong {
      display: block;
      margin-bottom: 7px;
      color: #111;
      font-size: 15px;
    }

    .popup-client span {
      display: block;
      margin-top: 4px;
      color: #555d68;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width:620px) {
      body {
        padding-top: 70px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
        grid-template-columns: 45px minmax(0,1fr) 45px;
        gap: 8px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        border-radius: 14px;
        font-size: 19px;
      }

      .header-title {
        font-size: 17px;
      }

      .page {
        padding: 12px 9px 20px;
      }

      #map {
        height: calc(100vh - 290px);
        min-height: 400px;
      }
    }

    @media (max-width:390px) {
      .header-title span {
        font-size: 15px;
      }

      .map-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="volverClientes()"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-map-location-dot"></i>
      <span>Ubicación del cliente</span>
    </div>

    <button
      type="button"
      class="header-button location"
      onclick="centrarCliente()"
      aria-label="Centrar ubicación"
      title="Centrar ubicación"
    >
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>

  </header>

  <main class="page" id="pageContent"></main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>
    let mapa = null;
    let marcadorCliente = null;
    let clienteMapa = cargarClienteMapa();

    function cargarClienteMapa() {
      try {
        const cliente = JSON.parse(
          localStorage.getItem(
            "clienteMapaSeleccionado"
          ) || "null"
        );

        return cliente &&
          typeof cliente === "object"
            ? cliente
            : null;
      } catch (error) {
        return null;
      }
    }

    function escaparHTML(valor) {
      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function coordenadasValidas(cliente) {
      if (!cliente) return false;

      const latitud =
        parseFloat(cliente.latitud);

      const longitud =
        parseFloat(cliente.longitud);

      return (
        Number.isFinite(latitud) &&
        Number.isFinite(longitud) &&
        latitud >= -90 &&
        latitud <= 90 &&
        longitud >= -180 &&
        longitud <= 180
      );
    }

    function mostrarPagina() {
      const contenedor =
        document.getElementById(
          "pageContent"
        );

      if (
        !clienteMapa ||
        !coordenadasValidas(clienteMapa)
      ) {
        contenedor.innerHTML = `
          <section class="empty-state">

            <i class="fa-solid fa-location-dot"></i>

            <h2>
              No hay ubicación seleccionada
            </h2>

            <p>
              Regresa a la lista de clientes y pulsa Ver ubicación.
            </p>

            <button
              type="button"
              onclick="volverClientes()"
            >
              Ver clientes
            </button>

          </section>
        `;

        return;
      }

      const nombreCompleto = [
        clienteMapa.nombre,
        clienteMapa.apellido
      ]
        .filter(Boolean)
        .join(" ");

      contenedor.innerHTML = `
        <section class="client-card">

          <div class="client-icon">
            <i class="fa-solid fa-store"></i>
          </div>

          <div class="client-data">

            <h2>
              ${escaparHTML(
                clienteMapa.negocio ||
                nombreCompleto ||
                "Cliente"
              )}
            </h2>

            ${
              nombreCompleto &&
              clienteMapa.negocio
                ? `
                  <p>
                    <i class="fa-solid fa-user"></i>
                    ${escaparHTML(nombreCompleto)}
                  </p>
                `
                : ""
            }

            ${
              clienteMapa.telefono
                ? `
                  <p>
                    <i class="fa-solid fa-phone"></i>
                    ${escaparHTML(
                      clienteMapa.telefono
                    )}
                  </p>
                `
                : ""
            }

            ${
              clienteMapa.direccion
                ? `
                  <p>
                    <i class="fa-solid fa-location-dot"></i>
                    ${escaparHTML(
                      clienteMapa.direccion
                    )}
                  </p>
                `
                : ""
            }

          </div>

        </section>

        <section class="map-card">

          <div id="map"></div>

          <div class="map-actions">

            <button
              type="button"
              class="action-button center-button"
              onclick="centrarCliente()"
            >
              <i class="fa-solid fa-location-crosshairs"></i>
              Centrar cliente
            </button>

            <a
              class="action-button route-button"
              href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(
                clienteMapa.latitud
              )},${encodeURIComponent(
                clienteMapa.longitud
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-solid fa-route"></i>
              Cómo llegar
            </a>

          </div>

        </section>
      `;

      setTimeout(
        inicializarMapa,
        50
      );
    }

    function inicializarMapa() {
      if (
        !clienteMapa ||
        !coordenadasValidas(clienteMapa)
      ) {
        return;
      }

      const latitud =
        parseFloat(clienteMapa.latitud);

      const longitud =
        parseFloat(clienteMapa.longitud);

      if (mapa) {
        mapa.remove();
        mapa = null;
      }

      mapa = L.map("map", {
        zoomControl: true
      }).setView(
        [latitud, longitud],
        17
      );

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution:
            "&copy; OpenStreetMap"
        }
      ).addTo(mapa);

      const nombreCompleto = [
        clienteMapa.nombre,
        clienteMapa.apellido
      ]
        .filter(Boolean)
        .join(" ");

      marcadorCliente = L.marker(
        [latitud, longitud]
      )
        .addTo(mapa)
        .bindPopup(`
          <div class="popup-client">

            <strong>
              ${escaparHTML(
                clienteMapa.negocio ||
                nombreCompleto ||
                "Cliente"
              )}
            </strong>

            ${
              clienteMapa.direccion
                ? `
                  <span>
                    ${escaparHTML(
                      clienteMapa.direccion
                    )}
                  </span>
                `
                : ""
            }

            ${
              clienteMapa.telefono
                ? `
                  <span>
                    Teléfono:
                    ${escaparHTML(
                      clienteMapa.telefono
                    )}
                  </span>
                `
                : ""
            }

          </div>
        `)
        .openPopup();

      setTimeout(() => {
        mapa.invalidateSize();
      }, 200);
    }

    function centrarCliente() {
      if (
        !mapa ||
        !clienteMapa ||
        !coordenadasValidas(clienteMapa)
      ) {
        return;
      }

      const latitud =
        parseFloat(clienteMapa.latitud);

      const longitud =
        parseFloat(clienteMapa.longitud);

      mapa.setView(
        [latitud, longitud],
        17,
        {
          animate: true
        }
      );

      marcadorCliente?.openPopup();
    }

    function volverClientes() {
      window.location.href =
        "Clientes.html";
    }

    window.addEventListener(
      "storage",
      event => {
        if (
          event.key ===
          "clienteMapaSeleccionado"
        ) {
          clienteMapa =
            cargarClienteMapa();

          mostrarPagina();
        }
      }
    );

    document.addEventListener(
      "DOMContentLoaded",
      mostrarPagina
    );
  </script>

</body>
</html>
