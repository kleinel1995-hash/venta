<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .back-btn {
      position: absolute;
      bottom: 150px;
      right: 8px;
      z-index: 999;
      background-color: #ffffff;
      color: black;
      padding: 12px 8px;
      border: none;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="window.location.href='menu.html'">Volver</button>
  <div id="map"></div>
  <script>
    let map, marcadorUsuario;
    let directionsService, directionsRenderer;
    let ubicacionActual = null;
    let bounds = null;
    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 18.4861, lng: -69.9312 },
        zoom: 14,
        mapTypeId: 'roadmap',
        styles: [
          { featureType: "poi", elementType: "all", stylers: [{ visibility: "off" }] },
          { featureType: "transit", elementType: "all", stylers: [{ visibility: "off" }] },
          { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
          { featureType: "administrative", elementType: "labels", stylers: [{ visibility: "off" }] },
          { featureType: "landscape", elementType: "all", stylers: [{ color: "#f2f2f2" }] },
          { featureType: "water", elementType: "all", stylers: [{ color: "#c9e1f9" }] }
        ]
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map });
      bounds = new google.maps.LatLngBounds();
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (position) => {
            ubicacionActual = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            if (marcadorUsuario) {
              marcadorUsuario.setPosition(ubicacionActual);
            } else {
              marcadorUsuario = new google.maps.Marker({
                position: ubicacionActual,
                map,
                title: "Tu ubicación",
                icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
              });
            }
            bounds.extend(ubicacionActual);
            map.fitBounds(bounds);
          },
          () => alert("Ubicación actual no disponible."),
          { enableHighAccuracy: true }
        );
      }
      verificarReinicioVisitas();
      mostrarClientes();
    }
    function verificarReinicioVisitas() {
      const ahora = new Date();
      const hoy = ahora.toLocaleDateString();
      const ultimaFecha = localStorage.getItem("ultimaFechaVisita") || "";
      if (hoy !== ultimaFecha) {
        const clientes = JSON.parse(localStorage.getItem("clientes")) || [];
        for (let i = 0; i < clientes.length; i++) {
          clientes[i].estado = "visitar";
        }
        localStorage.setItem("clientes", JSON.stringify(clientes));
        localStorage.setItem("ultimaFechaVisita", hoy);
      }
    }
    function mostrarClientes() {
      const clientes = JSON.parse(localStorage.getItem("clientes")) || [];
      clientes.forEach((cliente) => {
        const lat = parseFloat(cliente.latitud);
        const lng = parseFloat(cliente.longitud);
        const estado = cliente.estado || "visitar";
        if (!isNaN(lat) && !isNaN(lng)) {
          const icono = (estado === "visitado") ? "visitado.png" : "novisitado.png";
          const marker = new google.maps.Marker({
            position: { lat, lng },
            map: map,
            title: cliente.nombre,
            icon: {
              url: icono,
              scaledSize: new google.maps.Size(48, 48)
            }
          });
          bounds.extend(marker.getPosition());
          const content = `
            <div style="font-family: Segoe UI; font-size: 14px;">
             
              🏪 <b>Negocio:</b> ${cliente.negocio || "N/A"}<br>
              📍 <b>Dirección:</b> ${cliente.direccion || "N/A"}<br>
              📞 <b>Tel:</b> ${cliente.telefono || "N/A"}<br><br>
              <button onclick="trazarRuta(${lat}, ${lng})" style="
                padding: 6px 10px;
                background-color: #0091B1;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
              ">📍 Cómo llegar</button>
            </div>
          `;
          const infoWindow = new google.maps.InfoWindow({ content });
          marker.addListener("click", () => infoWindow.open(map, marker));
        }
      });
      // Ajustar la vista al conjunto de marcadores
      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }
    }
    function trazarRuta(lat, lng) {
      if (!ubicacionActual) {
        alert("Ubicación actual no disponible.");
        return;
      }
      const request = {
        origin: ubicacionActual,
        destination: { lat, lng },
        travelMode: 'DRIVING'
      };
      directionsService.route(request, (result, status) => {
        if (status === 'OK') {
          directionsRenderer.setDirections(result);
        } else {
          alert("No se pudo calcular la ruta.");
        }
      });
    }
    window.initMap = initMap;
  </script>
  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCIaHCkpuglZoc8jgWfJRBZaedJvq6caBw&callback=initMap" async defer></script>
</body>
</html>
