<div
  class="device-location"
  id="device-location"
>
  <div class="device-location-icon">
    <i class="fa-solid fa-location-crosshairs"></i>
  </div>

  <div class="device-location-info">
    <strong>Ubicación del dispositivo</strong>

    <span id="device-location-status">
      Buscando ubicación...
    </span>

    <small id="device-location-coordinates">
      Latitud: -- | Longitud: --
    </small>
  </div>

  <div
    class="location-live"
    id="location-live"
  >
    <span class="live-dot"></span>
    EN VIVO
  </div>
</div>
