<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Clientes</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --orange: #f26a21;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --purple: #7128df;
      --red: #e52424;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-bottom: 20px;
    }

    button, input {
      font: inherit;
    }

    button, a, input {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 14px rgba(0,0,0,.18);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 25px;
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg,#191919,#080808);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      box-shadow: inset 0 0 10px rgba(255,255,255,.03);
    }

    .header-button.add {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(.96);
    }

    .container {
      width: min(100%,760px);
      margin: 0 auto;
      padding: 22px 16px;
    }

    .search-box {
      position: relative;
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      height: 60px;
      padding: 0 58px;
      border: 1px solid #ededed;
      border-radius: 18px;
      background: var(--white);
      color: var(--text);
      font-size: 16px;
      outline: none;
      box-shadow: 0 7px 22px rgba(0,0,0,.08);
    }

    .search-box input:focus {
      border-color: var(--orange);
      box-shadow: 0 7px 24px rgba(242,106,33,.16);
    }

    .search-icon {
      position: absolute;
      left: 21px;
      top: 50%;
      transform: translateY(-50%);
      color: #242831;
      font-size: 21px;
      pointer-events: none;
    }

    .filter-button {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      color: #242831;
      font-size: 19px;
      border-radius: 12px;
    }

    .filter-button:hover {
      background: #f1f2f4;
    }

    .cliente {
      position: relative;
      background: var(--white);
      border: 1px solid #eee;
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 7px 22px rgba(0,0,0,.07);
    }

    .cliente-main {
      display: grid;
      grid-template-columns: 88px minmax(0,1fr) auto;
      gap: 15px;
      align-items: start;
      padding: 22px 20px 18px;
    }

    .cliente-icon {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .cliente:nth-child(3n + 1) .cliente-icon {
      background: #e8f8eb;
      color: var(--green);
    }

    .cliente:nth-child(3n + 2) .cliente-icon {
      background: #e5f3ff;
      color: var(--blue);
    }

    .cliente:nth-child(3n + 3) .cliente-icon {
      background: #fff4cc;
      color: #9a6800;
    }

    .cliente-content {
      min-width: 0;
    }

    .cliente-content h3 {
      font-size: 20px;
      line-height: 1.25;
      margin-bottom: 12px;
      color: #111;
      overflow-wrap: anywhere;
    }

    .cliente-line {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      margin-bottom: 9px;
      overflow-wrap: anywhere;
    }

    .cliente-line i {
      width: 18px;
      margin-top: 3px;
      text-align: center;
      color: #737984;
      flex-shrink: 0;
    }

    .cliente-side {
      min-width: 122px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .menu-dots {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #101010;
      font-size: 22px;
    }

    .menu-dots:hover {
      background: #f3f3f3;
    }

    .estado-badge {
      padding: 9px 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
    }

    .estado-badge.visitado {
      background: var(--green-light);
      color: var(--green);
    }

    .estado-badge.visitar {
      background: var(--blue-light);
      color: var(--blue);
    }

    .location-button {
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--green-light);
      color: var(--green);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .location-button:hover {
      background: #dff4dc;
    }

    .acciones {
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(5,1fr);
      background: #fff;
    }

    .accion-btn {
      min-height: 68px;
      padding: 9px 5px;
      border: none;
      border-right: 1px solid var(--line);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      transition: background .2s, transform .2s;
    }

    .accion-btn:last-child {
      border-right: none;
    }

    .accion-btn:hover {
      background: #f8f8f8;
    }

    .accion-btn:active {
      transform: scale(.96);
    }

    .accion-btn i {
      font-size: 20px;
    }

    .pedido-btn { color: var(--blue); }
    .ver-btn { color: var(--green); }
    .historial-btn { color: var(--orange); }
    .info-btn { color: var(--purple); }
    .eliminar-btn { color: var(--red); }

    .ver-btn:disabled {
      color: var(--green);
      opacity: .72;
      cursor: default;
    }

    .historial {
      display: none;
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      background: #f7fbfc;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
    }

    .historial.mostrar {
      display: block;
    }

    .historial-item {
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
      border: 1px solid #e8ecef;
      border-radius: 12px;
    }

    .menu-opciones {
      display: none;
      position: absolute;
      z-index: 20;
      top: 58px;
      right: 18px;
      width: 190px;
      padding: 8px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
    }

    .menu-opciones.mostrar {
      display: block;
    }

    .menu-opciones button {
      width: 100%;
      border: none;
      border-radius: 9px;
      background: transparent;
      padding: 11px 12px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #20242b;
      font-size: 14px;
    }

    .menu-opciones button:hover {
      background: #f4f5f6;
    }

    .sin-clientes {
      text-align: center;
      padding: 50px 20px;
      color: #7b818b;
    }

    .sin-clientes i {
      font-size: 48px;
      color: #c5c9cf;
      margin-bottom: 15px;
    }

    .swal-cliente-info {
      text-align: left;
      line-height: 1.8;
      color: #374151;
      overflow-wrap: anywhere;
    }

    .swal-cliente-info b {
      color: #111827;
    }

    @media (max-width:620px) {
      .header {
        height: 70px;
        padding: 0 12px;
      }

      .header-title {
        font-size: 19px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        font-size: 20px;
      }

      .container {
        padding: 17px 10px;
      }

      .search-box input {
        height: 56px;
        padding-left: 52px;
        padding-right: 55px;
      }

      .cliente-main {
        grid-template-columns: 64px minmax(0,1fr);
        gap: 12px;
        padding: 18px 14px 15px;
      }

      .cliente-icon {
        width: 58px;
        height: 58px;
        font-size: 25px;
      }

      .cliente-content h3 {
        padding-right: 30px;
        font-size: 18px;
      }

      .cliente-line {
        font-size: 14px;
      }

      .cliente-side {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
        flex-direction: row;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .menu-dots {
        position: absolute;
        top: 12px;
        right: 10px;
      }

      .estado-badge,
      .location-button {
        font-size: 13px;
        padding: 8px 12px;
      }

      .accion-btn {
        min-height: 64px;
        font-size: 10px;
      }

      .accion-btn i {
        font-size: 18px;
      }
    }

    @media (max-width:380px) {
      .header-title span {
        font-size: 17px;
      }

      .accion-btn {
        font-size: 9px;
        padding-inline: 2px;
      }

      .accion-btn i {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <button class="header-button"
            type="button"
            onclick="history.back()"
            aria-label="Volver">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-user-group"></i>
      <span>Lista de Clientes</span>
    </div>

    <button class="header-button add"
            type="button"
            onclick="irAgregarCliente()"
            aria-label="Agregar cliente">
      <i class="fa-solid fa-plus"></i>
    </button>
  </header>

  <main class="container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>

      <input type="text"
             id="buscador"
             placeholder="Buscar cliente..."
             autocomplete="off"
             oninput="renderClientes()">

      <button class="filter-button"
              type="button"
              onclick="mostrarFiltros()"
              aria-label="Filtrar clientes">
        <i class="fa-solid fa-filter"></i>
      </button>
    </div>

    <div id="listaClientes"></div>
  </main>

  <script>
    let clientes = cargarClientes();
    let filtroEstado = "todos";

    function cargarClientes() {
      try {
        const datos = JSON.parse(
          localStorage.getItem("clientes") || "[]"
        );

        return Array.isArray(datos) ? datos : [];
      } catch (error) {
        return [];
      }
    }

    function guardarClientes() {
      localStorage.setItem(
        "clientes",
        JSON.stringify(clientes)
      );
    }

    function reiniciarVisitas() {
      const hoy = new Date().toLocaleDateString("es-DO");
      const ultimaFecha =
        localStorage.getItem("ultimaFechaVisita") || "";

      if (hoy !== ultimaFecha) {
        clientes.forEach(cliente => {
          cliente.estado = "visitar";
        });

        guardarClientes();

        localStorage.setItem(
          "ultimaFechaVisita",
          hoy
        );
      }
    }

    function eliminarCliente(index) {
      cerrarMenus();

      if (!clientes[index]) return;

      Swal.fire({
        position: "center",
        title: "¿Eliminar cliente?",
        text: "Esta acción no se puede deshacer.",
        icon: "warning",
        input: "password",
        inputLabel: "Contraseña",
        inputPlaceholder: "Ingrese la contraseña",
        showCancelButton: true,
        confirmButtonText: "Eliminar",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#e52424",
        cancelButtonColor: "#737985"
      }).then(result => {
        if (!result.isConfirmed) return;

        if (result.value !== "1234") {
          Swal.fire({
            position: "center",
            icon: "error",
            title: "Contraseña incorrecta",
            confirmButtonColor: "#f26a21"
          });
          return;
        }

        clientes.splice(index, 1);
        guardarClientes();
        renderClientes();

        Swal.fire({
          position: "center",
          icon: "success",
          title: "Cliente eliminado",
          confirmButtonColor: "#f26a21"
        });
      });
    }

    function marcarVisitado(index) {
      cerrarMenus();

      if (!clientes[index]) return;

      clientes[index].estado = "visitado";
      guardarClientes();
      renderClientes();

      Swal.fire({
        toast: true,
        position: "top",
        icon: "success",
        title: "Cliente marcado como visitado",
        showConfirmButton: false,
        timer: 1600
      });
    }

    function seleccionarCliente(index) {
      cerrarMenus();

      if (!clientes[index]) return;

      clientes[index].estado = "visitado";
      guardarClientes();

      localStorage.setItem(
        "clienteSeleccionado",
        JSON.stringify({
          ...clientes[index],
          id: index
        })
      );

      window.location.href = "inventario.html";
    }

    function verUbicacionCliente(index) {
      cerrarMenus();

      const cliente = clientes[index];

      if (!cliente) return;

      const latitud = parseFloat(cliente.latitud);
      const longitud = parseFloat(cliente.longitud);

      if (
        !Number.isFinite(latitud) ||
        !Number.isFinite(longitud) ||
        latitud < -90 ||
        latitud > 90 ||
        longitud < -180 ||
        longitud > 180
      ) {
        Swal.fire({
          position: "center",
          icon: "warning",
          title: "Ubicación no disponible",
          text: "Este cliente no tiene coordenadas válidas.",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      localStorage.setItem(
        "clienteMapaSeleccionado",
        JSON.stringify({
          ...cliente,
          id: index,
          latitud,
          longitud
        })
      );

      window.location.href = "mapa.html";
    }

    function toggleHistorial(index) {
      cerrarMenus();

      document
        .getElementById(`historial-${index}`)
        ?.classList.toggle("mostrar");
    }

    function toggleOpciones(index, event) {
      event?.stopPropagation();

      const menuActual =
        document.getElementById(
          `menu-opciones-${index}`
        );

      document
        .querySelectorAll(".menu-opciones")
        .forEach(menu => {
          if (menu !== menuActual) {
            menu.classList.remove("mostrar");
          }
        });

      menuActual?.classList.toggle("mostrar");
    }

    function cerrarMenus() {
      document
        .querySelectorAll(".menu-opciones")
        .forEach(menu => {
          menu.classList.remove("mostrar");
        });
    }

    function mostrarInformacion(index) {
      cerrarMenus();

      const cliente = clientes[index];
      if (!cliente) return;

      const nombreCompleto = [
        cliente.nombre,
        cliente.apellido
      ].filter(Boolean).join(" ");

      Swal.fire({
        position: "center",
        title: "Información del cliente",
        html: `
          <div class="swal-cliente-info">
            <b>Nombre:</b> ${escaparHTML(nombreCompleto || "-")}<br>
            <b>Cédula:</b> ${escaparHTML(cliente.cedula || "-")}<br>
            <b>Teléfono:</b> ${escaparHTML(cliente.telefono || "-")}<br>
            <b>Dirección:</b> ${escaparHTML(cliente.direccion || "-")}<br>
            <b>Negocio:</b> ${escaparHTML(cliente.negocio || "-")}<br>
            <b>Ruta:</b> ${escaparHTML(cliente.ruta || "-")}<br>
            <b>Correo:</b> ${escaparHTML(cliente.correo || "-")}<br>
            <b>Latitud:</b> ${escaparHTML(cliente.latitud || "-")}<br>
            <b>Longitud:</b> ${escaparHTML(cliente.longitud || "-")}<br>
            <b>Estado:</b>
            ${cliente.estado === "visitado" ? "Visitado" : "Por visitar"}
          </div>
        `,
        icon: "info",
        confirmButtonText: "Cerrar",
        confirmButtonColor: "#f26a21"
      });
    }

    function irAgregarCliente() {
      window.location.href =
        "agregar-cliente.html";
    }

    function mostrarFiltros() {
      Swal.fire({
        position: "center",
        title: "Filtrar clientes",
        input: "select",
        inputOptions: {
          todos: "Todos los clientes",
          visitado: "Visitados",
          visitar: "Por visitar"
        },
        inputValue: filtroEstado,
        showCancelButton: true,
        confirmButtonText: "Aplicar",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#f26a21",
        cancelButtonColor: "#737985"
      }).then(result => {
        if (result.isConfirmed) {
          filtroEstado =
            result.value || "todos";

          renderClientes();
        }
      });
    }

    function renderClientes() {
      const contenedor =
        document.getElementById("listaClientes");

      const filtro = normalizarTexto(
        document.getElementById("buscador")?.value || ""
      );

      contenedor.innerHTML = "";

      const filtrados = clientes
        .map((cliente, index) => ({
          ...cliente,
          index
        }))
        .filter(cliente => {
          const nombreCompleto = normalizarTexto(
            `${cliente.nombre || ""} ${cliente.apellido || ""}`
          );

          const coincideTexto =
            nombreCompleto.includes(filtro) ||
            normalizarTexto(cliente.negocio || "").includes(filtro) ||
            normalizarTexto(cliente.telefono || "").includes(filtro) ||
            normalizarTexto(cliente.direccion || "").includes(filtro);

          const estado =
            cliente.estado || "visitar";

          const coincideEstado =
            filtroEstado === "todos" ||
            estado === filtroEstado;

          return coincideTexto && coincideEstado;
        });

      if (filtrados.length === 0) {
        contenedor.innerHTML = `
          <div class="sin-clientes">
            <i class="fa-regular fa-folder-open"></i>
            <p>No se encontraron clientes.</p>
          </div>
        `;
        return;
      }

      filtrados.forEach(cliente => {
        const {
          nombre,
          apellido,
          telefono,
          direccion,
          negocio,
          correo,
          latitud,
          longitud,
          historial = [],
          estado = "visitar",
          index
        } = cliente;

        const nombreCompleto =
          [nombre, apellido]
            .filter(Boolean)
            .join(" ");

        const historialHTML =
          Array.isArray(historial) &&
          historial.length
            ? historial.map(pedido => `
                <div class="historial-item">
                  <strong>
                    <i class="fa-solid fa-box"></i>
                    ${escaparHTML(
                      pedido.producto ||
                      pedido.nombre ||
                      "Producto"
                    )}
                  </strong>
                  <br>
                  Cantidad:
                  ${escaparHTML(
                    pedido.cantidad || "0"
                  )}
                  <br>
                  Fecha:
                  ${escaparHTML(
                    pedido.fecha || "Sin fecha"
                  )}
                </div>
              `).join("")
            : "<em>Sin historial aún.</em>";

        const iconoNegocio =
          obtenerIconoNegocio(
            negocio ||
            nombreCompleto ||
            ""
          );

        const hayUbicacion =
          Number.isFinite(parseFloat(latitud)) &&
          Number.isFinite(parseFloat(longitud));

        const tarjeta =
          document.createElement("article");

        tarjeta.className = "cliente";

        tarjeta.innerHTML = `
          <div class="cliente-main">

            <div class="cliente-icon">
              <i class="${iconoNegocio}"></i>
            </div>

            <div class="cliente-content">
              <h3>
                ${escaparHTML(
                  negocio ||
                  nombreCompleto ||
                  "Cliente"
                )}
              </h3>

              ${
                nombreCompleto && negocio
                  ? `
                    <div class="cliente-line">
                      <i class="fa-solid fa-user"></i>
                      <span>${escaparHTML(nombreCompleto)}</span>
                    </div>
                  `
                  : ""
              }

              ${
                telefono
                  ? `
                    <div class="cliente-line">
                      <i class="fa-solid fa-phone"></i>
                      <span>${escaparHTML(telefono)}</span>
                    </div>
                  `
                  : ""
              }

              ${
                direccion
                  ? `
                    <div class="cliente-line">
                      <i class="fa-solid fa-location-dot"></i>
                      <span>${escaparHTML(direccion)}</span>
                    </div>
                  `
                  : ""
              }

              ${
                correo
                  ? `
                    <div class="cliente-line">
                      <i class="fa-solid fa-envelope"></i>
                      <span>${escaparHTML(correo)}</span>
                    </div>
                  `
                  : ""
              }
            </div>

            <div class="cliente-side">

              <button
                type="button"
                class="menu-dots"
                onclick="toggleOpciones(${index}, event)"
                aria-label="Más opciones"
              >
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </button>

              <div
                class="estado-badge ${
                  estado === "visitado"
                    ? "visitado"
                    : "visitar"
                }"
              >
                <i class="${
                  estado === "visitado"
                    ? "fa-solid fa-circle-check"
                    : "fa-solid fa-circle"
                }"></i>

                <span>
                  ${
                    estado === "visitado"
                      ? "Visitado"
                      : "Por visitar"
                  }
                </span>
              </div>

              ${
                hayUbicacion
                  ? `
                    <button
                      type="button"
                      class="location-button"
                      onclick="verUbicacionCliente(${index})"
                    >
                      <i class="fa-solid fa-location-dot"></i>
                      Ver ubicación
                    </button>
                  `
                  : ""
              }
            </div>

            <div
              class="menu-opciones"
              id="menu-opciones-${index}"
            >
              <button
                type="button"
                onclick="seleccionarCliente(${index})"
              >
                <i
                  class="fa-solid fa-cart-plus"
                  style="color:#087be7"
                ></i>
                Crear pedido
              </button>

              ${
                estado === "visitado"
                  ? `
                    <button type="button" disabled>
                      <i
                        class="fa-solid fa-circle-check"
                        style="color:#159638"
                      ></i>
                      Cliente visitado
                    </button>
                  `
                  : `
                    <button
                      type="button"
                      onclick="marcarVisitado(${index})"
                    >
                      <i
                        class="fa-solid fa-user-check"
                        style="color:#159638"
                      ></i>
                      Marcar visitado
                    </button>
                  `
              }

              <button
                type="button"
                onclick="toggleHistorial(${index})"
              >
                <i
                  class="fa-solid fa-clock-rotate-left"
                  style="color:#f26a21"
                ></i>
                Ver historial
              </button>

              <button
                type="button"
                onclick="mostrarInformacion(${index})"
              >
                <i
                  class="fa-solid fa-circle-info"
                  style="color:#7128df"
                ></i>
                Información
              </button>

              ${
                hayUbicacion
                  ? `
                    <button
                      type="button"
                      onclick="verUbicacionCliente(${index})"
                    >
                      <i
                        class="fa-solid fa-map-location-dot"
                        style="color:#159638"
                      ></i>
                      Ver en el mapa
                    </button>
                  `
                  : ""
              }

              <button
                type="button"
                onclick="eliminarCliente(${index})"
              >
                <i
                  class="fa-solid fa-trash"
                  style="color:#e52424"
                ></i>
                Eliminar
              </button>
            </div>

          </div>

          <div class="acciones">

            <button
              type="button"
              class="accion-btn pedido-btn"
              onclick="seleccionarCliente(${index})"
            >
              <i class="fa-solid fa-cart-plus"></i>
              <span>Pedido</span>
            </button>

            ${
              estado === "visitado"
                ? `
                  <button
                    type="button"
                    class="accion-btn ver-btn"
                    disabled
                  >
                    <i class="fa-solid fa-user-check"></i>
                    <span>Visitado</span>
                  </button>
                `
                : `
                  <button
                    type="button"
                    class="accion-btn ver-btn"
                    onclick="marcarVisitado(${index})"
                  >
                    <i class="fa-solid fa-user-check"></i>
                    <span>Visitar</span>
                  </button>
                `
            }

            <button
              type="button"
              class="accion-btn historial-btn"
              onclick="toggleHistorial(${index})"
            >
              <i class="fa-solid fa-clock-rotate-left"></i>
              <span>Historial</span>
            </button>

            <button
              type="button"
              class="accion-btn info-btn"
              onclick="mostrarInformacion(${index})"
            >
              <i class="fa-solid fa-circle-info"></i>
              <span>Info</span>
            </button>

            <button
              type="button"
              class="accion-btn eliminar-btn"
              onclick="eliminarCliente(${index})"
            >
              <i class="fa-regular fa-trash-can"></i>
              <span>Eliminar</span>
            </button>

          </div>

          <div
            id="historial-${index}"
            class="historial"
          >
            ${historialHTML}
          </div>
        `;

        contenedor.appendChild(tarjeta);
      });
    }

    function obtenerIconoNegocio(texto) {
      const valor = normalizarTexto(texto);

      if (
        valor.includes("supermercado") ||
        valor.includes("market")
      ) {
        return "fa-solid fa-cart-shopping";
      }

      if (
        valor.includes("distribuidora") ||
        valor.includes("almacen")
      ) {
        return "fa-solid fa-basket-shopping";
      }

      if (valor.includes("farmacia")) {
        return "fa-solid fa-prescription-bottle-medical";
      }

      if (valor.includes("colmado")) {
        return "fa-solid fa-shop";
      }

      return "fa-solid fa-store";
    }

    function normalizarTexto(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function escaparHTML(valor) {
      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.addEventListener("click", event => {
      if (
        !event.target.closest(".menu-dots") &&
        !event.target.closest(".menu-opciones")
      ) {
        cerrarMenus();
      }
    });

    window.addEventListener("storage", event => {
      if (event.key === "clientes") {
        clientes = cargarClientes();
        renderClientes();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        clientes = cargarClientes();
        reiniciarVisitas();
        renderClientes();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      clientes = cargarClientes();
      reiniciarVisitas();
      renderClientes();
    });
  </script>

</body>
</html>
