<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Productos</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --red: #e52424;
      --red-light: #ffeaea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
      padding-bottom: 35px;
      transition: padding-top 0.3s ease;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-title span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.search-toggle {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    /* BUSCADOR */

    .search-panel {
      position: fixed;
      top: 78px;
      left: 0;
      z-index: 1100;
      width: 100%;
      max-height: 0;
      padding: 0 16px;
      overflow: hidden;
      opacity: 0;
      background: var(--black);
      transition:
        max-height 0.3s ease,
        padding 0.3s ease,
        opacity 0.2s ease;
    }

    .search-panel.active {
      max-height: 95px;
      padding-top: 10px;
      padding-bottom: 15px;
      opacity: 1;
    }

    .search-wrapper {
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      height: 54px;
      padding: 0 54px;
      border: 1px solid #343434;
      border-radius: 17px;
      background: #fff;
      color: var(--text);
      font-size: 15px;
      outline: none;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.2);
    }

    .search-input:focus {
      border-color: var(--orange);
      box-shadow: 0 7px 22px rgba(242, 106, 33, 0.25);
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 19px;
      transform: translateY(-50%);
      color: var(--orange);
      font-size: 18px;
      pointer-events: none;
    }

    .search-close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 39px;
      height: 39px;
      border: none;
      border-radius: 12px;
      background: #f2f3f5;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .search-close:hover {
      background: #e7e8eb;
    }

    body.search-open {
      padding-top: 157px;
    }

    /* CONTENIDO */

    .container {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 22px 16px;
    }

    .page-heading {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .page-heading h1 {
      color: #111;
      font-size: 23px;
    }

    .product-count {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* PRODUCTOS */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      border: 1px solid #ededed;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 30px rgba(0, 0, 0, 0.11);
    }

    .product-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.82;
      overflow: hidden;
      background: #f1f2f4;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stock-badge {
      position: absolute;
      top: 11px;
      left: 11px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(21, 150, 56, 0.94);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(5px);
    }

    .stock-badge.out {
      background: rgba(229, 36, 36, 0.94);
    }

    .product-content {
      padding: 15px;
    }

    .product-name {
      margin-bottom: 7px;
      color: #111;
      font-size: 16px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .product-code {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .product-meta {
      margin-bottom: 13px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .product-price {
      color: var(--orange);
      font-size: 19px;
      font-weight: 900;
    }

    .product-stock {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .add-button {
      min-height: 44px;
      padding: 10px 13px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .add-button:disabled {
      background: #c8cbd0;
      color: #fff;
      cursor: not-allowed;
      box-shadow: none;
    }

    .info-button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 14px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .add-button:active,
    .info-button:active {
      transform: scale(0.96);
    }

    /* SIN RESULTADOS */

    .empty-state {
      grid-column: 1 / -1;
      min-height: 360px;
      padding: 40px 20px;
      border: 1px solid #ededed;
      border-radius: 22px;
      background: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .empty-state.show {
      display: flex;
    }

    .empty-icon {
      width: 125px;
      height: 125px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .empty-state h3 {
      margin-bottom: 7px;
      color: #111;
      font-size: 20px;
    }

    .empty-state p {
      max-width: 330px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* RESPONSIVE */

    @media (max-width: 850px) {
      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      body {
        padding-top: 70px;
      }

      body.search-open {
        padding-top: 146px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
        grid-template-columns: 45px minmax(0, 1fr) 45px;
        gap: 8px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        border-radius: 14px;
        font-size: 19px;
      }

      .header-title {
        gap: 8px;
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      .search-panel {
        top: 70px;
        padding-inline: 10px;
      }

      .search-panel.active {
        padding-top: 9px;
        padding-bottom: 13px;
      }

      .search-input {
        height: 52px;
        border-radius: 16px;
      }

      .container {
        padding: 17px 10px;
      }

      .page-heading h1 {
        font-size: 20px;
      }

      .products-grid {
        gap: 11px;
      }

      .product-content {
        padding: 12px;
      }

      .product-name {
        font-size: 14px;
      }

      .product-price {
        font-size: 17px;
      }

      .product-actions {
        grid-template-columns: 1fr 42px;
      }

      .add-button,
      .info-button {
        min-height: 42px;
      }

      .info-button {
        width: 42px;
        height: 42px;
      }
    }

    @media (max-width: 390px) {
      .header-title span {
        font-size: 16px;
      }

      .product-card {
        border-radius: 16px;
      }

      .product-content {
        padding: 10px;
      }

      .product-name {
        font-size: 13px;
      }

      .product-code,
      .product-stock {
        font-size: 10px;
      }

      .product-price {
        font-size: 15px;
      }

      .add-button {
        padding-inline: 7px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="history.back()"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-boxes-stacked"></i>
      <span>Productos</span>
    </div>

    <button
      type="button"
      class="header-button search-toggle"
      onclick="toggleSearch()"
      aria-label="Buscar producto"
    >
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>

  </header>

  <div
    class="search-panel"
    id="searchPanel"
  >

    <div class="search-wrapper">

      <i class="fa-solid fa-magnifying-glass search-icon"></i>

      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Buscar producto..."
        autocomplete="off"
        oninput="filtrarProductos()"
      >

      <button
        type="button"
        class="search-close"
        onclick="cerrarBusqueda()"
        aria-label="Cerrar búsqueda"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>

  </div>

  <main class="container">

    <div class="page-heading">

      <h1>Lista de productos</h1>

      <span
        class="product-count"
        id="productCount"
      >
        0 productos
      </span>

    </div>

    <section
      class="products-grid"
      id="productsGrid"
    ></section>

    <div
      class="empty-state"
      id="emptyState"
    >

      <div class="empty-icon">
        <i class="fa-solid fa-box-open"></i>
      </div>

      <h3>No se encontraron productos</h3>

      <p>
        Intenta buscar con otro nombre, código o categoría.
      </p>

    </div>

  </main>

  <script>
    let products = cargarProductos();

    function cargarProductos() {
      try {
        const datos = JSON.parse(
          localStorage.getItem("products") || "[]"
        );

        return Array.isArray(datos)
          ? datos
          : [];
      } catch (error) {
        console.warn(
          "No se pudieron cargar los productos:",
          error
        );

        return [];
      }
    }

    function guardarProductos() {
      localStorage.setItem(
        "products",
        JSON.stringify(products)
      );
    }

    function obtenerCarrito() {
      try {
        const datos = JSON.parse(
          localStorage.getItem("cart") || "[]"
        );

        return Array.isArray(datos)
          ? datos
          : [];
      } catch (error) {
        return [];
      }
    }

    function guardarCarrito(cart) {
      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );
    }

    function toggleSearch() {
      const panel =
        document.getElementById("searchPanel");

      const input =
        document.getElementById("searchInput");

      const estaActivo =
        panel.classList.toggle("active");

      document.body.classList.toggle(
        "search-open",
        estaActivo
      );

      if (estaActivo) {
        setTimeout(() => {
          input.focus();
        }, 220);
      } else {
        input.blur();
      }
    }

    function cerrarBusqueda() {
      const panel =
        document.getElementById("searchPanel");

      const input =
        document.getElementById("searchInput");

      panel.classList.remove("active");
      document.body.classList.remove("search-open");

      input.value = "";
      input.blur();

      renderProductos(products);
    }

    function filtrarProductos() {
      const termino = normalizarTexto(
        document.getElementById("searchInput").value
      );

      const filtrados = products.filter(producto => {
        const nombre =
          normalizarTexto(producto.name || producto.nombre);

        const codigo =
          normalizarTexto(producto.code || producto.codigo);

        const categoria =
          normalizarTexto(producto.category || producto.categoria);

        return (
          nombre.includes(termino) ||
          codigo.includes(termino) ||
          categoria.includes(termino)
        );
      });

      renderProductos(filtrados);
    }

    function renderProductos(lista = products) {
      const contenedor =
        document.getElementById("productsGrid");

      const contador =
        document.getElementById("productCount");

      const estadoVacio =
        document.getElementById("emptyState");

      contenedor.innerHTML = "";

      contador.textContent =
        lista.length === 1
          ? "1 producto"
          : `${lista.length} productos`;

      if (lista.length === 0) {
        estadoVacio.classList.add("show");
        return;
      }

      estadoVacio.classList.remove("show");

      lista.forEach(producto => {
        const indiceReal =
          products.indexOf(producto);

        const nombre =
          producto.name ||
          producto.nombre ||
          "Producto";

        const precio =
          Number(
            producto.price ??
            producto.precio ??
            0
          );

        const cantidad =
          Number(
            producto.quantity ??
            producto.cantidad ??
            producto.stock ??
            0
          );

        const codigo =
          producto.code ||
          producto.codigo ||
          "Sin código";

        const imagen =
          producto.image ||
          producto.imagen ||
          "https://via.placeholder.com/500x400?text=Producto";

        const disponible =
          cantidad > 0;

        const tarjeta =
          document.createElement("article");

        tarjeta.className =
          "product-card";

        tarjeta.innerHTML = `
          <div class="product-image">

            <img
              src="${escaparHTML(imagen)}"
              alt="${escaparHTML(nombre)}"
              onerror="
                this.onerror=null;
                this.src='https://via.placeholder.com/500x400?text=Producto';
              "
            >

            <span class="stock-badge ${disponible ? "" : "out"}">
              ${
                disponible
                  ? "Disponible"
                  : "Sin stock"
              }
            </span>

          </div>

          <div class="product-content">

            <h2 class="product-name">
              ${escaparHTML(nombre)}
            </h2>

            <div class="product-code">
              Código: ${escaparHTML(codigo)}
            </div>

            <div class="product-meta">

              <div class="product-price">
                $${formatearMoneda(precio)}
              </div>

              <div class="product-stock">
                Stock: ${cantidad}
              </div>

            </div>

            <div class="product-actions">

              <button
                type="button"
                class="add-button"
                onclick="agregarAlCarrito(${indiceReal})"
                ${disponible ? "" : "disabled"}
              >
                <i class="fa-solid fa-cart-plus"></i>

                ${
                  disponible
                    ? "Agregar"
                    : "Agotado"
                }
              </button>

              <button
                type="button"
                class="info-button"
                onclick="mostrarProducto(${indiceReal})"
                aria-label="Ver información"
              >
                <i class="fa-solid fa-circle-info"></i>
              </button>

            </div>

          </div>
        `;

        contenedor.appendChild(tarjeta);
      });
    }

    function agregarAlCarrito(index) {
      const producto =
        products[index];

      if (!producto) {
        return;
      }

      const cantidadDisponible =
        Number(
          producto.quantity ??
          producto.cantidad ??
          producto.stock ??
          0
        );

      if (cantidadDisponible <= 0) {
        Swal.fire({
          title: "Sin stock",
          text: "Este producto no tiene unidades disponibles.",
          icon: "warning",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      const nombre =
        producto.name ||
        producto.nombre ||
        "Producto";

      const precio =
        Number(
          producto.price ??
          producto.precio ??
          0
        );

      const imagen =
        producto.image ||
        producto.imagen ||
        "";

      const cart =
        obtenerCarrito();

      const productoCarrito =
        cart.find(item =>
          String(item.name || "").toLowerCase() ===
          String(nombre).toLowerCase()
        );

      if (productoCarrito) {
        productoCarrito.quantity =
          Number(productoCarrito.quantity || 0) + 1;
      } else {
        cart.push({
          name: nombre,
          price: precio,
          image: imagen,
          quantity: 1
        });
      }

      if ("quantity" in producto) {
        producto.quantity =
          cantidadDisponible - 1;
      } else if ("cantidad" in producto) {
        producto.cantidad =
          cantidadDisponible - 1;
      } else if ("stock" in producto) {
        producto.stock =
          cantidadDisponible - 1;
      } else {
        producto.quantity =
          cantidadDisponible - 1;
      }

      guardarCarrito(cart);
      guardarProductos();

      filtrarProductos();

      Swal.fire({
        toast: true,
        position: "top",
        icon: "success",
        title: "Producto agregado al carrito",
        showConfirmButton: false,
        timer: 1500
      });
    }

    function mostrarProducto(index) {
      const producto =
        products[index];

      if (!producto) {
        return;
      }

      const nombre =
        producto.name ||
        producto.nombre ||
        "Producto";

      const precio =
        Number(
          producto.price ??
          producto.precio ??
          0
        );

      const cantidad =
        Number(
          producto.quantity ??
          producto.cantidad ??
          producto.stock ??
          0
        );

      const codigo =
        producto.code ||
        producto.codigo ||
        "Sin código";

      const categoria =
        producto.category ||
        producto.categoria ||
        "Sin categoría";

      Swal.fire({
        title: escaparHTML(nombre),

        html: `
          <div style="
            text-align:left;
            color:#4b5563;
            line-height:1.8;
          ">
            <b style="color:#111;">Precio:</b>
            $${formatearMoneda(precio)}
            <br>

            <b style="color:#111;">Stock:</b>
            ${cantidad}
            <br>

            <b style="color:#111;">Código:</b>
            ${escaparHTML(codigo)}
            <br>

            <b style="color:#111;">Categoría:</b>
            ${escaparHTML(categoria)}
          </div>
        `,

        icon: "info",
        confirmButtonText: "Cerrar",
        confirmButtonColor: "#f26a21"
      });
    }

    function formatearMoneda(valor) {
      return Number(valor || 0).toLocaleString(
        "es-DO",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
    }

    function normalizarTexto(valor) {
      return String(valor || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function escaparHTML(valor) {
      return String(valor || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        renderProductos();
      }
    );

    window.addEventListener(
      "storage",
      evento => {
        if (evento.key === "products") {
          products = cargarProductos();
          filtrarProductos();
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          products = cargarProductos();
          filtrarProductos();
        }
      }
    );
  </script>

</body>
</html>
