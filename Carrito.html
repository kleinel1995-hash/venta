<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi Carrito</title>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --purple: #7128df;
      --red: #e52424;
      --red-light: #ffeaea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
      padding-bottom: 190px;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-button {
      position: relative;
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.cart {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    .header-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border: 2px solid var(--black);
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 16px;
      text-align: center;
      display: none;
    }

    /* CONTENIDO */

    .container {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 20px 16px;
    }

    .section-title {
      margin: 4px 3px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title h2 {
      color: #111;
      font-size: 20px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
    }

    /* LISTA DEL CARRITO */

    #cartList {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .cart-item {
      position: relative;
      padding: 16px;
      border: 1px solid #ededed;
      border-radius: 20px;
      background: #fff;
      display: grid;
      grid-template-columns: 105px minmax(0, 1fr);
      gap: 15px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .cart-image-wrapper {
      width: 105px;
      height: 105px;
      padding: 5px;
      border-radius: 17px;
      background: #f4f5f7;
      overflow: hidden;
    }

    .cart-item img {
      width: 100%;
      height: 100%;
      border-radius: 13px;
      object-fit: cover;
      display: block;
    }

    .cart-details {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .cart-details h4 {
      padding-right: 5px;
      margin-bottom: 9px;
      color: #111;
      font-size: 17px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .price-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .price-label {
      color: var(--muted);
      font-size: 13px;
    }

    .price-value {
      color: #111;
      font-size: 14px;
      font-weight: 800;
    }

    .subtotal-value {
      color: var(--orange);
      font-size: 15px;
      font-weight: 900;
    }

    .cart-bottom-row {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .qty-controls {
      height: 40px;
      border: 1px solid #e8e8e8;
      border-radius: 13px;
      background: #f6f7f8;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
    }

    .qty-btn {
      width: 39px;
      height: 100%;
      border: none;
      background: transparent;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .qty-btn:hover {
      background: #eceef0;
    }

    .qty-controls span {
      min-width: 38px;
      padding: 0 8px;
      color: #111;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .remove-btn {
      min-height: 40px;
      padding: 9px 13px;
      border: none;
      border-radius: 13px;
      background: var(--red-light);
      color: var(--red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .remove-btn:hover {
      background: #ffdede;
    }

    /* CARRITO VACÍO */

    .empty-cart {
      min-height: 350px;
      padding: 42px 20px;
      border: 1px solid #ededed;
      border-radius: 22px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .empty-cart-image {
      width: 145px;
      height: 145px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: var(--orange-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--orange);
      font-size: 63px;
    }

    .empty-cart h3 {
      margin-bottom: 8px;
      color: #111;
      font-size: 21px;
    }

    .empty-cart p {
      max-width: 320px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .empty-cart-button {
      margin-top: 18px;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    /* BARRA DE TOTAL */

    .checkout-bar {
      position: fixed;
      z-index: 1250;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%);
      width: min(100%, 760px);
      min-height: 88px;
      padding: 13px 16px;
      border-top: 1px solid #ececec;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
    }

    .checkout-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .checkout-info span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .checkout-info strong {
      color: #111;
      font-size: 22px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .btn-finalizar {
      min-height: 52px;
      padding: 12px 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 6px 17px rgba(242, 106, 33, 0.3);
    }

    .btn-finalizar:hover {
      opacity: 0.95;
    }

    .btn-finalizar:active {
      transform: scale(0.97);
    }

    /* MENÚ INFERIOR */

    .bottom-nav {
      position: fixed;
      z-index: 1300;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 760px);
      height: 84px;
      padding: 7px 12px 5px;
      background: #090909;
      border-radius: 24px 24px 0 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      box-shadow: 0 -7px 24px rgba(0, 0, 0, 0.24);
    }

    .nav-item {
      position: relative;
      height: 67px;
      border: none;
      border-radius: 15px;
      background: transparent;
      color: #b8b8b8;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-item:hover {
      background: #1a1a1a;
      color: #fff;
    }

    .nav-item i {
      font-size: 22px;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      font-weight: 700;
    }

    .nav-badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 25px);
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border: 2px solid #090909;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 15px;
      text-align: center;
      display: none;
    }

    /* RESPONSIVE */

    @media (max-width: 620px) {
      body {
        padding-top: 70px;
        padding-bottom: 185px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        font-size: 20px;
      }

      .header-title {
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      .container {
        padding: 17px 10px;
      }

      .section-title {
        margin-top: 2px;
      }

      .cart-item {
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px;
        padding: 13px;
      }

      .cart-image-wrapper {
        width: 88px;
        height: 88px;
      }

      .cart-details h4 {
        font-size: 15px;
      }

      .price-label {
        font-size: 12px;
      }

      .price-value,
      .subtotal-value {
        font-size: 13px;
      }

      .checkout-bar {
        min-height: 84px;
        padding: 11px 12px;
      }

      .checkout-info strong {
        font-size: 19px;
      }

      .btn-finalizar {
        min-height: 49px;
        padding: 11px 14px;
        font-size: 13px;
      }
    }

    @media (max-width: 390px) {
      .header-title span {
        font-size: 16px;
      }

      .cart-item {
        grid-template-columns: 75px minmax(0, 1fr);
        gap: 10px;
      }

      .cart-image-wrapper {
        width: 75px;
        height: 75px;
      }

      .cart-details h4 {
        font-size: 14px;
      }

      .cart-bottom-row {
        flex-wrap: wrap;
      }

      .qty-controls {
        height: 38px;
      }

      .qty-btn {
        width: 35px;
      }

      .remove-btn {
        min-height: 38px;
        padding: 8px 10px;
      }

      .checkout-info span {
        font-size: 11px;
      }

      .checkout-info strong {
        font-size: 17px;
      }

      .btn-finalizar {
        padding: 10px 12px;
        font-size: 12px;
      }

      .nav-item {
        font-size: 10px;
      }

      .nav-item i {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="history.back()"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Mi Carrito</span>
    </div>

    <button
      type="button"
      class="header-button cart"
      onclick="window.location.href='Carrito.html'"
      aria-label="Carrito"
    >
      <i class="fa-solid fa-bag-shopping"></i>

      <span
        id="cart-count"
        class="header-badge"
      >
        0
      </span>
    </button>

  </header>

  <main class="container">

    <div class="section-title">

      <h2>Mi pedido</h2>

      <span id="cantidadProductosTexto">
        0 productos
      </span>

    </div>

    <div id="cartList"></div>

  </main>

  <section class="checkout-bar">

    <div class="checkout-info">
      <span>Total a pagar</span>
      <strong id="cartTotal">$0.00</strong>
    </div>

    <button
      type="button"
      class="btn-finalizar"
      onclick="finalizarPedido()"
    >
      <i class="fa-solid fa-circle-check"></i>
      Finalizar pedido
    </button>

  </section>

  <nav class="bottom-nav">

    <a href="menu.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </a>

    <a href="mapa.html" class="nav-item">
      <i class="fa-solid fa-map-location-dot"></i>
      <span>Mapa</span>
    </a>

    <a
      href="Carrito.html"
      class="nav-item active"
      aria-current="page"
    >
      <i class="fa-solid fa-cart-shopping"></i>

      <span
        class="nav-badge"
        id="footer-cart-count"
      >
        0
      </span>

      <span>Carrito</span>
    </a>

    <a href="Usuario.html" class="nav-item">
      <i class="fa-solid fa-gear"></i>

      <span
        class="nav-badge"
        id="user-count"
      >
        0
      </span>

      <span>Configuración</span>
    </a>

  </nav>

  <script>
    const cartList =
      document.getElementById("cartList");

    const cartTotal =
      document.getElementById("cartTotal");

    const cartCount =
      document.getElementById("cart-count");

    const footerCartCount =
      document.getElementById(
        "footer-cart-count"
      );

    const cantidadProductosTexto =
      document.getElementById(
        "cantidadProductosTexto"
      );

    let cart =
      JSON.parse(
        localStorage.getItem("cart")
      ) || [];

    let products =
      JSON.parse(
        localStorage.getItem("products")
      ) || [];

    function formatearMoneda(monto) {
      return Number(monto || 0).toLocaleString(
        "es-DO",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
    }

    function escaparHTML(valor) {
      return String(valor || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCart() {
      cartList.innerHTML = "";

      let total = 0;

      if (cart.length === 0) {
        cartList.innerHTML = `
          <div class="empty-cart">

            <div class="empty-cart-image">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>

            <h3>Tu carrito está vacío</h3>

            <p>
              Agrega productos desde el inventario para crear un nuevo pedido.
            </p>

            <a
              href="inventario.html"
              class="empty-cart-button"
            >
              <i class="fa-solid fa-boxes-stacked"></i>
              Ver inventario
            </a>

          </div>
        `;

        cartTotal.innerText = "$0.00";

        cantidadProductosTexto.textContent =
          "0 productos";

        updateCartCount();
        actualizarBurbujaUsuario();

        return;
      }

      cart.forEach((item, index) => {
        const precio =
          Number(item.price || 0);

        const cantidad =
          Number(item.quantity || 0);

        const subtotal =
          precio * cantidad;

        const card =
          document.createElement("article");

        card.className = "cart-item";

        card.innerHTML = `
          <div class="cart-image-wrapper">

            <img
              src="${escaparHTML(
                item.image ||
                "https://via.placeholder.com/105?text=Producto"
              )}"
              alt="${escaparHTML(
                item.name || "Producto"
              )}"
              onerror="
                this.onerror=null;
                this.src='https://via.placeholder.com/105?text=Producto';
              "
            >

          </div>

          <div class="cart-details">

            <h4>
              ${escaparHTML(
                item.name || "Producto"
              )}
            </h4>

            <div class="price-row">

              <span class="price-label">
                Precio
              </span>

              <span class="price-value">
                $${formatearMoneda(precio)}
              </span>

            </div>

            <div class="price-row">

              <span class="price-label">
                Subtotal
              </span>

              <span class="subtotal-value">
                $${formatearMoneda(subtotal)}
              </span>

            </div>

            <div class="cart-bottom-row">

              <div class="qty-controls">

                <button
                  type="button"
                  class="qty-btn"
                  onclick="updateQuantity(${index}, -1)"
                  aria-label="Disminuir cantidad"
                >
                  −
                </button>

                <span>${cantidad}</span>

                <button
                  type="button"
                  class="qty-btn"
                  onclick="updateQuantity(${index}, 1)"
                  aria-label="Aumentar cantidad"
                >
                  +
                </button>

              </div>

              <button
                type="button"
                class="remove-btn"
                onclick="removeItem(${index})"
              >
                <i class="fa-regular fa-trash-can"></i>
                Eliminar
              </button>

            </div>

          </div>
        `;

        total += subtotal;

        cartList.appendChild(card);
      });

      cartTotal.innerText =
        `$${formatearMoneda(total)}`;

      const totalCantidad =
        cart.reduce(
          (suma, item) =>
            suma + Number(
              item.quantity || 0
            ),
          0
        );

      cantidadProductosTexto.textContent =
        totalCantidad === 1
          ? "1 producto"
          : `${totalCantidad} productos`;

      updateCartCount();
    }

    function updateCartCount() {
      const totalQty =
        cart.reduce(
          (sum, item) =>
            sum + Number(
              item.quantity || 0
            ),
          0
        );

      const texto =
        totalQty > 99
          ? "99+"
          : totalQty;

      cartCount.innerText = texto;

      cartCount.style.display =
        totalQty > 0
          ? "inline-block"
          : "none";

      if (footerCartCount) {
        footerCartCount.innerText =
          texto;

        footerCartCount.style.display =
          totalQty > 0
            ? "inline-block"
            : "none";
      }
    }

    function updateQuantity(
      index,
      change
    ) {
      const item = cart[index];

      const prod =
        products.find(
          producto =>
            producto.name === item.name
        );

      if (!prod) {
        return;
      }

      if (change === 1) {
        if (
          Number(prod.quantity || 0) <= 0
        ) {
          Swal.fire({
            title: "Sin stock",
            text: "No hay más unidades disponibles.",
            icon: "warning",
            confirmButtonColor: "#f26a21"
          });

          return;
        }

        item.quantity =
          Number(item.quantity || 0) + 1;

        prod.quantity =
          Number(prod.quantity || 0) - 1;
      } else {
        if (
          Number(item.quantity || 0) === 1
        ) {
          Swal.fire({
            title:
              "¿Eliminar este producto?",

            text:
              "El producto será retirado del carrito.",

            icon: "question",

            showCancelButton: true,

            confirmButtonText:
              "Sí, eliminar",

            cancelButtonText:
              "Cancelar",

            confirmButtonColor:
              "#e52424",

            cancelButtonColor:
              "#737985"
          }).then(result => {
            if (result.isConfirmed) {
              devolverAlInventario(
                item.name,
                1
              );

              cart.splice(index, 1);

              saveAll();
              renderCart();
            }
          });

          return;
        }

        item.quantity =
          Number(item.quantity || 0) - 1;

        prod.quantity =
          Number(prod.quantity || 0) + 1;
      }

      saveAll();
      renderCart();
    }

    function removeItem(index) {
      Swal.fire({
        title:
          "¿Eliminar este producto?",

        text:
          "Las unidades regresarán al inventario.",

        icon: "warning",

        showCancelButton: true,

        confirmButtonText:
          "Eliminar",

        cancelButtonText:
          "Cancelar",

        confirmButtonColor:
          "#e52424",

        cancelButtonColor:
          "#737985"
      }).then(result => {
        if (result.isConfirmed) {
          devolverAlInventario(
            cart[index].name,
            cart[index].quantity
          );

          cart.splice(index, 1);

          saveAll();
          renderCart();
        }
      });
    }

    function devolverAlInventario(
      nombre,
      cantidad
    ) {
      const producto =
        products.find(
          producto =>
            producto.name === nombre
        );

      if (producto) {
        producto.quantity =
          Number(
            producto.quantity || 0
          ) +
          Number(cantidad || 0);
      }
    }

    function saveAll() {
      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      localStorage.setItem(
        "products",
        JSON.stringify(products)
      );
    }

    function finalizarPedido() {
      if (cart.length === 0) {
        Swal.fire({
          title: "Carrito vacío",
          text:
            "No tienes productos para finalizar.",
          icon: "info",
          confirmButtonColor:
            "#f26a21"
        });

        return;
      }

      const total =
        cart.reduce(
          (sum, item) =>
            sum +
            Number(item.price || 0) *
            Number(item.quantity || 0),
          0
        );

      const fecha =
        new Date().toLocaleString(
          "es-DO"
        );

      const pedido = {
        fecha,
        total,

        productos:
          cart.map(producto => ({
            nombre:
              producto.name,

            cantidad:
              producto.quantity,

            precio:
              producto.price,

            subtotal:
              Number(
                producto.price || 0
              ) *
              Number(
                producto.quantity || 0
              ),

            imagen:
              producto.image || ""
          })),

        estado:
          "pendiente",

        despachado:
          false
      };

      const historial =
        JSON.parse(
          localStorage.getItem(
            "historialPedidos"
          )
        ) || [];

      historial.push(pedido);

      localStorage.setItem(
        "historialPedidos",
        JSON.stringify(historial)
      );

      cart = [];

      localStorage.removeItem("cart");

      saveAll();
      renderCart();
      actualizarBurbujaUsuario();

      Swal.fire({
        title:
          "Pedido finalizado",

        html: `
          <div style="
            color:#4b5563;
            line-height:1.7;
          ">
            Tu pedido fue registrado correctamente.
            <br>

            <strong style="
              display:block;
              margin-top:8px;
              color:#111;
              font-size:20px;
            ">
              Total: $${formatearMoneda(total)}
            </strong>
          </div>
        `,

        icon: "success",

        confirmButtonText:
          "Ver pedidos",

        confirmButtonColor:
          "#f26a21"
      }).then(() => {
        window.location.href =
          "Pedidos.html";
      });
    }

    function actualizarBurbujaUsuario() {
      const elemento =
        document.getElementById(
          "user-count"
        );

      if (!elemento) {
        return;
      }

      const pedidos =
        JSON.parse(
          localStorage.getItem(
            "historialPedidos"
          )
        ) || [];

      const estadosPendientes = [
        "pendiente",
        "en proceso",
        "por entregar",
        "no entregado"
      ];

      const pendientes =
        pedidos.filter(pedido =>
          estadosPendientes.includes(
            String(
              pedido.estado || ""
            ).toLowerCase()
          )
        ).length;

      const count =
        pendientes > 0
          ? pendientes
          : pedidos.length;

      elemento.textContent =
        count > 99
          ? "99+"
          : count;

      elemento.style.display =
        count > 0
          ? "inline-block"
          : "none";
    }

    renderCart();
    actualizarBurbujaUsuario();

    window.addEventListener(
      "storage",
      evento => {
        if (
          evento.key ===
          "historialPedidos"
        ) {
          actualizarBurbujaUsuario();
        }

        if (
          evento.key === "cart"
        ) {
          cart =
            JSON.parse(
              localStorage.getItem(
                "cart"
              )
            ) || [];

          renderCart();
        }

        if (
          evento.key === "products"
        ) {
          products =
            JSON.parse(
              localStorage.getItem(
                "products"
              )
            ) || [];
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          cart =
            JSON.parse(
              localStorage.getItem(
                "cart"
              )
            ) || [];

          products =
            JSON.parse(
              localStorage.getItem(
                "products"
              )
            ) || [];

          renderCart();
          actualizarBurbujaUsuario();
        }
      }
    );
  </script>

</body>
</html>
