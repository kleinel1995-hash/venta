<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kleinel Soluciones - Cargando</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      text-align: center;
    }
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('fondo.png') no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .logo-container {
      text-align: center;
    }
    .logo {
      width: 160px;
      margin-bottom: 20px;
    }
    .spinner {
      border: 6px solid #eee;
      border-top: 6px solid #4CAF50;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo-container">
      <img src="logo.png" alt="Kleinel Logo" class="logo">
      <div class="spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener("load", function () {
      setTimeout(() => {
        const loader = document.getElementById("loader");
        loader.classList.add("fade-out");
        setTimeout(() => {
          window.location.href = "login.html"; // Redirige a login después del fade
        }, 800);
      }, 2000); // tiempo visible del loader
    });
  </script>
</body>
</html>
