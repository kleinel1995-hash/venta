
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedidos</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding-bottom: 100px;
    }
    header {
      background-color: #000000;
      color: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
      position: relative;
    }
    header span.back-arrow {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      cursor: pointer;
    }
    .venta {
      background-color: #fff;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .venta h3 {
      margin: 0 0 10px;
      color: #00796b;
    }
    .cliente-info {
      background-color: #e8f5e9;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .cliente-info p{ margin: 4px 0; }
    .producto {
      display: flex;
      align-items: center;
      background-color: #f9f9f9;
      margin: 8px 0;
      padding: 10px;
      border-radius: 6px;
      gap: 10px;
    }
    .producto img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background:#eee;
    }
    .producto-info { flex: 1; }
    .producto-info p { margin: 2px 0; }
    .total {
      font-weight: bold;
      font-size: 16px;
      margin-top: 8px;
      text-align: right;
      color: #333;
    }
    .btn {
      background-color: #00796b;
      color: white;
      border: none;
      padding: 8px 14px;
      margin-top: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn[disabled]{ cursor:not-allowed; opacity:.85; }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: min(420px, 92vw);
    }
    .modal-content h3 { margin-bottom: 15px; }
    .modal-content button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      min-width: 140px;
    }
    .contado { background-color: #28a745; color: white; }
    .credito { background-color: #ffc107; color: black; }
    .cancelar { background:#eee; color:#111; }

    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:#efefef;
      color:#222;
      margin-top:8px;
    }
  </style>
</head>
<body>
<header>
  <span class="back-arrow" onclick="window.history.back()">←</span>
  Pedidos
</header>

<div id="historialContainer"></div>

<script>
  // ===================== BASE =====================
  const historialContainer = document.getElementById('historialContainer');

  const historial = JSON.parse(localStorage.getItem('historialPedidos')) || [];
  const ventasRealizadas = JSON.parse(localStorage.getItem('ventasRealizadas')) || [];
  const cuentasPorCobrar = JSON.parse(localStorage.getItem('cuentasPorCobrar')) || [];

  // cliente seleccionado "global" (si lo guardas así en tu app)
  const clienteSeleccionado = JSON.parse(localStorage.getItem('clienteSeleccionado')) || null;

  function guardarLS(key, data){ localStorage.setItem(key, JSON.stringify(data)); }
  function normaliza(x){ return String(x||'').trim(); }

  // ===================== USUARIO / VENDEDOR =====================
  function getVendedorSesionLegible(){
    try{
      const us = JSON.parse(localStorage.getItem('usuarioSesion')||'null');
      if (us?.nombre)  return String(us.nombre);
      if (us?.usuario) return String(us.usuario);
    }catch(e){}
    try{
      const cu = JSON.parse(localStorage.getItem('currentUser')||'null');
      if (cu?.name) return String(cu.name);
      if (cu?.username) return String(cu.username);
      if (cu?.role && String(cu.role).trim()) return String(cu.role);
    }catch(e){}
    const nombreUsuario = localStorage.getItem('nombreUsuario');
    if (nombreUsuario) return String(nombreUsuario);
    const rol = localStorage.getItem('rol');
    if (rol) return String(rol);
    return 'No definido';
  }

  // ===================== CLIENTE ROBUSTO =====================
  function normalizaClienteObj(c){
    if (!c) return null;
    const obj = { ...c };

    if (!obj.negocio && obj.nombreNegocio) obj.negocio = obj.nombreNegocio;
    if (!obj.direccion && obj.dirección) obj.direccion = obj.dirección;
    if (!obj.telefono && obj.tel) obj.telefono = obj.tel;

    // asegurar strings
    if (obj.negocio != null) obj.negocio = String(obj.negocio);
    if (obj.direccion != null) obj.direccion = String(obj.direccion);
    if (obj.telefono != null) obj.telefono = String(obj.telefono);

    return obj;
  }

  function obtenerClienteParaPedido(pedido){
    // 1) si ya viene dentro del pedido
    if (pedido?.clienteInfo) return normalizaClienteObj(pedido.clienteInfo);
    if (pedido?.cliente) return normalizaClienteObj(pedido.cliente);

    // 2) cliente seleccionado global
    if (clienteSeleccionado) return normalizaClienteObj(clienteSeleccionado);

    // 3) campos sueltos
    const negocio = pedido?.negocio || pedido?.nombreNegocio || '';
    const direccion = pedido?.direccion || pedido?.dirección || '';
    const telefono = pedido?.telefono || pedido?.tel || '';
    if (negocio || direccion || telefono) return normalizaClienteObj({ negocio, direccion, telefono });

    return null;
  }

  // ===================== MODAL ENTREGA =====================
  function mostrarModal(pedido, index) {
    const modal = document.createElement('div');
    modal.className = 'modal';

    modal.innerHTML = `
      <div class="modal-content">
        <h3>¿Cómo deseas registrar esta venta?</h3>
        <button class="contado">Al Contado</button>
        <button class="credito">A Crédito</button>
        <div style="margin-top:10px;">
          <button class="cancelar">Cancelar</button>
        </div>
      </div>
    `;

    const clienteFinal = obtenerClienteParaPedido(pedido);
    const vendedor = getVendedorSesionLegible();

    modal.querySelector('.cancelar').onclick = () => modal.remove();

    // ✅ CONTADO: guardar venta con cliente + vendedor
    modal.querySelector('.contado').onclick = () => {
      const venta = {
        ...pedido,
        clienteInfo: clienteFinal,
        vendedor: pedido?.vendedor || vendedor
      };

      ventasRealizadas.push(venta);
      historial.splice(index, 1);

      guardarLS('ventasRealizadas', ventasRealizadas);
      guardarLS('historialPedidos', historial);

      modal.remove();
      renderHistorial();
    };

    // ✅ CRÉDITO: guardar cuenta por cobrar con cliente + vendedor
    modal.querySelector('.credito').onclick = () => {
      const cuenta = {
        ...pedido,
        clienteInfo: clienteFinal,
        vendedor: pedido?.vendedor || vendedor,
        estado: 'pendiente',
        creadoEn: new Date().toISOString()
      };

      cuentasPorCobrar.push(cuenta);
      historial.splice(index, 1);

      guardarLS('cuentasPorCobrar', cuentasPorCobrar);
      guardarLS('historialPedidos', historial);

      modal.remove();
      renderHistorial();
    };

    document.body.appendChild(modal);
  }

  // ===================== DESPACHAR / ENTREGAR =====================
  window.despachar = function(index){
    const btnDespachar = document.getElementById(`btnDespachar-${index}`);
    const btnEntregar = document.getElementById(`btnEntregar-${index}`);

    btnDespachar.innerText = "✅ Despachado";
    btnDespachar.disabled = true;
    btnDespachar.style.backgroundColor = "#6c757d";
    btnEntregar.style.display = "inline-block";

    historial[index].despachado = true;

    // ✅ también guardamos vendedor y cliente dentro del pedido (para que no se pierda)
    if (!historial[index].vendedor) historial[index].vendedor = getVendedorSesionLegible();
    if (!historial[index].clienteInfo) {
      const c = obtenerClienteParaPedido(historial[index]);
      if (c) historial[index].clienteInfo = c;
    }

    guardarLS('historialPedidos', historial);
  }

  window.entregarPedido = function(index){
    // Antes de entregar, asegurar cliente+vendedor adentro del pedido
    if (!historial[index].vendedor) historial[index].vendedor = getVendedorSesionLegible();
    if (!historial[index].clienteInfo) {
      const c = obtenerClienteParaPedido(historial[index]);
      if (c) historial[index].clienteInfo = c;
    }
    guardarLS('historialPedidos', historial);

    mostrarModal(historial[index], index);
  }

  // ===================== RENDER =====================
  function renderHistorial(){
    historialContainer.innerHTML = '';

    if (historial.length === 0){
      historialContainer.innerHTML = "<p style='text-align:center; padding:20px;'>No hay pedidos aún.</p>";
      return;
    }

    historial.forEach((pedido, index) => {
      const div = document.createElement('div');
      div.className = 'venta';

      // ✅ cliente por pedido (no solo global)
      const c = obtenerClienteParaPedido(pedido);

      let clienteHtml = c ? `
        <div class="cliente-info">
          <p><strong>Negocio:</strong> ${c.negocio || 'No disponible'}</p>
          <p><strong>Teléfono:</strong> ${c.telefono || '-'}</p>
          <p><strong>Dirección:</strong> ${c.direccion || '-'}</p>
        </div>
      ` : `
        <div class="cliente-info">
          <p><strong>Cliente:</strong> No seleccionado</p>
          <p class="muted" style="margin:0;">Selecciona un cliente para que salga en Ventas.</p>
        </div>
      `;

      const productosHtml = (pedido.productos || []).map(prod => `
        <div class="producto">
          <img src="${prod.imagen || 'https://via.placeholder.com/60'}" alt="${prod.nombre || ''}">
          <div class="producto-info">
            <p><strong>${prod.nombre || 'Producto'}</strong></p>
            <p>Cantidad: ${Number(prod.cantidad || 0).toLocaleString('es-DO')}</p>
            <p>Precio: $${Number(prod.precio || 0).toLocaleString('es-DO', { minimumFractionDigits: 2 })}</p>
            <p>Subtotal: $${Number(prod.subtotal ?? (prod.precio||0)*(prod.cantidad||0)).toLocaleString('es-DO', { minimumFractionDigits: 2 })}</p>
          </div>
        </div>
      `).join('');

      const despachado = pedido.despachado === true;

      div.innerHTML = `
        <h3>🕒 ${pedido.fecha || '-'}</h3>
        ${clienteHtml}
        ${productosHtml}
        <p class="total">Total del Pedido: $${Number(pedido.total || 0).toLocaleString('es-DO', { minimumFractionDigits: 2 })}</p>

        <span class="pill">Vendedor: ${pedido.vendedor || getVendedorSesionLegible()}</span>

        <br>

        <button class="btn" id="btnDespachar-${index}"
          ${despachado ? 'disabled' : ''}
          style="${despachado ? 'background-color:#6c757d;' : ''}">
          ${despachado ? '✅ Despachado' : 'Despachar'}
        </button>

        <button class="btn" id="btnEntregar-${index}"
          style="display:${despachado ? 'inline-block' : 'none'};">
          Entregar
        </button>
      `;

      historialContainer.appendChild(div);

      if (!despachado){
        document.getElementById(`btnDespachar-${index}`).onclick = () => window.despachar(index);
      }

      document.getElementById(`btnEntregar-${index}`).onclick = () => window.entregarPedido(index);
    });
  }

  renderHistorial();
</script>
</body>
</html>
