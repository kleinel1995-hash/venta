<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pedidos</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --yellow: #b77900;
      --yellow-light: #fff4cc;
      --red: #e52424;
      --red-light: #ffeaea;
      --gray-light: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
      padding-bottom: 40px;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-title span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-button {
      position: relative;
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.refresh {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    /* CONTENIDO */

    .container {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 22px 16px;
    }

    .page-heading {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .page-heading h1 {
      color: #111;
      font-size: 23px;
    }

    .orders-count {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* LISTA DE PEDIDOS */

    #historialContainer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .venta {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid #ededed;
      border-radius: 21px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .venta:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 30px rgba(0, 0, 0, 0.11);
    }

    .venta-header {
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .venta-heading {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .venta-icon {
      width: 49px;
      height: 49px;
      border-radius: 16px;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .venta-heading-text {
      min-width: 0;
    }

    .venta-heading-text strong {
      display: block;
      color: #111;
      font-size: 16px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .venta-heading-text span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-badge {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-badge.pendiente {
      background: var(--yellow-light);
      color: var(--yellow);
    }

    .status-badge.parcial {
      background: var(--orange-light);
      color: var(--orange);
    }

    .status-badge.despachado {
      background: var(--blue-light);
      color: var(--blue);
    }

    /* CLIENTE */

    .cliente-info {
      margin-bottom: 15px;
      padding: 14px;
      border: 1px solid #e8ecef;
      border-radius: 16px;
      background: #f8fafb;
      display: grid;
      gap: 9px;
    }

    .cliente-info p {
      margin: 0;
      color: #4b5563;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .cliente-info p i {
      width: 17px;
      margin-top: 2px;
      color: var(--orange);
      text-align: center;
      flex-shrink: 0;
    }

    .cliente-info strong {
      color: #111;
    }

    /* PRODUCTOS */

    .products-title {
      margin-bottom: 9px;
      color: #111;
      font-size: 13px;
      font-weight: 800;
    }

    .producto {
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .producto:last-child {
      border-bottom: none;
    }

    .producto-image {
      width: 58px;
      height: 58px;
      padding: 4px;
      border-radius: 14px;
      background: #f2f3f5;
      overflow: hidden;
      flex-shrink: 0;
    }

    .producto img {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      object-fit: cover;
      display: block;
    }

    .producto-info {
      min-width: 0;
      flex: 1;
    }

    .producto-info p {
      margin: 3px 0;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .producto-info p strong {
      color: #111;
      font-size: 14px;
    }

    .pending-label {
      margin-left: auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--yellow-light);
      color: var(--yellow);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* DESPACHADOS */

    .dispatched-section {
      margin-top: 15px;
      padding: 13px;
      border: 1px solid #cde9d2;
      border-radius: 16px;
      background: var(--green-light);
    }

    .dispatched-section-title {
      margin-bottom: 9px;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .dispatched-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(21, 150, 56, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #315c39;
      font-size: 12px;
    }

    .dispatched-item:last-child {
      border-bottom: none;
    }

    .dispatched-item strong {
      color: #174c25;
    }

    /* RESUMEN */

    .order-summary {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .total {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .total span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .total strong {
      color: var(--orange);
      font-size: 20px;
      line-height: 1.2;
    }

    .seller-pill {
      max-width: 55%;
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--gray-light);
      color: #4b5563;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BOTONES */

    .order-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 47px;
      padding: 10px 14px;
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .dispatch-btn {
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      box-shadow: 0 5px 15px rgba(242, 106, 33, 0.24);
    }

    .dispatch-btn:disabled {
      background: #a5a9b0;
      color: #fff;
      cursor: not-allowed;
      box-shadow: none;
    }

    .deliver-btn {
      background: var(--green-light);
      color: var(--green);
    }

    .deliver-btn.hidden {
      display: none;
    }

    /* SIN PEDIDOS */

    .empty-state {
      grid-column: 1 / -1;
      min-height: 360px;
      padding: 40px 20px;
      border: 1px solid #ededed;
      border-radius: 22px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .empty-icon {
      width: 125px;
      height: 125px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .empty-state h3 {
      margin-bottom: 7px;
      color: #111;
      font-size: 20px;
    }

    .empty-state p {
      max-width: 330px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* MODAL ENTREGA */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      padding: 20px;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      width: min(430px, 100%);
      padding: 22px;
      border-radius: 22px;
      background: #fff;
      text-align: center;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
    }

    .modal-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 21px;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .modal-content h3 {
      margin-bottom: 8px;
      color: #111;
      font-size: 21px;
    }

    .modal-content > p {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .payment-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-content button {
      min-height: 49px;
      padding: 10px 16px;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
    }

    .contado {
      background: var(--green-light);
      color: var(--green);
    }

    .credito {
      background: var(--yellow-light);
      color: var(--yellow);
    }

    .cancelar {
      width: 100%;
      margin-top: 10px;
      background: var(--gray-light);
      color: #4b5563;
    }

    /* LISTA DE DESPACHO */

    .dispatch-list {
      max-height: 360px;
      margin-top: 10px;
      overflow-y: auto;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .dispatch-item {
      position: relative;
      padding: 12px;
      border: 1px solid #e6e8eb;
      border-radius: 15px;
      background: #f8f9fa;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 34px;
      gap: 11px;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .dispatch-item.approved {
      border-color: #a9dfb4;
      background: var(--green-light);
    }

    .dispatch-image {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      background: #eceef0;
    }

    .dispatch-details {
      min-width: 0;
    }

    .dispatch-details strong {
      display: block;
      margin-bottom: 4px;
      color: #111;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .dispatch-details span {
      color: var(--muted);
      font-size: 11px;
    }

    .dispatch-check {
      position: relative;
      width: 29px;
      height: 29px;
    }

    .dispatch-check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .custom-check {
      width: 29px;
      height: 29px;
      border: 2px solid #c8ccd2;
      border-radius: 9px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 14px;
      transition: all 0.2s;
    }

    .dispatch-check input:checked + .custom-check {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .dispatch-progress {
      margin-bottom: 11px;
      padding: 11px 13px;
      border-radius: 13px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    /* RESPONSIVE */

    @media (max-width: 820px) {
      #historialContainer {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        padding-top: 70px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
        grid-template-columns: 45px minmax(0, 1fr) 45px;
        gap: 8px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        border-radius: 14px;
        font-size: 19px;
      }

      .header-title {
        gap: 8px;
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      .container {
        padding: 17px 10px;
      }

      .page-heading h1 {
        font-size: 20px;
      }

      .venta {
        padding: 15px;
      }

      .venta-icon {
        width: 45px;
        height: 45px;
        font-size: 19px;
      }

      .cliente-info {
        padding: 12px;
      }

      .producto-image {
        width: 53px;
        height: 53px;
      }

      .order-summary {
        align-items: flex-start;
        flex-direction: column;
      }

      .seller-pill {
        max-width: 100%;
      }
    }

    @media (max-width: 390px) {
      .header-title span {
        font-size: 16px;
      }

      .order-actions,
      .payment-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="window.history.back()"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-box"></i>
      <span>Pedidos</span>
    </div>

    <button
      type="button"
      class="header-button refresh"
      onclick="recargarPedidos()"
      aria-label="Actualizar pedidos"
      title="Actualizar"
    >
      <i class="fa-solid fa-rotate"></i>
    </button>

  </header>

  <main class="container">

    <div class="page-heading">

      <h1>Pedidos registrados</h1>

      <span
        class="orders-count"
        id="ordersCount"
      >
        0 pedidos
      </span>

    </div>

    <div id="historialContainer"></div>

  </main>

  <script>
    const historialContainer =
      document.getElementById("historialContainer");

    const ordersCount =
      document.getElementById("ordersCount");

    let historial =
      cargarArregloLocalStorage("historialPedidos");

    let ventasRealizadas =
      cargarArregloLocalStorage("ventasRealizadas");

    let cuentasPorCobrar =
      cargarArregloLocalStorage("cuentasPorCobrar");

    const clienteSeleccionado =
      cargarObjetoLocalStorage("clienteSeleccionado");

    function cargarArregloLocalStorage(key) {
      try {
        const datos = JSON.parse(
          localStorage.getItem(key) || "[]"
        );

        return Array.isArray(datos)
          ? datos
          : [];
      } catch (error) {
        console.warn(
          `No se pudo leer ${key}:`,
          error
        );

        return [];
      }
    }

    function cargarObjetoLocalStorage(key) {
      try {
        return JSON.parse(
          localStorage.getItem(key) || "null"
        );
      } catch (error) {
        return null;
      }
    }

    function guardarLS(key, data) {
      localStorage.setItem(
        key,
        JSON.stringify(data)
      );
    }

    function escaparHTML(valor) {
      return String(valor || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatearMoneda(valor) {
      return Number(valor || 0).toLocaleString(
        "es-DO",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
    }

    function calcularSubtotalProducto(producto) {
      if (producto.subtotal != null) {
        return Number(producto.subtotal || 0);
      }

      return (
        Number(producto.precio || 0) *
        Number(producto.cantidad || 0)
      );
    }

    function calcularTotalProductos(productos) {
      return (productos || []).reduce(
        (total, producto) =>
          total + calcularSubtotalProducto(producto),
        0
      );
    }

    function getVendedorSesionLegible() {
      try {
        const usuario = JSON.parse(
          localStorage.getItem("usuarioSesion") || "null"
        );

        if (usuario?.nombre) {
          return String(usuario.nombre);
        }

        if (usuario?.usuario) {
          return String(usuario.usuario);
        }
      } catch (error) {}

      try {
        const usuario = JSON.parse(
          localStorage.getItem("currentUser") || "null"
        );

        if (usuario?.name) {
          return String(usuario.name);
        }

        if (usuario?.username) {
          return String(usuario.username);
        }

        if (usuario?.role) {
          return String(usuario.role);
        }
      } catch (error) {}

      return (
        localStorage.getItem("nombreUsuario") ||
        localStorage.getItem("rol") ||
        "No definido"
      );
    }

    function normalizaClienteObj(cliente) {
      if (!cliente) return null;

      const obj = {
        ...cliente
      };

      obj.negocio =
        obj.negocio ||
        obj.nombreNegocio ||
        "";

      obj.direccion =
        obj.direccion ||
        obj.dirección ||
        "";

      obj.telefono =
        obj.telefono ||
        obj.tel ||
        "";

      return obj;
    }

    function obtenerClienteParaPedido(pedido) {
      if (pedido?.clienteInfo) {
        return normalizaClienteObj(
          pedido.clienteInfo
        );
      }

      if (
        pedido?.cliente &&
        typeof pedido.cliente === "object"
      ) {
        return normalizaClienteObj(
          pedido.cliente
        );
      }

      if (pedido?.clienteSeleccionado) {
        return normalizaClienteObj(
          pedido.clienteSeleccionado
        );
      }

      if (clienteSeleccionado) {
        return normalizaClienteObj(
          clienteSeleccionado
        );
      }

      const negocio =
        pedido?.negocio ||
        pedido?.nombreNegocio ||
        (
          typeof pedido?.cliente === "string"
            ? pedido.cliente
            : ""
        );

      const direccion =
        pedido?.direccion ||
        pedido?.dirección ||
        "";

      const telefono =
        pedido?.telefono ||
        pedido?.tel ||
        "";

      if (negocio || direccion || telefono) {
        return normalizaClienteObj({
          negocio,
          direccion,
          telefono
        });
      }

      return null;
    }

    function mostrarListaDespacho(index) {
      const pedido = historial[index];

      if (!pedido) return;

      const productos = Array.isArray(pedido.productos)
        ? pedido.productos
        : [];

      if (productos.length === 0) {
        Swal.fire({
          position: "center",
          title: "Sin artículos pendientes",
          text: "Este pedido ya no tiene artículos pendientes para despachar.",
          icon: "info",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      const listaHTML = productos.map(
        (producto, productoIndex) => `
          <label
            class="dispatch-item"
            id="dispatchItem-${productoIndex}"
          >

            <img
              class="dispatch-image"
              src="${escaparHTML(
                producto.imagen ||
                "https://via.placeholder.com/48?text=P"
              )}"
              alt="${escaparHTML(
                producto.nombre || "Producto"
              )}"
              onerror="
                this.onerror=null;
                this.src='https://via.placeholder.com/48?text=P';
              "
            >

            <div class="dispatch-details">

              <strong>
                ${escaparHTML(
                  producto.nombre || "Producto"
                )}
              </strong>

              <span>
                Cantidad:
                ${Number(
                  producto.cantidad || 0
                ).toLocaleString("es-DO")}
              </span>

            </div>

            <span class="dispatch-check">

              <input
                type="checkbox"
                class="dispatch-checkbox"
                data-index="${productoIndex}"
              >

              <span class="custom-check">
                <i class="fa-solid fa-check"></i>
              </span>

            </span>

          </label>
        `
      ).join("");

      Swal.fire({
        position: "center",
        title: "Seleccionar artículos",

        html: `
          <div
            class="dispatch-progress"
            id="dispatchProgress"
          >
            0 de ${productos.length} artículos aprobados
          </div>

          <div class="dispatch-list">
            ${listaHTML}
          </div>
        `,

        width: 520,
        showCancelButton: true,
        confirmButtonText: "Enviar aprobados",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#f26a21",
        cancelButtonColor: "#737985",
        focusConfirm: false,

        didOpen: () => {
          const checkboxes =
            document.querySelectorAll(
              ".dispatch-checkbox"
            );

          function actualizarEstado() {
            let aprobados = 0;

            checkboxes.forEach(checkbox => {
              const indice =
                Number(checkbox.dataset.index);

              const item =
                document.getElementById(
                  `dispatchItem-${indice}`
                );

              item?.classList.toggle(
                "approved",
                checkbox.checked
              );

              if (checkbox.checked) {
                aprobados++;
              }
            });

            const progreso =
              document.getElementById(
                "dispatchProgress"
              );

            if (progreso) {
              progreso.textContent =
                `${aprobados} de ${productos.length} artículos aprobados`;
            }
          }

          checkboxes.forEach(checkbox => {
            checkbox.addEventListener(
              "change",
              actualizarEstado
            );
          });

          actualizarEstado();
        },

        preConfirm: () => {
          const checkboxes = Array.from(
            document.querySelectorAll(
              ".dispatch-checkbox"
            )
          );

          const indicesAprobados =
            checkboxes
              .filter(
                checkbox =>
                  checkbox.checked
              )
              .map(
                checkbox =>
                  Number(
                    checkbox.dataset.index
                  )
              );

          if (
            indicesAprobados.length === 0
          ) {
            Swal.showValidationMessage(
              "Debes aprobar al menos un artículo."
            );

            return false;
          }

          return indicesAprobados;
        }
      }).then(resultado => {
        if (!resultado.isConfirmed) {
          return;
        }

        confirmarDespachoParcial(
          index,
          resultado.value
        );
      });
    }

    function confirmarDespachoParcial(
      index,
      indicesAprobados
    ) {
      const pedido = historial[index];

      if (
        !pedido ||
        !Array.isArray(indicesAprobados) ||
        indicesAprobados.length === 0
      ) {
        return;
      }

      const productosOriginales =
        Array.isArray(pedido.productos)
          ? pedido.productos
          : [];

      const articulosAprobados =
        productosOriginales.filter(
          (producto, productoIndex) =>
            indicesAprobados.includes(
              productoIndex
            )
        );

      const articulosPendientes =
        productosOriginales.filter(
          (producto, productoIndex) =>
            !indicesAprobados.includes(
              productoIndex
            )
        );

      if (
        articulosAprobados.length === 0
      ) {
        Swal.fire({
          position: "center",
          title: "Sin artículos aprobados",
          text: "No se seleccionó ningún artículo para enviar.",
          icon: "warning",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      const fechaDespacho =
        new Date().toLocaleString(
          "es-DO"
        );

      const totalDespachado =
        calcularTotalProductos(
          articulosAprobados
        );

      if (
        !Array.isArray(
          pedido.despachosParciales
        )
      ) {
        pedido.despachosParciales = [];
      }

      pedido.despachosParciales.push({
        fecha: fechaDespacho,
        productos: articulosAprobados,
        total: totalDespachado,
        vendedor:
          pedido.vendedor ||
          getVendedorSesionLegible()
      });

      pedido.productosDespachados = [
        ...(
          Array.isArray(
            pedido.productosDespachados
          )
            ? pedido.productosDespachados
            : []
        ),
        ...articulosAprobados
      ];

      pedido.productos =
        articulosPendientes;

      pedido.totalPendiente =
        calcularTotalProductos(
          articulosPendientes
        );

      pedido.fechaUltimoDespacho =
        fechaDespacho;

      if (!pedido.vendedor) {
        pedido.vendedor =
          getVendedorSesionLegible();
      }

      if (!pedido.clienteInfo) {
        const cliente =
          obtenerClienteParaPedido(
            pedido
          );

        if (cliente) {
          pedido.clienteInfo =
            cliente;
        }
      }

      if (
        articulosPendientes.length === 0
      ) {
        pedido.despachado = true;
        pedido.estado = "despachado";
        pedido.fechaDespacho =
          fechaDespacho;
      } else {
        pedido.despachado = false;
        pedido.estado =
          "despacho parcial";
      }

      guardarLS(
        "historialPedidos",
        historial
      );

      renderHistorial();

      Swal.fire({
        position: "center",
        icon: "success",

        title:
          articulosPendientes.length === 0
            ? "Pedido despachado"
            : "Despacho parcial realizado",

        html: `
          <div style="
            color:#4b5563;
            line-height:1.7;
          ">
            Se enviaron

            <strong style="
              color:#159638;
            ">
              ${articulosAprobados.length}
            </strong>

            ${
              articulosAprobados.length === 1
                ? "artículo aprobado"
                : "artículos aprobados"
            }.

            ${
              articulosPendientes.length > 0
                ? `
                  <br>

                  Quedan pendientes:

                  <strong style="
                    color:#e52424;
                  ">
                    ${articulosPendientes.length}
                  </strong>
                `
                : `
                  <br>
                  No quedan artículos pendientes.
                `
            }
          </div>
        `,

        confirmButtonColor:
          "#f26a21"
      });
    }

    window.despachar = function(index) {
      mostrarListaDespacho(index);
    };

    function mostrarModal(pedido, index) {
      if (
        !pedido.despachado ||
        (pedido.productos || []).length > 0
      ) {
        Swal.fire({
          position: "center",
          title: "Pedido pendiente",
          text: "Debes despachar todos los artículos antes de registrar la entrega.",
          icon: "warning",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      const modal =
        document.createElement("div");

      modal.className = "modal";

      modal.innerHTML = `
        <div class="modal-content">

          <div class="modal-icon">
            <i class="fa-solid fa-hand-holding-dollar"></i>
          </div>

          <h3>Registrar entrega</h3>

          <p>
            Selecciona cómo deseas registrar esta venta.
          </p>

          <div class="payment-buttons">

            <button
              type="button"
              class="contado"
            >
              <i class="fa-solid fa-money-bill-wave"></i>
              Al contado
            </button>

            <button
              type="button"
              class="credito"
            >
              <i class="fa-solid fa-credit-card"></i>
              A crédito
            </button>

          </div>

          <button
            type="button"
            class="cancelar"
          >
            Cancelar
          </button>

        </div>
      `;

      const clienteFinal =
        obtenerClienteParaPedido(
          pedido
        );

      const vendedor =
        getVendedorSesionLegible();

      const productosEntregados =
        Array.isArray(
          pedido.productosDespachados
        )
          ? pedido.productosDespachados
          : [];

      const totalEntregado =
        calcularTotalProductos(
          productosEntregados
        );

      modal
        .querySelector(
          ".cancelar"
        )
        .onclick = () => {
          modal.remove();
        };

      modal
        .querySelector(
          ".contado"
        )
        .onclick = () => {
          const venta = {
            ...pedido,

            productos:
              productosEntregados,

            total:
              totalEntregado,

            clienteInfo:
              clienteFinal,

            vendedor:
              pedido.vendedor ||
              vendedor,

            estado:
              "entregado",

            fechaEntrega:
              new Date().toLocaleString(
                "es-DO"
              )
          };

          ventasRealizadas.push(
            venta
          );

          historial.splice(
            index,
            1
          );

          guardarLS(
            "ventasRealizadas",
            ventasRealizadas
          );

          guardarLS(
            "historialPedidos",
            historial
          );

          modal.remove();
          renderHistorial();

          Swal.fire({
            position: "center",
            icon: "success",
            title: "Venta registrada",
            text: "La entrega fue registrada al contado.",
            confirmButtonColor: "#f26a21"
          });
        };

      modal
        .querySelector(
          ".credito"
        )
        .onclick = () => {
          const cuenta = {
            ...pedido,

            productos:
              productosEntregados,

            total:
              totalEntregado,

            clienteInfo:
              clienteFinal,

            vendedor:
              pedido.vendedor ||
              vendedor,

            estado:
              "pendiente",

            creadoEn:
              new Date().toISOString(),

            fechaEntrega:
              new Date().toLocaleString(
                "es-DO"
              )
          };

          cuentasPorCobrar.push(
            cuenta
          );

          historial.splice(
            index,
            1
          );

          guardarLS(
            "cuentasPorCobrar",
            cuentasPorCobrar
          );

          guardarLS(
            "historialPedidos",
            historial
          );

          modal.remove();
          renderHistorial();

          Swal.fire({
            position: "center",
            icon: "success",
            title: "Crédito registrado",
            text: "La cuenta por cobrar fue creada correctamente.",
            confirmButtonColor: "#f26a21"
          });
        };

      modal.addEventListener(
        "click",
        event => {
          if (
            event.target === modal
          ) {
            modal.remove();
          }
        }
      );

      document.body.appendChild(
        modal
      );
    }

    window.entregarPedido =
      function(index) {
        const pedido =
          historial[index];

        if (!pedido) return;

        if (!pedido.vendedor) {
          pedido.vendedor =
            getVendedorSesionLegible();
        }

        if (!pedido.clienteInfo) {
          pedido.clienteInfo =
            obtenerClienteParaPedido(
              pedido
            );
        }

        guardarLS(
          "historialPedidos",
          historial
        );

        mostrarModal(
          pedido,
          index
        );
      };

    function crearProductosHTML(
      productos,
      mostrarPendiente = true
    ) {
      if (
        !Array.isArray(productos) ||
        productos.length === 0
      ) {
        return `
          <p style="
            color:#737985;
            font-size:13px;
          ">
            No hay artículos pendientes.
          </p>
        `;
      }

      return productos.map(
        producto => {
          const cantidad =
            Number(
              producto.cantidad || 0
            );

          const precio =
            Number(
              producto.precio || 0
            );

          const subtotal =
            calcularSubtotalProducto(
              producto
            );

          return `
            <div class="producto">

              <div class="producto-image">

                <img
                  src="${escaparHTML(
                    producto.imagen ||
                    "https://via.placeholder.com/58?text=P"
                  )}"
                  alt="${escaparHTML(
                    producto.nombre ||
                    "Producto"
                  )}"
                  onerror="
                    this.onerror=null;
                    this.src='https://via.placeholder.com/58?text=P';
                  "
                >

              </div>

              <div class="producto-info">

                <p>
                  <strong>
                    ${escaparHTML(
                      producto.nombre ||
                      "Producto"
                    )}
                  </strong>
                </p>

                <p>
                  Cantidad:
                  ${cantidad.toLocaleString(
                    "es-DO"
                  )}
                </p>

                <p>
                  Precio:
                  $${formatearMoneda(
                    precio
                  )}
                </p>

                <p>
                  Subtotal:
                  $${formatearMoneda(
                    subtotal
                  )}
                </p>

              </div>

              ${
                mostrarPendiente
                  ? `
                    <span class="pending-label">
                      Pendiente
                    </span>
                  `
                  : ""
              }

            </div>
          `;
        }
      ).join("");
    }

    function crearDespachadosHTML(
      productos
    ) {
      if (
        !Array.isArray(productos) ||
        productos.length === 0
      ) {
        return "";
      }

      return `
        <div class="dispatched-section">

          <div class="dispatched-section-title">
            <i class="fa-solid fa-circle-check"></i>
            Artículos despachados
          </div>

          ${productos.map(
            producto => `
              <div class="dispatched-item">

                <strong>
                  ${escaparHTML(
                    producto.nombre ||
                    "Producto"
                  )}
                </strong>

                <span>
                  Cantidad:
                  ${Number(
                    producto.cantidad || 0
                  ).toLocaleString(
                    "es-DO"
                  )}
                </span>

              </div>
            `
          ).join("")}

        </div>
      `;
    }

    function renderHistorial() {
      historialContainer.innerHTML =
        "";

      ordersCount.textContent =
        historial.length === 1
          ? "1 pedido"
          : `${historial.length} pedidos`;

      if (
        historial.length === 0
      ) {
        historialContainer.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              <i class="fa-solid fa-box-open"></i>
            </div>

            <h3>No hay pedidos pendientes</h3>

            <p>
              Los nuevos pedidos aparecerán en esta sección.
            </p>

          </div>
        `;

        return;
      }

      historial.forEach(
        (pedido, index) => {
          const cliente =
            obtenerClienteParaPedido(
              pedido
            );

          const productosPendientes =
            Array.isArray(
              pedido.productos
            )
              ? pedido.productos
              : [];

          const productosDespachados =
            Array.isArray(
              pedido.productosDespachados
            )
              ? pedido.productosDespachados
              : [];

          const totalmenteDespachado =
            pedido.despachado === true &&
            productosPendientes.length === 0;

          const parcialmenteDespachado =
            !totalmenteDespachado &&
            productosDespachados.length > 0;

          let claseEstado =
            "pendiente";

          let textoEstado =
            "Pendiente";

          if (totalmenteDespachado) {
            claseEstado =
              "despachado";

            textoEstado =
              "Despachado";
          } else if (
            parcialmenteDespachado
          ) {
            claseEstado =
              "parcial";

            textoEstado =
              "Parcial";
          }

          const totalMostrado =
            productosPendientes.length > 0
              ? calcularTotalProductos(
                  productosPendientes
                )
              : calcularTotalProductos(
                  productosDespachados
                );

          const tarjeta =
            document.createElement(
              "article"
            );

          tarjeta.className =
            "venta";

          tarjeta.innerHTML = `
            <div class="venta-header">

              <div class="venta-heading">

                <div class="venta-icon">
                  <i class="fa-solid fa-box"></i>
                </div>

                <div class="venta-heading-text">

                  <strong>
                    ${escaparHTML(
                      cliente?.negocio ||
                      "Pedido pendiente"
                    )}
                  </strong>

                  <span>
                    ${escaparHTML(
                      pedido.fecha ||
                      "Sin fecha"
                    )}
                  </span>

                </div>

              </div>

              <span class="status-badge ${claseEstado}">
                ${textoEstado}
              </span>

            </div>

            <div class="cliente-info">

              <p>
                <i class="fa-solid fa-store"></i>

                <span>
                  <strong>Negocio:</strong>

                  ${escaparHTML(
                    cliente?.negocio ||
                    "No seleccionado"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-phone"></i>

                <span>
                  <strong>Teléfono:</strong>

                  ${escaparHTML(
                    cliente?.telefono ||
                    "-"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-location-dot"></i>

                <span>
                  <strong>Dirección:</strong>

                  ${escaparHTML(
                    cliente?.direccion ||
                    "-"
                  )}
                </span>
              </p>

            </div>

            <div class="products-title">
              ${
                productosPendientes.length > 0
                  ? "Artículos pendientes"
                  : "Pedido preparado"
              }
            </div>

            ${crearProductosHTML(
              productosPendientes,
              true
            )}

            ${crearDespachadosHTML(
              productosDespachados
            )}

            <div class="order-summary">

              <div class="total">

                <span>
                  ${
                    productosPendientes.length > 0
                      ? "Total pendiente"
                      : "Total despachado"
                  }
                </span>

                <strong>
                  $${formatearMoneda(
                    totalMostrado
                  )}
                </strong>

              </div>

              <span class="seller-pill">
                <i class="fa-solid fa-user"></i>

                ${escaparHTML(
                  pedido.vendedor ||
                  getVendedorSesionLegible()
                )}
              </span>

            </div>

            <div class="order-actions">

              <button
                type="button"
                class="btn dispatch-btn"
                onclick="despachar(${index})"
                ${
                  totalmenteDespachado
                    ? "disabled"
                    : ""
                }
              >
                <i class="${
                  totalmenteDespachado
                    ? "fa-solid fa-circle-check"
                    : "fa-solid fa-boxes-packing"
                }"></i>

                ${
                  totalmenteDespachado
                    ? "Despachado"
                    : parcialmenteDespachado
                      ? "Despachar restantes"
                      : "Despachar"
                }
              </button>

              <button
                type="button"
                class="btn deliver-btn ${
                  totalmenteDespachado
                    ? ""
                    : "hidden"
                }"
                onclick="entregarPedido(${index})"
              >
                <i class="fa-solid fa-truck-fast"></i>
                Entregar
              </button>

            </div>
          `;

          historialContainer.appendChild(
            tarjeta
          );
        }
      );
    }

    function recargarPedidos() {
      historial =
        cargarArregloLocalStorage(
          "historialPedidos"
        );

      ventasRealizadas =
        cargarArregloLocalStorage(
          "ventasRealizadas"
        );

      cuentasPorCobrar =
        cargarArregloLocalStorage(
          "cuentasPorCobrar"
        );

      renderHistorial();

      Swal.fire({
        position: "center",
        icon: "success",
        title: "Pedidos actualizados",
        showConfirmButton: false,
        timer: 1200
      });
    }

    window.addEventListener(
      "storage",
      evento => {
        if (
          evento.key ===
          "historialPedidos"
        ) {
          historial =
            cargarArregloLocalStorage(
              "historialPedidos"
            );

          renderHistorial();
        }

        if (
          evento.key ===
          "ventasRealizadas"
        ) {
          ventasRealizadas =
            cargarArregloLocalStorage(
              "ventasRealizadas"
            );
        }

        if (
          evento.key ===
          "cuentasPorCobrar"
        ) {
          cuentasPorCobrar =
            cargarArregloLocalStorage(
              "cuentasPorCobrar"
            );
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          historial =
            cargarArregloLocalStorage(
              "historialPedidos"
            );

          ventasRealizadas =
            cargarArregloLocalStorage(
              "ventasRealizadas"
            );

          cuentasPorCobrar =
            cargarArregloLocalStorage(
              "cuentasPorCobrar"
            );

          renderHistorial();
        }
      }
    );

    renderHistorial();
  </script>

</body>
</html>
