<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pedidos</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --yellow: #b77900;
      --yellow-light: #fff4cc;
      --red: #e52424;
      --red-light: #ffeaea;
      --gray-light: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
      padding-bottom: 40px;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a,
    input {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    img {
      max-width: 100%;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-title span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.refresh {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    /* CONTENIDO */

    .container {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 22px 16px;
    }

    .page-heading {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .page-heading h1 {
      color: #111;
      font-size: 23px;
    }

    .orders-count {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #historialContainer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    /* TARJETA DEL PEDIDO */

    .venta {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid #ededed;
      border-radius: 21px;
      background: #fff;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .venta:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 30px rgba(0, 0, 0, 0.11);
    }

    .venta-header {
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .venta-heading {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .venta-icon {
      width: 49px;
      height: 49px;
      border-radius: 16px;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .venta-heading-text {
      min-width: 0;
    }

    .venta-heading-text strong {
      display: block;
      color: #111;
      font-size: 16px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .venta-heading-text span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-badge {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-badge.pendiente {
      background: var(--yellow-light);
      color: var(--yellow);
    }

    .status-badge.parcial {
      background: var(--orange-light);
      color: var(--orange);
    }

    .status-badge.despachado {
      background: var(--blue-light);
      color: var(--blue);
    }

    /* CLIENTE */

    .cliente-info {
      margin-bottom: 15px;
      padding: 14px;
      border: 1px solid #e8ecef;
      border-radius: 16px;
      background: #f8fafb;
      display: grid;
      gap: 9px;
    }

    .cliente-info p {
      margin: 0;
      color: #4b5563;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .cliente-info p i {
      width: 17px;
      margin-top: 2px;
      color: var(--orange);
      text-align: center;
      flex-shrink: 0;
    }

    .cliente-info strong {
      color: #111;
    }

    /* PRODUCTOS */

    .products-title {
      margin-bottom: 9px;
      color: #111;
      font-size: 13px;
      font-weight: 800;
    }

    .producto {
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .producto:last-child {
      border-bottom: none;
    }

    .producto-image {
      width: 58px;
      height: 58px;
      padding: 4px;
      border-radius: 14px;
      background: #f2f3f5;
      overflow: hidden;
      flex-shrink: 0;
    }

    .producto img {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      object-fit: cover;
      display: block;
    }

    .producto-info {
      min-width: 0;
      flex: 1;
    }

    .producto-info p {
      margin: 3px 0;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .producto-info p strong {
      color: #111;
      font-size: 14px;
    }

    .pending-label {
      margin-left: auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--yellow-light);
      color: var(--yellow);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* PRODUCTOS DESPACHADOS */

    .dispatched-section {
      margin-top: 15px;
      padding: 13px;
      border: 1px solid #cde9d2;
      border-radius: 16px;
      background: var(--green-light);
    }

    .dispatched-section-title {
      margin-bottom: 9px;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .dispatched-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(21, 150, 56, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #315c39;
      font-size: 12px;
    }

    .dispatched-item:last-child {
      border-bottom: none;
    }

    .dispatched-item strong {
      color: #174c25;
      overflow-wrap: anywhere;
    }

    /* RESUMEN */

    .order-summary {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .total {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .total span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .total strong {
      color: var(--orange);
      font-size: 20px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .seller-pill {
      max-width: 55%;
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--gray-light);
      color: #4b5563;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BOTONES */

    .order-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      min-height: 47px;
      padding: 10px 14px;
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .dispatch-btn {
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      box-shadow: 0 5px 15px rgba(242, 106, 33, 0.24);
    }

    .dispatch-btn:disabled {
      background: #a5a9b0;
      color: #fff;
      box-shadow: none;
    }

    .deliver-btn {
      background: var(--green-light);
      color: var(--green);
    }

    .deliver-btn.hidden {
      display: none;
    }

    /* SIN PEDIDOS */

    .empty-state {
      grid-column: 1 / -1;
      min-height: 360px;
      padding: 40px 20px;
      border: 1px solid #ededed;
      border-radius: 22px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .empty-icon {
      width: 125px;
      height: 125px;
      margin-bottom: 18px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .empty-state h3 {
      margin-bottom: 7px;
      color: #111;
      font-size: 20px;
    }

    .empty-state p {
      max-width: 330px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* MODAL DE ENTREGA */

    .delivery-modal {
      position: fixed;
      inset: 0;
      z-index: 2500;
      padding: 20px;
      background: rgba(0, 0, 0, 0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .delivery-content {
      width: min(430px, 100%);
      padding: 22px;
      border-radius: 22px;
      background: #fff;
      text-align: center;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
    }

    .delivery-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 21px;
      background: var(--orange-light);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .delivery-content h3 {
      margin-bottom: 8px;
      color: #111;
      font-size: 21px;
    }

    .delivery-content > p {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .payment-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .payment-button,
    .cancel-button {
      min-height: 50px;
      padding: 10px 16px;
      border: none;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .payment-button.cash {
      background: var(--green-light);
      color: var(--green);
    }

    .payment-button.credit {
      background: var(--yellow-light);
      color: var(--yellow);
    }

    .cancel-button {
      width: 100%;
      margin-top: 10px;
      background: var(--gray-light);
      color: #4b5563;
    }

    /* LISTA DE DESPACHO */

    .dispatch-list {
      max-height: 390px;
      margin-top: 10px;
      padding-right: 2px;
      overflow-y: auto;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .dispatch-item {
      position: relative;
      padding: 12px;
      border: 1px solid #e6e8eb;
      border-radius: 15px;
      background: #f8f9fa;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 34px;
      gap: 11px;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
    }

    .dispatch-item.approved {
      border-color: #a9dfb4;
      background: var(--green-light);
    }

    .dispatch-image {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      background: #eceef0;
    }

    .dispatch-details {
      min-width: 0;
    }

    .dispatch-details strong {
      display: block;
      margin-bottom: 4px;
      color: #111;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .dispatch-details > span {
      color: var(--muted);
      font-size: 11px;
    }

    .dispatch-check {
      position: relative;
      width: 32px;
      height: 32px;
      display: block;
    }

    .dispatch-check input {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 32px;
      height: 32px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .custom-check {
      position: absolute;
      inset: 0;
      width: 32px;
      height: 32px;
      border: 2px solid #c8ccd2;
      border-radius: 9px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 14px;
      pointer-events: none;
      transition: all 0.2s;
    }

    .dispatch-check input:checked + .custom-check {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .dispatch-progress {
      margin-bottom: 11px;
      padding: 11px 13px;
      border-radius: 13px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .dispatch-quantity-box {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dispatch-quantity-box span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .dispatch-quantity-input {
      width: 78px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid #d9dce1;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }

    .dispatch-quantity-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(242, 106, 33, 0.12);
    }

    .dispatch-quantity-input:disabled {
      background: #eceef1;
      color: #9ca1a9;
    }

    /* RESPONSIVE */

    @media (max-width: 820px) {
      #historialContainer {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        padding-top: 70px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
        grid-template-columns: 45px minmax(0, 1fr) 45px;
        gap: 8px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        border-radius: 14px;
        font-size: 19px;
      }

      .header-title {
        gap: 8px;
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      .container {
        padding: 17px 10px;
      }

      .page-heading h1 {
        font-size: 20px;
      }

      .venta {
        padding: 15px;
      }

      .venta-icon {
        width: 45px;
        height: 45px;
        font-size: 19px;
      }

      .cliente-info {
        padding: 12px;
      }

      .producto-image {
        width: 53px;
        height: 53px;
      }

      .order-summary {
        align-items: flex-start;
        flex-direction: column;
      }

      .seller-pill {
        max-width: 100%;
      }
    }

    @media (max-width: 390px) {
      .header-title span {
        font-size: 16px;
      }

      .page-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .orders-count {
        max-width: 100%;
      }

      .order-actions,
      .payment-buttons {
        grid-template-columns: 1fr;
      }

      .dispatch-item {
        grid-template-columns: 44px minmax(0, 1fr) 32px;
        padding: 10px;
        gap: 8px;
      }

      .dispatch-image {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="window.history.back()"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-box"></i>
      <span>Pedidos</span>
    </div>

    <button
      type="button"
      class="header-button refresh"
      onclick="recargarPedidos()"
      aria-label="Actualizar pedidos"
      title="Actualizar"
    >
      <i class="fa-solid fa-rotate"></i>
    </button>

  </header>

  <main class="container">

    <div class="page-heading">

      <h1>Pedidos registrados</h1>

      <span
        class="orders-count"
        id="ordersCount"
      >
        0 pedidos
      </span>

    </div>

    <div id="historialContainer"></div>

  </main>

  <script>
    const historialContainer =
      document.getElementById("historialContainer");

    const ordersCount =
      document.getElementById("ordersCount");

    let historial = [];
    let ventasRealizadas = [];
    let cuentasPorCobrar = [];
    let procesandoEntrega = false;

    function cargarArregloLocalStorage(key) {
      try {
        const datos = JSON.parse(
          localStorage.getItem(key) || "[]"
        );

        return Array.isArray(datos)
          ? datos
          : [];
      } catch (error) {
        console.warn(
          `No se pudo leer ${key}:`,
          error
        );

        return [];
      }
    }

    function recargarDatos() {
      historial =
        cargarArregloLocalStorage(
          "historialPedidos"
        );

      ventasRealizadas =
        cargarArregloLocalStorage(
          "ventasRealizadas"
        );

      cuentasPorCobrar =
        cargarArregloLocalStorage(
          "cuentasPorCobrar"
        );
    }

    function guardarLS(key, datos) {
      localStorage.setItem(
        key,
        JSON.stringify(datos)
      );
    }

    function escaparHTML(valor) {
      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatearMoneda(valor) {
      return Number(valor || 0).toLocaleString(
        "es-DO",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );
    }

    function generarId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        return window.crypto.randomUUID();
      }

      return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
      );
    }

    function clonarObjeto(valor) {
      try {
        return JSON.parse(
          JSON.stringify(valor)
        );
      } catch (error) {
        return valor;
      }
    }

    function obtenerCantidadProducto(producto) {
      return Math.max(
        0,
        Number(
          producto?.cantidad ??
          producto?.quantity ??
          0
        )
      );
    }

    function obtenerPrecioProducto(producto) {
      return Math.max(
        0,
        Number(
          producto?.precio ??
          producto?.price ??
          0
        )
      );
    }

    function obtenerNombreProducto(producto) {
      return String(
        producto?.nombre ??
        producto?.name ??
        "Producto"
      );
    }

    function obtenerImagenProducto(producto) {
      return String(
        producto?.imagen ??
        producto?.image ??
        ""
      );
    }

    function calcularSubtotalProducto(producto) {
      const cantidad =
        obtenerCantidadProducto(producto);

      const precio =
        obtenerPrecioProducto(producto);

      if (
        producto?.subtotal != null &&
        Number.isFinite(
          Number(producto.subtotal)
        )
      ) {
        return Number(producto.subtotal);
      }

      return precio * cantidad;
    }

    function calcularTotalProductos(productos) {
      return (
        Array.isArray(productos)
          ? productos
          : []
      ).reduce(
        (total, producto) =>
          total +
          calcularSubtotalProducto(producto),
        0
      );
    }

    function crearParteProducto(
      producto,
      cantidad
    ) {
      const cantidadOriginal =
        obtenerCantidadProducto(producto);

      const cantidadParte =
        Math.max(
          0,
          Math.min(
            Number(cantidad || 0),
            cantidadOriginal
          )
        );

      const precio =
        obtenerPrecioProducto(producto);

      const copia =
        clonarObjeto(producto);

      return {
        ...copia,

        cantidad:
          cantidadParte,

        quantity:
          cantidadParte,

        precio,

        price:
          precio,

        subtotal:
          precio * cantidadParte
      };
    }

    function getVendedorSesionLegible() {
      try {
        const usuario = JSON.parse(
          localStorage.getItem(
            "usuarioSesion"
          ) || "null"
        );

        if (usuario?.nombre) {
          return String(usuario.nombre);
        }

        if (usuario?.usuario) {
          return String(usuario.usuario);
        }
      } catch (error) {}

      try {
        const usuario = JSON.parse(
          localStorage.getItem(
            "currentUser"
          ) || "null"
        );

        if (usuario?.name) {
          return String(usuario.name);
        }

        if (usuario?.username) {
          return String(usuario.username);
        }

        if (usuario?.role) {
          return String(usuario.role);
        }
      } catch (error) {}

      return (
        localStorage.getItem("nombreUsuario") ||
        localStorage.getItem("rol") ||
        "No definido"
      );
    }

    function normalizarCliente(cliente) {
      if (
        !cliente ||
        typeof cliente !== "object"
      ) {
        return null;
      }

      return {
        ...cliente,

        nombre:
          cliente.nombre || "",

        apellido:
          cliente.apellido || "",

        negocio:
          cliente.negocio ||
          cliente.nombreNegocio ||
          "",

        direccion:
          cliente.direccion ||
          cliente.dirección ||
          "",

        telefono:
          cliente.telefono ||
          cliente.tel ||
          "",

        correo:
          cliente.correo ||
          cliente.email ||
          ""
      };
    }

    function obtenerClienteParaPedido(pedido) {
      if (pedido?.clienteInfo) {
        return normalizarCliente(
          pedido.clienteInfo
        );
      }

      if (
        pedido?.cliente &&
        typeof pedido.cliente === "object"
      ) {
        return normalizarCliente(
          pedido.cliente
        );
      }

      if (
        pedido?.clienteSeleccionado &&
        typeof pedido.clienteSeleccionado ===
          "object"
      ) {
        return normalizarCliente(
          pedido.clienteSeleccionado
        );
      }

      const clienteGlobal = (() => {
        try {
          return JSON.parse(
            localStorage.getItem(
              "clienteSeleccionado"
            ) || "null"
          );
        } catch (error) {
          return null;
        }
      })();

      if (clienteGlobal) {
        return normalizarCliente(
          clienteGlobal
        );
      }

      const negocio =
        pedido?.negocio ||
        pedido?.nombreNegocio ||
        (
          typeof pedido?.cliente === "string"
            ? pedido.cliente
            : ""
        );

      const direccion =
        pedido?.direccion ||
        pedido?.dirección ||
        "";

      const telefono =
        pedido?.telefono ||
        pedido?.tel ||
        "";

      const correo =
        pedido?.correo ||
        pedido?.email ||
        "";

      if (
        negocio ||
        direccion ||
        telefono ||
        correo
      ) {
        return normalizarCliente({
          negocio,
          direccion,
          telefono,
          correo
        });
      }

      return null;
    }

    function migrarPedidosAntiguos() {
      let huboCambios = false;

      historial.forEach(pedido => {
        if (!pedido.id) {
          pedido.id = generarId();
          huboCambios = true;
        }

        if (!Array.isArray(pedido.productos)) {
          pedido.productos = [];
          huboCambios = true;
        }

        if (
          !Array.isArray(
            pedido.productosDespachados
          )
        ) {
          pedido.productosDespachados = [];
          huboCambios = true;
        }

        if (
          !Array.isArray(
            pedido.despachosParciales
          )
        ) {
          pedido.despachosParciales = [];
          huboCambios = true;
        }

        if (pedido.totalOriginal == null) {
          pedido.totalOriginal =
            Number(pedido.total || 0) ||
            calcularTotalProductos(
              pedido.productos
            );

          huboCambios = true;
        }

        if (
          pedido.despachado === true &&
          pedido.productos.length > 0 &&
          pedido.productosDespachados.length === 0
        ) {
          pedido.productosDespachados =
            clonarObjeto(pedido.productos);

          pedido.productos = [];
          pedido.totalPendiente = 0;
          pedido.estado = "despachado";

          huboCambios = true;
        }

        if (!pedido.clienteInfo) {
          const cliente =
            obtenerClienteParaPedido(pedido);

          if (cliente) {
            pedido.clienteInfo = cliente;
            huboCambios = true;
          }
        }

        if (!pedido.vendedor) {
          pedido.vendedor =
            getVendedorSesionLegible();

          huboCambios = true;
        }

        pedido.totalPendiente =
          calcularTotalProductos(
            pedido.productos
          );
      });

      if (huboCambios) {
        guardarLS(
          "historialPedidos",
          historial
        );
      }
    }

    /* SELECCIONAR ARTÍCULOS */

    function mostrarListaDespacho(index) {
      const pedido = historial[index];

      if (!pedido) {
        return;
      }

      const productos =
        Array.isArray(pedido.productos)
          ? pedido.productos
          : [];

      if (productos.length === 0) {
        Swal.fire({
          position: "center",
          icon: "info",
          title: "Sin artículos pendientes",
          text: "Este pedido no tiene artículos pendientes para despachar.",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      const listaHTML = productos.map(
        (producto, productoIndex) => {
          const cantidad =
            obtenerCantidadProducto(producto);

          return `
            <div
              class="dispatch-item"
              id="dispatchItem-${productoIndex}"
              data-index="${productoIndex}"
            >

              <img
                class="dispatch-image"
                src="${escaparHTML(
                  obtenerImagenProducto(producto) ||
                  "https://via.placeholder.com/48?text=P"
                )}"
                alt="${escaparHTML(
                  obtenerNombreProducto(producto)
                )}"
                onerror="
                  this.onerror=null;
                  this.src='https://via.placeholder.com/48?text=P';
                "
              >

              <div class="dispatch-details">

                <strong>
                  ${escaparHTML(
                    obtenerNombreProducto(producto)
                  )}
                </strong>

                <span>
                  Disponible:
                  ${cantidad.toLocaleString("es-DO")}
                </span>

                <div class="dispatch-quantity-box">

                  <span>Cantidad:</span>

                  <input
                    type="number"
                    class="dispatch-quantity-input"
                    id="dispatchQuantity-${productoIndex}"
                    min="1"
                    max="${cantidad}"
                    step="1"
                    value="${cantidad}"
                    disabled
                  >

                </div>

              </div>

              <span class="dispatch-check">

                <input
                  type="checkbox"
                  class="dispatch-checkbox"
                  id="dispatchCheckbox-${productoIndex}"
                  data-index="${productoIndex}"
                >

                <span class="custom-check">
                  <i class="fa-solid fa-check"></i>
                </span>

              </span>

            </div>
          `;
        }
      ).join("");

      Swal.fire({
        position: "center",

        title: "Seleccionar artículos",

        html: `
          <div
            class="dispatch-progress"
            id="dispatchProgress"
          >
            0 artículos seleccionados
          </div>

          <div class="dispatch-list">
            ${listaHTML}
          </div>
        `,

        width: 540,

        showCancelButton: true,

        confirmButtonText:
          "Enviar aprobados",

        cancelButtonText:
          "Cancelar",

        confirmButtonColor:
          "#f26a21",

        cancelButtonColor:
          "#737985",

        focusConfirm: false,

        didOpen: popup => {
          const tarjetas =
            popup.querySelectorAll(
              ".dispatch-item"
            );

          const checkboxes =
            popup.querySelectorAll(
              ".dispatch-checkbox"
            );

          const cantidades =
            popup.querySelectorAll(
              ".dispatch-quantity-input"
            );

          function actualizarEstado() {
            let seleccionados = 0;
            let unidades = 0;

            checkboxes.forEach(checkbox => {
              const indice = Number(
                checkbox.dataset.index
              );

              const tarjeta =
                popup.querySelector(
                  `#dispatchItem-${indice}`
                );

              const inputCantidad =
                popup.querySelector(
                  `#dispatchQuantity-${indice}`
                );

              tarjeta?.classList.toggle(
                "approved",
                checkbox.checked
              );

              if (inputCantidad) {
                inputCantidad.disabled =
                  !checkbox.checked;
              }

              if (checkbox.checked) {
                seleccionados++;

                unidades += Number(
                  inputCantidad?.value || 0
                );
              }
            });

            const progreso =
              popup.querySelector(
                "#dispatchProgress"
              );

            if (progreso) {
              progreso.textContent =
                `${seleccionados} artículos seleccionados · ${unidades} unidades`;
            }
          }

          tarjetas.forEach(tarjeta => {
            tarjeta.addEventListener(
              "click",
              event => {
                if (
                  event.target.closest(
                    ".dispatch-quantity-input"
                  ) ||
                  event.target.closest(
                    ".dispatch-check"
                  )
                ) {
                  return;
                }

                const indice = Number(
                  tarjeta.dataset.index
                );

                const checkbox =
                  popup.querySelector(
                    `#dispatchCheckbox-${indice}`
                  );

                if (!checkbox) {
                  return;
                }

                checkbox.checked =
                  !checkbox.checked;

                checkbox.dispatchEvent(
                  new Event("change", {
                    bubbles: true
                  })
                );
              }
            );
          });

          checkboxes.forEach(checkbox => {
            checkbox.addEventListener(
              "change",
              actualizarEstado
            );
          });

          cantidades.forEach(input => {
            input.addEventListener(
              "click",
              event => {
                event.stopPropagation();
              }
            );

            input.addEventListener(
              "input",
              () => {
                const maximo =
                  Number(input.max || 0);

                let valor =
                  Number(input.value || 0);

                if (valor < 1) {
                  valor = 1;
                }

                if (valor > maximo) {
                  valor = maximo;
                }

                input.value = valor;

                actualizarEstado();
              }
            );
          });

          actualizarEstado();
        },

        preConfirm: () => {
          const popup = Swal.getPopup();

          const seleccionados = [];

          popup
            .querySelectorAll(
              ".dispatch-checkbox"
            )
            .forEach(checkbox => {
              if (!checkbox.checked) {
                return;
              }

              const indice = Number(
                checkbox.dataset.index
              );

              const producto =
                productos[indice];

              const cantidad = Number(
                popup.querySelector(
                  `#dispatchQuantity-${indice}`
                )?.value || 0
              );

              const maximo =
                obtenerCantidadProducto(
                  producto
                );

              seleccionados.push({
                indice,
                cantidad,
                maximo
              });
            });

          if (seleccionados.length === 0) {
            Swal.showValidationMessage(
              "Debes seleccionar al menos un artículo."
            );

            return false;
          }

          const invalido =
            seleccionados.find(item =>
              !Number.isInteger(item.cantidad) ||
              item.cantidad < 1 ||
              item.cantidad > item.maximo
            );

          if (invalido) {
            Swal.showValidationMessage(
              "Revisa las cantidades seleccionadas."
            );

            return false;
          }

          return seleccionados;
        }
      }).then(resultado => {
        if (!resultado.isConfirmed) {
          return;
        }

        confirmarDespachoParcial(
          index,
          resultado.value
        );
      });
    }

    function confirmarDespachoParcial(
      index,
      selecciones
    ) {
      const pedido = historial[index];

      if (
        !pedido ||
        !Array.isArray(selecciones) ||
        selecciones.length === 0
      ) {
        return;
      }

      const productosOriginales =
        Array.isArray(pedido.productos)
          ? pedido.productos
          : [];

      const mapaSelecciones =
        new Map();

      selecciones.forEach(seleccion => {
        const indice =
          Number(seleccion.indice);

        const cantidad =
          Number(seleccion.cantidad);

        if (
          Number.isInteger(indice) &&
          indice >= 0 &&
          indice < productosOriginales.length &&
          Number.isInteger(cantidad) &&
          cantidad > 0 &&
          cantidad <=
            obtenerCantidadProducto(
              productosOriginales[indice]
            )
        ) {
          mapaSelecciones.set(
            indice,
            cantidad
          );
        }
      });

      if (mapaSelecciones.size === 0) {
        return;
      }

      const aprobados = [];
      const pendientes = [];

      productosOriginales.forEach(
        (producto, indice) => {
          const cantidadOriginal =
            obtenerCantidadProducto(producto);

          const cantidadDespachar =
            mapaSelecciones.get(indice) || 0;

          if (cantidadDespachar > 0) {
            aprobados.push(
              crearParteProducto(
                producto,
                cantidadDespachar
              )
            );
          }

          const cantidadPendiente =
            cantidadOriginal -
            cantidadDespachar;

          if (cantidadPendiente > 0) {
            pendientes.push(
              crearParteProducto(
                producto,
                cantidadPendiente
              )
            );
          }
        }
      );

      if (aprobados.length === 0) {
        return;
      }

      const fechaDespacho =
        new Date().toLocaleString(
          "es-DO"
        );

      if (
        !Array.isArray(
          pedido.despachosParciales
        )
      ) {
        pedido.despachosParciales = [];
      }

      if (
        !Array.isArray(
          pedido.productosDespachados
        )
      ) {
        pedido.productosDespachados = [];
      }

      pedido.despachosParciales.push({
        id: generarId(),

        fecha:
          fechaDespacho,

        productos:
          clonarObjeto(aprobados),

        total:
          calcularTotalProductos(
            aprobados
          ),

        vendedor:
          pedido.vendedor ||
          getVendedorSesionLegible()
      });

      pedido.productosDespachados.push(
        ...clonarObjeto(aprobados)
      );

      pedido.productos =
        pendientes;

      pedido.totalPendiente =
        calcularTotalProductos(
          pendientes
        );

      pedido.fechaUltimoDespacho =
        fechaDespacho;

      pedido.vendedor =
        pedido.vendedor ||
        getVendedorSesionLegible();

      if (!pedido.clienteInfo) {
        pedido.clienteInfo =
          obtenerClienteParaPedido(
            pedido
          );
      }

      if (pendientes.length === 0) {
        pedido.despachado = true;
        pedido.estado = "despachado";
        pedido.fechaDespacho =
          fechaDespacho;
      } else {
        pedido.despachado = false;
        pedido.estado =
          "despacho parcial";
      }

      guardarLS(
        "historialPedidos",
        historial
      );

      renderHistorial();

      const unidadesEnviadas =
        aprobados.reduce(
          (total, producto) =>
            total +
            obtenerCantidadProducto(
              producto
            ),
          0
        );

      const unidadesPendientes =
        pendientes.reduce(
          (total, producto) =>
            total +
            obtenerCantidadProducto(
              producto
            ),
          0
        );

      Swal.fire({
        position: "center",

        icon: "success",

        title:
          pendientes.length === 0
            ? "Pedido despachado"
            : "Despacho parcial realizado",

        html: `
          <div style="
            color:#4b5563;
            line-height:1.7;
          ">
            Se enviaron
            <strong style="color:#159638">
              ${unidadesEnviadas}
            </strong>
            unidades.

            ${
              unidadesPendientes > 0
                ? `
                  <br>
                  Quedan pendientes:
                  <strong style="color:#e52424">
                    ${unidadesPendientes}
                  </strong>
                `
                : `
                  <br>
                  No quedan artículos pendientes.
                `
            }
          </div>
        `,

        confirmButtonColor:
          "#f26a21"
      });
    }

    window.despachar = function(index) {
      mostrarListaDespacho(index);
    };

    /* ENTREGAR PEDIDO */

    function cerrarModalEntrega() {
      const modal =
        document.getElementById(
          "deliveryModal"
        );

      if (
        modal &&
        !procesandoEntrega
      ) {
        modal.remove();
      }
    }

    function mostrarModalEntrega(
      pedido,
      index
    ) {
      const pendientes =
        Array.isArray(pedido.productos)
          ? pedido.productos
          : [];

      if (
        pedido.despachado !== true ||
        pendientes.length > 0
      ) {
        Swal.fire({
          position: "center",
          icon: "warning",
          title: "Pedido pendiente",
          text: "Debes despachar todos los artículos antes de registrar la entrega.",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      const productosEntregados =
        Array.isArray(
          pedido.productosDespachados
        )
          ? clonarObjeto(
              pedido.productosDespachados
            )
          : [];

      if (
        productosEntregados.length === 0
      ) {
        Swal.fire({
          position: "center",
          icon: "warning",
          title: "Entrega sin productos",
          text: "No se encontraron artículos despachados.",
          confirmButtonColor: "#f26a21"
        });

        return;
      }

      document
        .getElementById(
          "deliveryModal"
        )
        ?.remove();

      procesandoEntrega = false;

      const modal =
        document.createElement("div");

      modal.id = "deliveryModal";
      modal.className = "delivery-modal";

      modal.innerHTML = `
        <div class="delivery-content">

          <div class="delivery-icon">
            <i class="fa-solid fa-hand-holding-dollar"></i>
          </div>

          <h3>Registrar entrega</h3>

          <p>
            Selecciona cómo pagará el cliente.
          </p>

          <div class="payment-buttons">

            <button
              type="button"
              class="payment-button cash"
              id="paymentCashButton"
            >
              <i class="fa-solid fa-money-bill-wave"></i>
              Al contado
            </button>

            <button
              type="button"
              class="payment-button credit"
              id="paymentCreditButton"
            >
              <i class="fa-solid fa-credit-card"></i>
              A crédito
            </button>

          </div>

          <button
            type="button"
            class="cancel-button"
            id="cancelDeliveryButton"
          >
            Cancelar
          </button>

        </div>
      `;

      document.body.appendChild(modal);

      const cliente =
        obtenerClienteParaPedido(
          pedido
        );

      const vendedor =
        pedido.vendedor ||
        getVendedorSesionLegible();

      const totalPedido =
        Number(
          pedido.totalOriginal ??
          pedido.total
        ) ||
        calcularTotalProductos(
          productosEntregados
        );

      function bloquearBotones() {
        procesandoEntrega = true;

        modal
          .querySelectorAll("button")
          .forEach(boton => {
            boton.disabled = true;
          });
      }

      function terminarEntrega(
        tipoPago
      ) {
        if (procesandoEntrega) {
          return;
        }

        bloquearBotones();

        const fechaEntrega =
          new Date().toLocaleString(
            "es-DO"
          );

        if (tipoPago === "contado") {
          const venta = {
            id: generarId(),

            pedidoId:
              pedido.id || "",

            fecha:
              pedido.fecha ||
              fechaEntrega,

            fechaEntrega,

            productos:
              productosEntregados,

            total:
              totalPedido,

            clienteInfo:
              cliente,

            vendedor,

            estado:
              "entregado",

            tipoPago:
              "contado"
          };

          ventasRealizadas.push(
            venta
          );

          guardarLS(
            "ventasRealizadas",
            ventasRealizadas
          );
        } else {
          const cuenta = {
            id: generarId(),

            pedidoId:
              pedido.id || "",

            fecha:
              pedido.fecha ||
              fechaEntrega,

            fechaEntrega,

            creadoEn:
              new Date().toISOString(),

            productos:
              productosEntregados,

            total:
              totalPedido,

            totalOriginal:
              totalPedido,

            saldoPendiente:
              totalPedido,

            abonos: [],

            clienteInfo:
              cliente,

            vendedor,

            estado:
              "pendiente",

            tipoPago:
              "credito"
          };

          cuentasPorCobrar.push(
            cuenta
          );

          guardarLS(
            "cuentasPorCobrar",
            cuentasPorCobrar
          );
        }

        historial.splice(
          index,
          1
        );

        guardarLS(
          "historialPedidos",
          historial
        );

        modal.remove();

        procesandoEntrega = false;

        renderHistorial();

        Swal.fire({
          position: "center",

          icon: "success",

          title:
            tipoPago === "contado"
              ? "Venta registrada"
              : "Crédito registrado",

          text:
            tipoPago === "contado"
              ? "La entrega fue registrada al contado."
              : "La cuenta por cobrar fue creada correctamente.",

          confirmButtonColor:
            "#f26a21"
        });
      }

      document
        .getElementById(
          "paymentCashButton"
        )
        .addEventListener(
          "click",
          () => {
            terminarEntrega(
              "contado"
            );
          }
        );

      document
        .getElementById(
          "paymentCreditButton"
        )
        .addEventListener(
          "click",
          () => {
            terminarEntrega(
              "credito"
            );
          }
        );

      document
        .getElementById(
          "cancelDeliveryButton"
        )
        .addEventListener(
          "click",
          cerrarModalEntrega
        );

      modal.addEventListener(
        "click",
        event => {
          if (
            event.target === modal
          ) {
            cerrarModalEntrega();
          }
        }
      );
    }

    window.entregarPedido =
      function(index) {
        const pedido =
          historial[index];

        if (!pedido) {
          return;
        }

        pedido.vendedor =
          pedido.vendedor ||
          getVendedorSesionLegible();

        if (!pedido.clienteInfo) {
          pedido.clienteInfo =
            obtenerClienteParaPedido(
              pedido
            );
        }

        guardarLS(
          "historialPedidos",
          historial
        );

        mostrarModalEntrega(
          pedido,
          index
        );
      };

    /* MOSTRAR PRODUCTOS */

    function crearProductosHTML(
      productos,
      mostrarPendiente = true
    ) {
      if (
        !Array.isArray(productos) ||
        productos.length === 0
      ) {
        return `
          <p style="
            color:#737985;
            font-size:13px;
          ">
            No hay artículos pendientes.
          </p>
        `;
      }

      return productos.map(
        producto => {
          const cantidad =
            obtenerCantidadProducto(
              producto
            );

          const precio =
            obtenerPrecioProducto(
              producto
            );

          const subtotal =
            calcularSubtotalProducto(
              producto
            );

          return `
            <div class="producto">

              <div class="producto-image">

                <img
                  src="${escaparHTML(
                    obtenerImagenProducto(
                      producto
                    ) ||
                    "https://via.placeholder.com/58?text=P"
                  )}"
                  alt="${escaparHTML(
                    obtenerNombreProducto(
                      producto
                    )
                  )}"
                  onerror="
                    this.onerror=null;
                    this.src='https://via.placeholder.com/58?text=P';
                  "
                >

              </div>

              <div class="producto-info">

                <p>
                  <strong>
                    ${escaparHTML(
                      obtenerNombreProducto(
                        producto
                      )
                    )}
                  </strong>
                </p>

                <p>
                  Cantidad:
                  ${cantidad.toLocaleString(
                    "es-DO"
                  )}
                </p>

                <p>
                  Precio:
                  $${formatearMoneda(
                    precio
                  )}
                </p>

                <p>
                  Subtotal:
                  $${formatearMoneda(
                    subtotal
                  )}
                </p>

              </div>

              ${
                mostrarPendiente
                  ? `
                    <span class="pending-label">
                      Pendiente
                    </span>
                  `
                  : ""
              }

            </div>
          `;
        }
      ).join("");
    }

    function crearDespachadosHTML(
      productos
    ) {
      if (
        !Array.isArray(productos) ||
        productos.length === 0
      ) {
        return "";
      }

      return `
        <div class="dispatched-section">

          <div class="dispatched-section-title">
            <i class="fa-solid fa-circle-check"></i>
            Artículos despachados
          </div>

          ${productos.map(
            producto => `
              <div class="dispatched-item">

                <strong>
                  ${escaparHTML(
                    obtenerNombreProducto(
                      producto
                    )
                  )}
                </strong>

                <span>
                  Cantidad:
                  ${obtenerCantidadProducto(
                    producto
                  ).toLocaleString(
                    "es-DO"
                  )}
                </span>

              </div>
            `
          ).join("")}

        </div>
      `;
    }

    /* RENDERIZAR PEDIDOS */

    function renderHistorial() {
      historialContainer.innerHTML = "";

      const unidadesPendientes =
        historial.reduce(
          (total, pedido) => {
            const productos =
              Array.isArray(
                pedido.productos
              )
                ? pedido.productos
                : [];

            return total +
              productos.reduce(
                (suma, producto) =>
                  suma +
                  obtenerCantidadProducto(
                    producto
                  ),
                0
              );
          },
          0
        );

      ordersCount.textContent =
        `${historial.length} ${
          historial.length === 1
            ? "pedido"
            : "pedidos"
        } · ${unidadesPendientes} pendientes`;

      if (historial.length === 0) {
        historialContainer.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              <i class="fa-solid fa-box-open"></i>
            </div>

            <h3>
              No hay pedidos pendientes
            </h3>

            <p>
              Los nuevos pedidos aparecerán en esta sección.
            </p>

          </div>
        `;

        return;
      }

      historial.forEach(
        (pedido, index) => {
          const cliente =
            obtenerClienteParaPedido(
              pedido
            );

          const pendientes =
            Array.isArray(
              pedido.productos
            )
              ? pedido.productos
              : [];

          const despachados =
            Array.isArray(
              pedido.productosDespachados
            )
              ? pedido.productosDespachados
              : [];

          const totalmenteDespachado =
            pedido.despachado === true &&
            pendientes.length === 0;

          const parcialmenteDespachado =
            !totalmenteDespachado &&
            despachados.length > 0;

          let claseEstado =
            "pendiente";

          let textoEstado =
            "Pendiente";

          if (totalmenteDespachado) {
            claseEstado =
              "despachado";

            textoEstado =
              "Despachado";
          } else if (
            parcialmenteDespachado
          ) {
            claseEstado =
              "parcial";

            textoEstado =
              "Parcial";
          }

          const totalMostrado =
            pendientes.length > 0
              ? calcularTotalProductos(
                  pendientes
                )
              : (
                  Number(
                    pedido.totalOriginal ??
                    pedido.total
                  ) ||
                  calcularTotalProductos(
                    despachados
                  )
                );

          const tarjeta =
            document.createElement(
              "article"
            );

          tarjeta.className = "venta";

          tarjeta.innerHTML = `
            <div class="venta-header">

              <div class="venta-heading">

                <div class="venta-icon">
                  <i class="fa-solid fa-box"></i>
                </div>

                <div class="venta-heading-text">

                  <strong>
                    ${escaparHTML(
                      cliente?.negocio ||
                      "Pedido pendiente"
                    )}
                  </strong>

                  <span>
                    ${escaparHTML(
                      pedido.fecha ||
                      "Sin fecha"
                    )}
                  </span>

                </div>

              </div>

              <span class="status-badge ${claseEstado}">
                ${textoEstado}
              </span>

            </div>

            <div class="cliente-info">

              <p>
                <i class="fa-solid fa-store"></i>

                <span>
                  <strong>Negocio:</strong>
                  ${escaparHTML(
                    cliente?.negocio ||
                    "No seleccionado"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-phone"></i>

                <span>
                  <strong>Teléfono:</strong>
                  ${escaparHTML(
                    cliente?.telefono ||
                    "-"
                  )}
                </span>
              </p>

              <p>
                <i class="fa-solid fa-location-dot"></i>

                <span>
                  <strong>Dirección:</strong>
                  ${escaparHTML(
                    cliente?.direccion ||
                    "-"
                  )}
                </span>
              </p>

            </div>

            <div class="products-title">
              ${
                pendientes.length > 0
                  ? "Artículos pendientes"
                  : "Pedido preparado"
              }
            </div>

            ${crearProductosHTML(
              pendientes,
              true
            )}

            ${crearDespachadosHTML(
              despachados
            )}

            <div class="order-summary">

              <div class="total">

                <span>
                  ${
                    pendientes.length > 0
                      ? "Total pendiente"
                      : "Total del pedido"
                  }
                </span>

                <strong>
                  $${formatearMoneda(
                    totalMostrado
                  )}
                </strong>

              </div>

              <span class="seller-pill">
                <i class="fa-solid fa-user"></i>

                ${escaparHTML(
                  pedido.vendedor ||
                  getVendedorSesionLegible()
                )}
              </span>

            </div>

            <div class="order-actions">

              <button
                type="button"
                class="btn dispatch-btn"
                onclick="despachar(${index})"
                ${
                  totalmenteDespachado
                    ? "disabled"
                    : ""
                }
              >
                <i class="${
                  totalmenteDespachado
                    ? "fa-solid fa-circle-check"
                    : "fa-solid fa-boxes-packing"
                }"></i>

                ${
                  totalmenteDespachado
                    ? "Despachado"
                    : parcialmenteDespachado
                      ? "Despachar restantes"
                      : "Despachar"
                }
              </button>

              <button
                type="button"
                class="btn deliver-btn ${
                  totalmenteDespachado
                    ? ""
                    : "hidden"
                }"
                onclick="entregarPedido(${index})"
              >
                <i class="fa-solid fa-truck-fast"></i>
                Entregar
              </button>

            </div>
          `;

          historialContainer.appendChild(
            tarjeta
          );
        }
      );
    }

    function recargarPedidos() {
      recargarDatos();
      migrarPedidosAntiguos();
      renderHistorial();

      Swal.fire({
        position: "center",
        icon: "success",
        title: "Pedidos actualizados",
        showConfirmButton: false,
        timer: 1200
      });
    }

    window.addEventListener(
      "storage",
      evento => {
        if (
          evento.key ===
            "historialPedidos" ||
          evento.key ===
            "ventasRealizadas" ||
          evento.key ===
            "cuentasPorCobrar"
        ) {
          recargarDatos();
          migrarPedidosAntiguos();
          renderHistorial();
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          recargarDatos();
          migrarPedidosAntiguos();
          renderHistorial();
        }
      }
    );

    recargarDatos();
    migrarPedidosAntiguos();
    renderHistorial();
  </script>

</body>
</html>
