<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Perfil del Usuario</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>
    :root {
      --orange: #f26a21;
      --orange-dark: #a83b0b;
      --orange-light: #fff1e8;
      --black: #080808;
      --white: #ffffff;
      --background: #f4f5f7;
      --text: #111827;
      --muted: #737985;
      --line: #e7e8eb;
      --green: #159638;
      --green-light: #eaf8e9;
      --blue: #087be7;
      --blue-light: #e4f3ff;
      --purple: #7128df;
      --purple-light: #f0e8ff;
      --red: #e52424;
      --red-light: #ffeaea;
      --yellow: #a96c00;
      --yellow-light: #fff3cf;
      --cyan: #0891b2;
      --cyan-light: #e5f8fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      padding-top: 78px;
      padding-bottom: 105px;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* ENCABEZADO */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1200;
      width: 100%;
      height: 78px;
      padding: 0 18px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
    }

    .header-title i {
      color: var(--orange);
      font-size: 24px;
    }

    .header-button {
      width: 48px;
      height: 48px;
      border: 1px solid #373737;
      border-radius: 15px;
      background: linear-gradient(145deg, #191919, #080808);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.03);
    }

    .header-button.logout {
      color: var(--orange);
    }

    .header-button:active {
      transform: scale(0.96);
    }

    /* CONTENIDO */

    .container {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* TARJETA DE PERFIL */

    .profile-card {
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      padding: 24px 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #101010, #252525);
      color: #fff;
      box-shadow: 0 9px 28px rgba(0, 0, 0, 0.18);
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: -60px;
      right: -45px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(242, 106, 33, 0.17);
    }

    .profile-card::after {
      content: "";
      position: absolute;
      right: 65px;
      bottom: -80px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(242, 106, 33, 0.08);
    }

    .profile-card-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-avatar {
      width: 68px;
      height: 68px;
      border: 2px solid rgba(242, 106, 33, 0.6);
      border-radius: 20px;
      background: rgba(242, 106, 33, 0.13);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      flex-shrink: 0;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-info small {
      display: block;
      margin-bottom: 4px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .profile-info h1 {
      margin-bottom: 5px;
      color: #fff;
      font-size: 23px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .profile-info p {
      color: #c8c8c8;
      font-size: 13px;
    }

    /* TÍTULOS */

    .section-title {
      margin: 0 3px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title h2 {
      color: #111;
      font-size: 19px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    /* OPCIONES */

    .menu-list {
      display: grid;
      gap: 13px;
    }

    .menu-button {
      position: relative;
      width: 100%;
      min-height: 76px;
      padding: 13px 15px;
      border: 1px solid #ececec;
      border-radius: 19px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .menu-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.1);
    }

    .menu-button:active {
      transform: scale(0.985);
    }

    .menu-icon {
      width: 49px;
      height: 49px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .menu-button.clientes .menu-icon {
      background: var(--blue-light);
      color: var(--blue);
    }

    .menu-button.nuevo-cliente .menu-icon {
      background: var(--cyan-light);
      color: var(--cyan);
    }

    .menu-button.pedidos .menu-icon {
      background: var(--orange-light);
      color: var(--orange);
    }

    .menu-button.ventas .menu-icon {
      background: var(--green-light);
      color: var(--green);
    }

    .menu-button.reporte .menu-icon {
      background: #e8f1ff;
      color: #2563eb;
    }

    .menu-button.producto .menu-icon {
      background: var(--purple-light);
      color: var(--purple);
    }

    .menu-text {
      min-width: 0;
      flex: 1;
    }

    .menu-text strong {
      display: block;
      margin-bottom: 5px;
      color: #111;
      font-size: 16px;
    }

    .menu-text span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .menu-arrow {
      color: #a5a9b0;
      font-size: 17px;
      transition: transform 0.25s;
    }

    .menu-button.ventas.abierto .menu-arrow {
      transform: rotate(90deg);
    }

    /* BURBUJA PEDIDOS */

    .bubble-pedidos {
      position: absolute;
      top: 10px;
      right: 12px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 18px;
      text-align: center;
      display: none;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
    }

    /* SUBMENÚ */

    .submenu {
      max-height: 0;
      margin-top: -6px;
      padding-left: 18px;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.35s ease,
        opacity 0.25s ease,
        margin 0.35s ease;
    }

    .submenu.abierto {
      max-height: 190px;
      margin-top: 0;
      opacity: 1;
    }

    .submenu-inner {
      padding: 8px 0 1px 18px;
      border-left: 3px solid var(--green-light);
      display: grid;
      gap: 9px;
    }

    .submenu-btn {
      width: 100%;
      min-height: 56px;
      padding: 10px 13px;
      border: 1px solid #dcecdc;
      border-radius: 15px;
      background: #f4fbf4;
      color: #263229;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.2s, transform 0.2s;
    }

    .submenu-btn:hover {
      background: #e7f7e7;
    }

    .submenu-btn:active {
      transform: scale(0.985);
    }

    .submenu-btn i {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--green-light);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    /* CERRAR SESIÓN */

    .logout-section {
      margin-top: 22px;
    }

    .logout-button {
      width: 100%;
      min-height: 62px;
      padding: 12px 16px;
      border: 1px solid #ffd7d7;
      border-radius: 17px;
      background: var(--red-light);
      color: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(229, 36, 36, 0.08);
    }

    .logout-button:hover {
      background: #ffdddd;
    }

    .logout-button:active {
      transform: scale(0.985);
    }

    /* MENÚ INFERIOR */

    .bottom-nav {
      position: fixed;
      z-index: 1300;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 760px);
      height: 84px;
      padding: 7px 12px 5px;
      background: #090909;
      border-radius: 24px 24px 0 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      box-shadow: 0 -7px 24px rgba(0, 0, 0, 0.24);
    }

    .nav-item {
      position: relative;
      height: 67px;
      border: none;
      border-radius: 15px;
      background: transparent;
      color: #b8b8b8;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-item:hover {
      background: #1a1a1a;
      color: #fff;
    }

    .nav-item i {
      font-size: 22px;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #e95414, #a83b0b);
      color: #fff;
      font-weight: 700;
    }

    .nav-badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 25px);
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border: 2px solid #090909;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 15px;
      text-align: center;
      display: none;
    }

    .nav-badge.user {
      background: var(--orange);
    }

    /* RESPONSIVE */

    @media (max-width: 620px) {
      body {
        padding-top: 70px;
      }

      .header {
        height: 70px;
        padding: 0 12px;
      }

      .header-button {
        width: 43px;
        height: 43px;
        font-size: 20px;
      }

      .header-title {
        font-size: 18px;
      }

      .header-title i {
        font-size: 21px;
      }

      .container {
        padding: 17px 10px;
      }

      .profile-card {
        padding: 21px 17px;
      }

      .profile-avatar {
        width: 59px;
        height: 59px;
        border-radius: 18px;
        font-size: 27px;
      }

      .profile-info h1 {
        font-size: 20px;
      }

      .menu-button {
        min-height: 72px;
        padding: 12px 13px;
      }

      .menu-icon {
        width: 46px;
        height: 46px;
        font-size: 19px;
      }

      .menu-text strong {
        font-size: 15px;
      }

      .menu-text span {
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      .header-title span {
        font-size: 16px;
      }

      .profile-card-content {
        gap: 12px;
      }

      .profile-avatar {
        width: 54px;
        height: 54px;
        font-size: 24px;
      }

      .profile-info h1 {
        font-size: 18px;
      }

      .menu-button {
        gap: 11px;
      }

      .menu-icon {
        width: 43px;
        height: 43px;
      }

      .menu-text span {
        font-size: 11px;
      }

      .nav-item {
        font-size: 10px;
      }

      .nav-item i {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="header-button"
      onclick="volver()"
      aria-label="Volver"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="header-title">
      <i class="fa-solid fa-user-gear"></i>
      <span>Configuración</span>
    </div>

    <button
      type="button"
      class="header-button logout"
      onclick="cerrarSesion()"
      aria-label="Cerrar sesión"
      title="Cerrar sesión"
    >
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>

  </header>

  <main class="container">

    <section class="profile-card">

      <div class="profile-card-content">

        <div class="profile-avatar">
          <i class="fa-solid fa-user"></i>
        </div>

        <div class="profile-info">
          <small>Perfil del usuario</small>

          <h1 id="nombrePerfil">
            Usuario
          </h1>

          <p id="rolPerfil">
            Administrador
          </p>
        </div>

      </div>

    </section>

    <div class="section-title">
      <h2>Opciones</h2>
      <span>Administración</span>
    </div>

    <section class="menu-list">

      <button
        type="button"
        class="menu-button clientes"
        onclick="irA('Clientes.html')"
      >

        <div class="menu-icon">
          <i class="fa-solid fa-user-group"></i>
        </div>

        <div class="menu-text">
          <strong>Clientes</strong>
          <span>Consulta y administra tus clientes.</span>
        </div>

        <i class="fa-solid fa-chevron-right menu-arrow"></i>

      </button>

      <button
        type="button"
        class="menu-button nuevo-cliente"
        onclick="irA('registrar-cliente.html')"
      >

        <div class="menu-icon">
          <i class="fa-solid fa-user-plus"></i>
        </div>

        <div class="menu-text">
          <strong>Nuevo cliente</strong>
          <span>Registra un nuevo cliente en el sistema.</span>
        </div>

        <i class="fa-solid fa-chevron-right menu-arrow"></i>

      </button>

      <button
        type="button"
        class="menu-button pedidos"
        onclick="irA('Pedidos.html')"
      >

        <div class="menu-icon">
          <i class="fa-solid fa-box"></i>
        </div>

        <div class="menu-text">
          <strong>Pedidos</strong>
          <span>Consulta el historial y estado de pedidos.</span>
        </div>

        <span
          class="bubble-pedidos"
          id="badgePedidos"
        >
          0
        </span>

        <i class="fa-solid fa-chevron-right menu-arrow"></i>

      </button>

      <button
        type="button"
        class="menu-button ventas"
        id="botonVentas"
        onclick="toggleSubmenu()"
      >

        <div class="menu-icon">
          <i class="fa-solid fa-dollar-sign"></i>
        </div>

        <div class="menu-text">
          <strong>Ventas</strong>
          <span>Consulta ventas al contado y a crédito.</span>
        </div>

        <i class="fa-solid fa-chevron-right menu-arrow"></i>

      </button>

      <div
        class="submenu"
        id="submenuVentas"
      >

        <div class="submenu-inner">

          <button
            type="button"
            class="submenu-btn"
            onclick="irA('ventas.html')"
          >
            <i class="fa-solid fa-money-bill-wave"></i>
            Ventas al contado
          </button>

          <button
            type="button"
            class="submenu-btn"
            onclick="irA('Cuentas.html')"
          >
            <i class="fa-solid fa-credit-card"></i>
            Ventas a crédito
          </button>

        </div>

      </div>

      <button
        type="button"
        class="menu-button reporte"
        onclick="irA('Reporte.html')"
      >

        <div class="menu-icon">
          <i class="fa-solid fa-chart-line"></i>
        </div>

        <div class="menu-text">
          <strong>Reporte</strong>
          <span>Consulta los resultados y estadísticas.</span>
        </div>

        <i class="fa-solid fa-chevron-right menu-arrow"></i>

      </button>

      <button
        type="button"
        class="menu-button producto"
        onclick="irA('crearProducto.html')"
      >

        <div class="menu-icon">
          <i class="fa-solid fa-box-open"></i>
        </div>

        <div class="menu-text">
          <strong>Crear producto</strong>
          <span>Agrega nuevos productos al inventario.</span>
        </div>

        <i class="fa-solid fa-chevron-right menu-arrow"></i>

      </button>

    </section>

    <section class="logout-section">

      <button
        type="button"
        class="logout-button"
        onclick="cerrarSesion()"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        Cerrar sesión
      </button>

    </section>

  </main>

  <nav class="bottom-nav">

    <a
      href="menu.html"
      class="nav-item"
    >
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
    </a>

    <a
      href="mapa.html"
      class="nav-item"
    >
      <i class="fa-solid fa-map-location-dot"></i>
      <span>Mapa</span>
    </a>

    <a
      href="Carrito.html"
      class="nav-item"
      id="nav-carrito"
    >
      <i class="fa-solid fa-cart-shopping"></i>

      <span
        class="nav-badge"
        id="cart-count"
      >
        0
      </span>

      <span>Carrito</span>
    </a>

    <a
      href="Usuario.html"
      class="nav-item active"
      id="nav-usuario"
      aria-current="page"
    >
      <i class="fa-solid fa-gear"></i>

      <span
        class="nav-badge user"
        id="user-count"
      >
        0
      </span>

      <span>Configuración</span>
    </a>

  </nav>

  <script>
    function irA(url) {
      window.location.href = url;
    }

    function toggleSubmenu() {
      const submenu =
        document.getElementById(
          "submenuVentas"
        );

      const boton =
        document.getElementById(
          "botonVentas"
        );

      submenu.classList.toggle(
        "abierto"
      );

      boton.classList.toggle(
        "abierto"
      );
    }

    function cerrarSesion() {
      if (
        confirm(
          "¿Estás seguro que deseas cerrar sesión?"
        )
      ) {
        alert(
          "Sesión cerrada correctamente"
        );

        localStorage.removeItem(
          "rol"
        );

        localStorage.removeItem(
          "nombreUsuario"
        );

        window.location.href =
          "login.html";
      }
    }

    function volver() {
      window.history.back();
    }

    function actualizarPerfil() {
      const nombre =
        localStorage.getItem(
          "nombreUsuario"
        ) || "Usuario";

      const rol =
        localStorage.getItem(
          "rol"
        ) || "Administrador";

      const nombrePerfil =
        document.getElementById(
          "nombrePerfil"
        );

      const rolPerfil =
        document.getElementById(
          "rolPerfil"
        );

      if (nombrePerfil) {
        nombrePerfil.textContent =
          nombre;
      }

      if (rolPerfil) {
        rolPerfil.textContent =
          rol;
      }
    }

    function actualizarContadorCarrito() {
      const badge =
        document.getElementById(
          "cart-count"
        );

      let cart = [];

      try {
        cart =
          JSON.parse(
            localStorage.getItem(
              "cart"
            )
          ) || [];
      } catch (error) {
        cart = [];
      }

      const total =
        cart.reduce(
          (sum, item) =>
            sum +
            Number(
              item.quantity || 0
            ),
          0
        );

      badge.textContent =
        total > 99
          ? "99+"
          : total;

      badge.style.display =
        total > 0
          ? "inline-block"
          : "none";
    }

    function actualizarBurbujaPedidos() {
      const elemento =
        document.getElementById(
          "badgePedidos"
        );

      let pedidos = [];

      try {
        pedidos =
          JSON.parse(
            localStorage.getItem(
              "historialPedidos"
            )
          ) || [];
      } catch (error) {
        pedidos = [];
      }

      const estadosPendientes = [
        "pendiente",
        "en proceso",
        "por entregar",
        "no entregado"
      ];

      const pendientes =
        pedidos.filter(pedido =>
          estadosPendientes.includes(
            String(
              pedido.estado || ""
            ).toLowerCase()
          )
        ).length;

      const count =
        pendientes > 0
          ? pendientes
          : pedidos.length;

      elemento.textContent =
        count > 99
          ? "99+"
          : count;

      elemento.style.display =
        count > 0
          ? "inline-block"
          : "none";
    }

    function actualizarBurbujaUsuario() {
      const elemento =
        document.getElementById(
          "user-count"
        );

      let pedidos = [];

      try {
        pedidos =
          JSON.parse(
            localStorage.getItem(
              "historialPedidos"
            )
          ) || [];
      } catch (error) {
        pedidos = [];
      }

      const estadosPendientes = [
        "pendiente",
        "en proceso",
        "por entregar",
        "no entregado"
      ];

      const pendientes =
        pedidos.filter(pedido =>
          estadosPendientes.includes(
            String(
              pedido.estado || ""
            ).toLowerCase()
          )
        ).length;

      const count =
        pendientes > 0
          ? pendientes
          : pedidos.length;

      elemento.textContent =
        count > 99
          ? "99+"
          : count;

      elemento.style.display =
        count > 0
          ? "inline-block"
          : "none";
    }

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        actualizarPerfil();
        actualizarContadorCarrito();
        actualizarBurbujaPedidos();
        actualizarBurbujaUsuario();
      }
    );

    window.addEventListener(
      "storage",
      evento => {
        if (
          evento.key === "cart"
        ) {
          actualizarContadorCarrito();
        }

        if (
          evento.key ===
          "historialPedidos"
        ) {
          actualizarBurbujaPedidos();
          actualizarBurbujaUsuario();
        }

        if (
          evento.key ===
            "nombreUsuario" ||
          evento.key === "rol"
        ) {
          actualizarPerfil();
        }
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          actualizarPerfil();
          actualizarContadorCarrito();
          actualizarBurbujaPedidos();
          actualizarBurbujaUsuario();
        }
      }
    );
  </script>

</body>
</html>
